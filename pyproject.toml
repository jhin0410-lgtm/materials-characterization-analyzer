[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-characterization-analyzer"
version = "0.9.0"
description = "Provenance-aware CLI support for XRD, SEM, EDS, Raman, TEM, SAED, XPS, FTIR, TGA, and DSC characterization workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "jhin0410-lgtm" },
]
requires-python = ">=3.10"
keywords = [
    "materials-science",
    "materials-characterization",
    "xrd",
    "sem",
    "eds",
    "raman",
    "tem",
    "saed",
    "xps",
    "ftir",
    "tga",
    "dsc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/jhin0410-lgtm/materials-characterization-analyzer"
Repository = "https://github.com/jhin0410-lgtm/materials-characterization-analyzer"
Issues = "https://github.com/jhin0410-lgtm/materials-characterization-analyzer/issues"
Changelog = "https://github.com/jhin0410-lgtm/materials-characterization-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
mca = "mca.cli_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=outputs/pytest-tmp"
