name: Apply TEM segmentation readiness contract fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-tem-segmentation-readiness-contract-fixes.yml"
      - "scripts/apply_tem_segmentation_readiness_contract_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Align readiness documentation patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_tem_segmentation_readiness_contract_fixes.py")
          text = path.read_text(encoding="utf-8")
          start = text.rindex("replace_exact(\n    readme,")
          end = text.index("\n)\n\nprint", start) + 3
          old = (
              "The supported conclusion is that the current evidence is insufficient for an "
              "independent segmentation-performance claim. This is not a conclusion about the "
              "U-Net's true accuracy. Evidence that would change the readiness conclusion is a "
              "checksum-bound, predeclared, parent-disjoint cobalt-oxide validation set with "
              "immutable acquisition lineage, independent expert labels, and documented non-use "
              "in training, tuning, threshold selection, or model selection."
          )
          new = old + (
              "\n\nThe training audit and parent-overlap audit must reference the same "
              "`source.training_images.sha256`. Passing an in-domain candidate or cross-material "
              "pilot gate permits only the next protocol-freeze step. Model inference, metric "
              "reporting, and independent performance claims remain false until a later frozen "
              "evaluation executes and records the predefined results and uncertainty."
          )
          replacement = (
              "replace_exact(\n"
              "    readme,\n"
              f"    {old!r},\n"
              f"    {new!r},\n"
              ")"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Apply deterministic patch
        run: python scripts/apply_tem_segmentation_readiness_contract_fixes.py

      - name: Bind integration fixtures to one training artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tem_candidate_registry_readiness_integration.py")
          text = path.read_text(encoding="utf-8")
          training_anchor = '        "software_version": "0.9.3",\n        "value_contract": {'
          parent_anchor = '        "software_version": "0.9.3",\n        "external_validation_readiness": {'
          if text.count(training_anchor) != 1 or text.count(parent_anchor) != 1:
              raise SystemExit("unexpected readiness integration fixture structure")
          text = text.replace(
              training_anchor,
              '        "software_version": "0.9.3",\n'
              '        "source": {"training_images": {"sha256": "a" * 64}},\n'
              '        "value_contract": {',
              1,
          )
          text = text.replace(
              parent_anchor,
              '        "software_version": "0.9.3",\n'
              '        "source": {"training_images": {"sha256": "a" * 64}},\n'
              '        "external_validation_readiness": {',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_tem_segmentation_readiness.py
          tests/test_tem_candidate_registry_readiness_integration.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_segmentation_readiness.py \
            tests/test_tem_segmentation_readiness.py \
            tests/test_tem_candidate_registry_readiness_integration.py \
            case_studies/tem_segmentation_readiness/README.md
          git commit -m "Fix TEM segmentation readiness contracts [readiness-contracts-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
