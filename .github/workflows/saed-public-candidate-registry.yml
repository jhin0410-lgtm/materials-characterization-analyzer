name: SAED public candidate registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mca/saed_external_validation_candidate_registry.py"
      - "src/mca/saed_external_validation_candidate_registry_cli.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_external_validation_candidate_registry.py"
      - "case_studies/saed_public_candidate_registry/**"
      - ".github/workflows/saed-public-candidate-registry.yml"
  push:
    branches:
      - main
    paths:
      - "src/mca/saed_external_validation_candidate_registry.py"
      - "src/mca/saed_external_validation_candidate_registry_cli.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_external_validation_candidate_registry.py"
      - "case_studies/saed_public_candidate_registry/**"
      - ".github/workflows/saed-public-candidate-registry.yml"

concurrency:
  group: saed-public-candidate-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused regressions
        run: pytest -q tests/test_saed_external_validation_candidate_registry.py

      - name: Run installed CLI
        run: |
          mca saed-candidates \
            --config case_studies/saed_public_candidate_registry/case_config.json \
            --output outputs/saed_public_candidate_registry

      - name: Verify fail-closed registry evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/saed_public_candidate_registry")
          summary = json.loads(
              (output / "saed_candidate_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["readiness"]["status"] == (
              "no_public_candidate_ready_for_predeclared_saed_evaluation"
          )
          assert summary["result_counts"]["candidate_count"] == 7
          assert summary["result_counts"][
              "dedicated_source_audit_ready_count"
          ] == 0
          assert summary["readiness"]["recommended_candidate_id"] == (
              "bir_microed_200kev_zenodo_10999587"
          )
          assert not summary["readiness"][
              "public_search_supports_saed_evaluation_now"
          ]
          assert not summary["processing"]["source_arrays_downloaded_by_registry"]
          assert not summary["processing"]["pattern_decoding_performed"]
          assert not summary["processing"]["analyzer_execution_performed"]

          manifest = json.loads(
              (output / "saed_candidate_artifact_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["artifact_count"] == 4
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert record["bytes"] == path.stat().st_size
              assert record["sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()

          forbidden = [
              path
              for path in output.rglob("*")
              if path.suffix.lower()
              in {".tif", ".tiff", ".dm3", ".dm4", ".mrc", ".tvips", ".zip"}
          ]
          assert not forbidden
          PY

      - name: Upload registry evidence
        uses: actions/upload-artifact@v7
        with:
          name: saed-public-candidate-registry-evidence
          path: outputs/saed_public_candidate_registry
          if-no-files-found: error
          retention-days: 30
