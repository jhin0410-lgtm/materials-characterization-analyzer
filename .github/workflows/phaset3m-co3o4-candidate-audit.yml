name: PhaseT3M Co3O4 candidate audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phaset3m-co3o4-candidate-audit.yml"
      - "case_studies/phaset3m_co3o4_candidate_audit/**"
      - "case_studies/tem_external_validation_candidate_registry/**"
      - "scripts/audit_phaset3m_co3o4_candidate.py"
      - "src/mca/phaset3m_candidate_audit.py"
      - "src/mca/tem_external_validation_candidate_registry.py"
      - "src/mca/tem_external_validation_candidate_registry_engine.py"
      - "tests/test_phaset3m_co3o4_candidate_audit.py"
      - "tests/test_tem_external_validation_candidate_registry.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download pinned PhaseT3M archive
        run: |
          set -euo pipefail
          mkdir -p data/local/phaset3m
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --user-agent "materials-characterization-analyzer/0.10" \
            --output data/local/phaset3m/raw_tilt_data.zip \
            "https://zenodo.org/records/17336678/files/raw_tilt_data.zip?download=1"

      - name: Audit checksum-bound archive and HDF5 structure
        run: |
          python scripts/audit_phaset3m_co3o4_candidate.py \
            --config case_studies/phaset3m_co3o4_candidate_audit/case_config.json \
            --archive data/local/phaset3m/raw_tilt_data.zip \
            --output outputs/phaset3m-co3o4-candidate-audit

      - name: Remove raw source files
        if: always()
        run: rm -rf data/local/phaset3m

      - name: Verify focused contracts
        run: |
          pytest -q \
            tests/test_phaset3m_co3o4_candidate_audit.py \
            tests/test_tem_external_validation_candidate_registry.py
          python -m build

      - name: Verify evidence package excludes raw files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              path
              for path in Path("outputs/phaset3m-co3o4-candidate-audit").rglob("*")
              if path.is_file() and path.suffix.lower() in {".h5", ".hdf5", ".zip"}
          ]
          if forbidden:
              raise SystemExit(f"raw source files leaked into evidence: {forbidden}")
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: phaset3m-co3o4-candidate-audit-evidence
          path: outputs/phaset3m-co3o4-candidate-audit/
          if-no-files-found: error
          retention-days: 30
