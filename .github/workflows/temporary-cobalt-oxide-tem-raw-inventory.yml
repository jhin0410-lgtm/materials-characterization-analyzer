name: Temporary cobalt oxide TEM raw-mask HDF5 audit

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-cobalt-oxide-tem-raw-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install HDF5 audit dependencies
        run: python -m pip install --disable-pip-version-check h5py numpy

      - name: Download exact public raw and mask archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/TEM_images.zip \
            "https://zenodo.org/records/14927582/files/TEM_images.zip?download=1"
          echo "d1e991346d07b8a112c4b6dbfd8367ba  /tmp/TEM_images.zip" | md5sum --check
          sha256sum /tmp/TEM_images.zip | tee cobalt-oxide-tem-raw-archive.sha256

          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/Segmented_images.zip \
            "https://zenodo.org/records/14927582/files/Segmented_images.zip?download=1"
          echo "63edc9b44264f8a1397bff806d58eade  /tmp/Segmented_images.zip" | md5sum --check
          echo "bd7816f3cf2869e4a349fc04d3e0d0464b3e14e9c8c8655f51e6e487fb59824b  /tmp/Segmented_images.zip" | sha256sum --check

      - name: Audit all ten raw-mask HDF5 pairs and fifty frames
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import shutil
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          import h5py
          import numpy as np

          raw_archive = Path("/tmp/TEM_images.zip")
          mask_archive = Path("/tmp/Segmented_images.zip")
          prefixes = [
              "Co0_2", "Co0_4", "Co0_5", "Co0_7", "Co0_8",
              "DW0_6", "DW0_7", "DW0_43", "DW0_85", "DW1_0",
          ]

          def hash_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def validate_zip(zf: zipfile.ZipFile, expected: set[str]) -> dict:
              assert zf.testzip() is None, "ZIP CRC validation failed"
              observed = set()
              metadata = []
              for info in zf.infolist():
                  name = info.filename
                  normalized = name.replace("\\", "/")
                  path = PurePosixPath(normalized)
                  assert name == normalized, name
                  assert not path.is_absolute(), name
                  assert ".." not in path.parts, name
                  assert not any(part in ("", ".") for part in path.parts), name
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode), name
                  assert not (info.flag_bits & 0x1), name
                  if name.startswith("__MACOSX/") or path.name.startswith("._"):
                      metadata.append(name)
                  elif not info.is_dir():
                      observed.add(name)
              assert observed == expected, (sorted(expected - observed), sorted(observed - expected))
              return {
                  "data_members": sorted(observed),
                  "metadata_members": sorted(metadata),
                  "crc_verified": True,
                  "safe_paths_verified": True,
              }

          def extract_member(zf: zipfile.ZipFile, member: str, destination: Path) -> str:
              digest = hashlib.sha256()
              with zf.open(member) as source, destination.open("wb") as target:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
                      target.write(chunk)
              return digest.hexdigest()

          def attrs_to_json(attrs) -> dict:
              result = {}
              for key in attrs.keys():
                  value = attrs[key]
                  if isinstance(value, np.ndarray):
                      value = value.tolist()
                  elif isinstance(value, np.generic):
                      value = value.item()
                  elif isinstance(value, bytes):
                      value = value.decode("utf-8", errors="replace")
                  result[str(key)] = value
              return result

          def frame_fingerprint(dataset, frame_index: int) -> dict:
              digest = hashlib.sha256()
              finite = True
              minimum = math.inf
              maximum = -math.inf
              total = 0.0
              total_sq = 0.0
              count = 0
              unique_values = set()
              height = dataset.shape[1]
              for start in range(0, height, 256):
                  block = np.asarray(dataset[frame_index, start : start + 256, :])
                  digest.update(np.ascontiguousarray(block).tobytes(order="C"))
                  finite = finite and bool(np.isfinite(block).all())
                  minimum = min(minimum, float(np.min(block)))
                  maximum = max(maximum, float(np.max(block)))
                  total += float(np.sum(block, dtype=np.float64))
                  total_sq += float(np.sum(np.square(block, dtype=np.float64), dtype=np.float64))
                  count += int(block.size)
                  if len(unique_values) <= 4:
                      unique_values.update(float(value) for value in np.unique(block)[:8])
              mean = total / count
              variance = max(0.0, total_sq / count - mean * mean)
              return {
                  "sha256_c_order": digest.hexdigest(),
                  "finite": finite,
                  "minimum": minimum,
                  "maximum": maximum,
                  "mean": mean,
                  "std": math.sqrt(variance),
                  "sampled_unique_values": sorted(unique_values)[:8],
              }

          raw_expected = {f"{prefix}_TEM_images.h5" for prefix in prefixes}
          mask_expected = {f"{prefix}_segmented_images.h5" for prefix in prefixes}
          file_rows = []
          frame_rows = []

          with zipfile.ZipFile(raw_archive) as raw_zip, zipfile.ZipFile(mask_archive) as mask_zip:
              raw_zip_inventory = validate_zip(raw_zip, raw_expected)
              mask_zip_inventory = validate_zip(mask_zip, mask_expected)
              with tempfile.TemporaryDirectory(prefix="mca-tem-pair-audit-") as temp_name:
                  temp = Path(temp_name)
                  for prefix in prefixes:
                      raw_member = f"{prefix}_TEM_images.h5"
                      mask_member = f"{prefix}_segmented_images.h5"
                      raw_path = temp / "raw.h5"
                      mask_path = temp / "mask.h5"
                      raw_member_sha256 = extract_member(raw_zip, raw_member, raw_path)
                      mask_member_sha256 = extract_member(mask_zip, mask_member, mask_path)

                      with h5py.File(raw_path, "r") as raw_h5, h5py.File(mask_path, "r") as mask_h5:
                          raw_keys = list(raw_h5.keys())
                          mask_keys = list(mask_h5.keys())
                          assert len(raw_keys) == 1, (raw_member, raw_keys)
                          assert len(mask_keys) == 1, (mask_member, mask_keys)
                          raw_dataset = raw_h5[raw_keys[0]]
                          mask_dataset = mask_h5[mask_keys[0]]
                          assert isinstance(raw_dataset, h5py.Dataset)
                          assert isinstance(mask_dataset, h5py.Dataset)
                          same_shape = tuple(raw_dataset.shape) == tuple(mask_dataset.shape)
                          assert same_shape
                          assert len(raw_dataset.shape) == 3

                          raw_root_attrs = attrs_to_json(raw_h5.attrs)
                          mask_root_attrs = attrs_to_json(mask_h5.attrs)
                          raw_dataset_attrs = attrs_to_json(raw_dataset.attrs)
                          mask_dataset_attrs = attrs_to_json(mask_dataset.attrs)
                          file_rows.append(
                              {
                                  "prefix": prefix,
                                  "raw_member": raw_member,
                                  "mask_member": mask_member,
                                  "raw_member_sha256": raw_member_sha256,
                                  "mask_member_sha256": mask_member_sha256,
                                  "raw_dataset_name": raw_keys[0],
                                  "mask_dataset_name": mask_keys[0],
                                  "raw_shape": json.dumps(list(raw_dataset.shape)),
                                  "mask_shape": json.dumps(list(mask_dataset.shape)),
                                  "raw_dtype": str(raw_dataset.dtype),
                                  "mask_dtype": str(mask_dataset.dtype),
                                  "raw_root_attrs": json.dumps(raw_root_attrs, sort_keys=True),
                                  "mask_root_attrs": json.dumps(mask_root_attrs, sort_keys=True),
                                  "raw_dataset_attrs": json.dumps(raw_dataset_attrs, sort_keys=True),
                                  "mask_dataset_attrs": json.dumps(mask_dataset_attrs, sort_keys=True),
                                  "same_shape": same_shape,
                                  "same_frame_count": raw_dataset.shape[0] == mask_dataset.shape[0],
                                  "source_asserted_correspondence": True,
                                  "independent_pairing_verification": False,
                                  "pixel_calibration_available": False,
                              }
                          )

                          for frame_index in range(raw_dataset.shape[0]):
                              raw_fp = frame_fingerprint(raw_dataset, frame_index)
                              mask_fp = frame_fingerprint(mask_dataset, frame_index)
                              assert raw_fp["finite"]
                              assert mask_fp["finite"]
                              assert mask_fp["sampled_unique_values"] == [0.0, 1.0]
                              frame_rows.append(
                                  {
                                      "prefix": prefix,
                                      "frame_index": frame_index,
                                      "raw_member": raw_member,
                                      "mask_member": mask_member,
                                      "raw_frame_sha256": raw_fp["sha256_c_order"],
                                      "mask_frame_sha256": mask_fp["sha256_c_order"],
                                      "raw_min": raw_fp["minimum"],
                                      "raw_max": raw_fp["maximum"],
                                      "raw_mean": raw_fp["mean"],
                                      "raw_std": raw_fp["std"],
                                      "mask_min": mask_fp["minimum"],
                                      "mask_max": mask_fp["maximum"],
                                      "same_shape": True,
                                      "pairing_basis": "source_description_plus_exact_prefix_and_frame_index",
                                      "independent_pairing_verification": False,
                                      "pixel_calibration_applied": False,
                                  }
                              )

                      raw_path.unlink()
                      mask_path.unlink()

          with open("cobalt-oxide-tem-raw-mask-file-pairs.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(file_rows[0]))
              writer.writeheader()
              writer.writerows(file_rows)
          with open("cobalt-oxide-tem-raw-mask-frame-pairs.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(frame_rows[0]))
              writer.writeheader()
              writer.writerows(frame_rows)

          raw_archive_sha256 = hash_file(raw_archive)
          summary = {
              "schema_version": "1.0",
              "source": {
                  "doi": "10.5281/zenodo.14927582",
                  "version": "v1",
                  "license": "CC-BY-4.0",
                  "raw_archive": {
                      "name": "TEM_images.zip",
                      "published_md5": "d1e991346d07b8a112c4b6dbfd8367ba",
                      "sha256": raw_archive_sha256,
                  },
                  "mask_archive": {
                      "name": "Segmented_images.zip",
                      "published_md5": "63edc9b44264f8a1397bff806d58eade",
                      "sha256": "bd7816f3cf2869e4a349fc04d3e0d0464b3e14e9c8c8655f51e6e487fb59824b",
                  },
                  "source_description_states_corresponding_segmentations": True,
              },
              "raw_zip_inventory": raw_zip_inventory,
              "mask_zip_inventory": mask_zip_inventory,
              "file_pair_count": len(file_rows),
              "frame_pair_count": len(frame_rows),
              "all_file_prefixes_exactly_matched": True,
              "all_raw_mask_shapes_equal": all(row["same_shape"] for row in file_rows),
              "all_frame_counts_equal": all(row["same_frame_count"] for row in file_rows),
              "raw_dataset_names": sorted({row["raw_dataset_name"] for row in file_rows}),
              "mask_dataset_names": sorted({row["mask_dataset_name"] for row in file_rows}),
              "raw_shapes": sorted({row["raw_shape"] for row in file_rows}),
              "mask_shapes": sorted({row["mask_shape"] for row in file_rows}),
              "raw_dtypes": sorted({row["raw_dtype"] for row in file_rows}),
              "mask_dtypes": sorted({row["mask_dtype"] for row in file_rows}),
              "raw_attributes_present": any(row["raw_root_attrs"] != "{}" or row["raw_dataset_attrs"] != "{}" for row in file_rows),
              "mask_attributes_present": any(row["mask_root_attrs"] != "{}" or row["mask_dataset_attrs"] != "{}" for row in file_rows),
              "pairing_status": "source_asserted_structurally_consistent_not_independently_verified",
              "pixel_calibration_status": "blocked_no_per_file_or_per_frame_calibration_in_selected_hdf5",
              "filename_condition_semantics_interpreted": False,
              "model_training_performed": False,
              "model_inference_performed": False,
              "segmentation_accuracy_computed": False,
              "physical_size_computed": False,
              "scientific_closeout": {
                  "status": "Diagnostic",
                  "supported": [
                      "exact raw and mask archive identity",
                      "ten exact basename-prefix pairs",
                      "equal HDF5 array shapes and frame counts",
                      "frame-index pairing inventory",
                      "per-member and per-frame content fingerprints",
                  ],
                  "not_supported": [
                      "independent proof that every mask is the correct scientific segmentation for its indexed raw image",
                      "per-image pixel calibration",
                      "nanometre particle dimensions",
                      "segmentation accuracy or model performance",
                      "synthesis-condition interpretation from filenames",
                      "causal, predictive, optimization, or engineering-release claims",
                  ],
              },
          }
          Path("cobalt-oxide-tem-raw-mask-pairing-audit.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          sha256sum cobalt-oxide-tem-raw-mask-pairing-audit.json \
            cobalt-oxide-tem-raw-mask-file-pairs.csv \
            cobalt-oxide-tem-raw-mask-frame-pairs.csv \
            > cobalt-oxide-tem-raw-mask-audit-artifacts.sha256

      - name: Upload complete pairing audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: cobalt-oxide-tem-raw-mask-hdf5-audit
          path: |
            cobalt-oxide-tem-raw-archive.sha256
            cobalt-oxide-tem-raw-mask-pairing-audit.json
            cobalt-oxide-tem-raw-mask-file-pairs.csv
            cobalt-oxide-tem-raw-mask-frame-pairs.csv
            cobalt-oxide-tem-raw-mask-audit-artifacts.sha256
          if-no-files-found: error
          retention-days: 7
