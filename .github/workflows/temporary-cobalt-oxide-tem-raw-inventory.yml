name: Temporary cobalt oxide TEM raw archive inventory

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-cobalt-oxide-tem-raw-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install remote ZIP inventory dependency
        run: python -m pip install --disable-pip-version-check remotezip

      - name: Inspect exact public raw TEM archive by HTTP range
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import stat
          from collections import Counter
          from pathlib import PurePosixPath

          from remotezip import RemoteZip

          url = "https://zenodo.org/records/14927582/files/TEM_images.zip?download=1"
          published_md5 = "d1e991346d07b8a112c4b6dbfd8367ba"
          expected_mask_members = [
              "Co0_2_segmented_images.h5",
              "Co0_4_segmented_images.h5",
              "Co0_5_segmented_images.h5",
              "Co0_7_segmented_images.h5",
              "Co0_8_segmented_images.h5",
              "DW0_6_segmented_images.h5",
              "DW0_7_segmented_images.h5",
              "DW0_43_segmented_images.h5",
              "DW0_85_segmented_images.h5",
              "DW1_0_segmented_images.h5",
          ]
          expected_prefixes = sorted(
              name.removesuffix("_segmented_images.h5") for name in expected_mask_members
          )

          entries = []
          suffix_counts: Counter[str] = Counter()
          observed_paths = set()
          duplicate_exact = []
          duplicate_casefold = []
          seen_casefold = set()

          with RemoteZip(url) as archive:
              for info in archive.infolist():
                  raw_name = info.filename
                  normalized = raw_name.replace("\\", "/")
                  path = PurePosixPath(normalized)
                  assert raw_name == normalized, f"backslash path rejected: {raw_name!r}"
                  assert not path.is_absolute(), f"absolute path rejected: {raw_name!r}"
                  assert ".." not in path.parts, f"path traversal rejected: {raw_name!r}"
                  assert not any(part in ("", ".") for part in path.parts), raw_name
                  unix_mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(unix_mode), f"symlink rejected: {raw_name!r}"
                  assert not (info.flag_bits & 0x1), f"encrypted entry rejected: {raw_name!r}"

                  if raw_name in observed_paths:
                      duplicate_exact.append(raw_name)
                  observed_paths.add(raw_name)
                  folded = raw_name.casefold()
                  if folded in seen_casefold:
                      duplicate_casefold.append(raw_name)
                  seen_casefold.add(folded)

                  suffix = path.suffix.lower() or "<none>"
                  suffix_counts[suffix] += 1
                  ratio = info.file_size / info.compress_size if info.compress_size else None
                  first_bytes_hex = None
                  if not info.is_dir() and info.file_size:
                      with archive.open(info) as handle:
                          first_bytes_hex = handle.read(32).hex()
                  entries.append(
                      {
                          "path": raw_name,
                          "basename": path.name,
                          "suffix": suffix,
                          "is_directory": info.is_dir(),
                          "uncompressed_bytes": info.file_size,
                          "compressed_bytes": info.compress_size,
                          "compression_type": info.compress_type,
                          "compression_ratio": ratio,
                          "crc32": f"{info.CRC:08x}",
                          "first_32_bytes_hex": first_bytes_hex,
                      }
                  )

          assert entries, "raw archive contains no entries"
          assert not duplicate_exact, duplicate_exact
          assert not duplicate_casefold, duplicate_casefold

          nonmetadata = [
              row for row in entries
              if not row["path"].startswith("__MACOSX/")
              and not PurePosixPath(row["path"]).name.startswith("._")
              and not row["is_directory"]
          ]
          raw_stems = sorted(PurePosixPath(row["path"]).stem for row in nonmetadata)
          prefix_matches = {
              prefix: [stem for stem in raw_stems if stem == prefix or stem.startswith(prefix + "_")]
              for prefix in expected_prefixes
          }
          unmatched_prefixes = [key for key, values in prefix_matches.items() if not values]

          inventory = {
              "schema_version": "1.0",
              "source": {
                  "repository": "Zenodo",
                  "record_id": 14927582,
                  "doi": "10.5281/zenodo.14927582",
                  "dataset_version": "v1",
                  "license": "CC-BY-4.0",
                  "file_name": "TEM_images.zip",
                  "published_md5": published_md5,
                  "url": url,
              },
              "archive": {
                  "entry_count": len(entries),
                  "nonmetadata_file_count": len(nonmetadata),
                  "suffix_counts": dict(sorted(suffix_counts.items())),
                  "total_uncompressed_bytes": sum(row["uncompressed_bytes"] for row in entries),
                  "total_compressed_bytes": sum(row["compressed_bytes"] for row in entries),
                  "duplicate_exact_paths": duplicate_exact,
                  "duplicate_casefold_paths": duplicate_casefold,
                  "safe_paths_verified": True,
                  "symlinks_absent": True,
                  "encrypted_entries_absent": True,
                  "full_archive_downloaded": False,
                  "central_directory_read_by_http_range": True,
              },
              "mask_pairing_name_audit": {
                  "expected_mask_prefixes": expected_prefixes,
                  "raw_stems": raw_stems,
                  "prefix_matches": prefix_matches,
                  "unmatched_prefixes": unmatched_prefixes,
                  "pairing_confirmed": False,
                  "reason": (
                      "Filename similarity alone does not establish frame order, pixel calibration, "
                      "or raw-image-to-mask identity."
                  ),
              },
              "entries": entries,
              "scientific_interpretation_performed": False,
              "pixel_calibration_applied": False,
              "raw_mask_pairing_claimed": False,
              "model_training_performed": False,
          }
          with open("cobalt-oxide-tem-raw-archive-inventory.json", "w", encoding="utf-8") as handle:
              json.dump(inventory, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(inventory["archive"], indent=2, sort_keys=True))
          print(json.dumps(inventory["mask_pairing_name_audit"], indent=2, sort_keys=True))
          PY
          sha256sum cobalt-oxide-tem-raw-archive-inventory.json \
            > cobalt-oxide-tem-raw-archive-inventory.sha256

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v7
        with:
          name: cobalt-oxide-tem-raw-archive-inventory
          path: |
            cobalt-oxide-tem-raw-archive-inventory.json
            cobalt-oxide-tem-raw-archive-inventory.sha256
          if-no-files-found: error
          retention-days: 7
