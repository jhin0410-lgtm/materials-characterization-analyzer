name: Zenodo Ge DM3 TEM SAED source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_zenodo_ge_dm3_tem_saed.py"
      - "scripts/run_zenodo_ge_dm3_tem_saed_audit.py"
      - "tests/test_audit_zenodo_ge_dm3_tem_saed.py"
      - "tests/test_run_zenodo_ge_dm3_tem_saed_audit.py"
      - "case_studies/zenodo_ge_dm3_tem_saed_source_audit/**"
      - ".github/workflows/zenodo-ge-dm3-tem-saed-source-audit.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/audit_zenodo_ge_dm3_tem_saed.py"
      - "scripts/run_zenodo_ge_dm3_tem_saed_audit.py"
      - "tests/test_audit_zenodo_ge_dm3_tem_saed.py"
      - "tests/test_run_zenodo_ge_dm3_tem_saed_audit.py"
      - "case_studies/zenodo_ge_dm3_tem_saed_source_audit/**"
      - ".github/workflows/zenodo-ge-dm3-tem-saed-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: zenodo-ge-dm3-tem-saed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install archive and metadata tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libimage-exiftool-perl || \
            sudo apt-get install -y 7zip libimage-exiftool-perl
          command -v 7z || command -v 7zz || command -v 7za
          exiftool -ver

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused fail-closed tests
        run: |
          python -m py_compile \
            scripts/audit_zenodo_ge_dm3_tem_saed.py \
            scripts/run_zenodo_ge_dm3_tem_saed_audit.py
          pytest -q \
            tests/test_audit_zenodo_ge_dm3_tem_saed.py \
            tests/test_run_zenodo_ge_dm3_tem_saed_audit.py

      - name: Run live transient native-DM3 audit
        run: |
          python scripts/run_zenodo_ge_dm3_tem_saed_audit.py \
            --config case_studies/zenodo_ge_dm3_tem_saed_source_audit/case_config.json \
            --output outputs/zenodo_ge_dm3_tem_saed_source_audit

      - name: Verify metadata-only evidence and scientific boundary
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/zenodo_ge_dm3_tem_saed_source_audit")
          summary = json.loads(
              (root / "zenodo_ge_dm3_tem_saed_audit_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["status"] == (
              "checksum_verified_native_dm3_tem_saed_inventory_completed_but_"
              "calibration_and_lineage_metadata_incomplete"
          )
          assert summary["record"]["id"] == 15082448
          assert summary["record"]["doi"] == "10.5281/zenodo.15082448"
          assert summary["record"]["license_id"] == "cc-by-4.0"
          assert summary["archive"]["key"] == "10.5281zenodo.15082448.7z"
          assert summary["archive"]["md5"] == "535f513e05d88a9b14a3bc6fde8ae3bd"
          assert 250_000_000 < summary["archive"]["bytes"] < 400_000_000
          assert len(summary["archive"]["sha256"]) == 64
          assert summary["archive"]["integrity_test_passed"] is True
          assert summary["member_count"] >= 8
          assert summary["representation_counts"]["native_microscopy_container"] >= 8
          assert summary["role_cue_counts"]["static_saed_name_cue"] >= 4
          assert summary["role_cue_counts"]["tem_name_cue"] >= 4
          assert len(summary["required_members"]) == 8
          assert summary["selected_dm3_member_count"] >= 8
          assert summary["evidence_assessment"]["record_and_archive_identity"] == "Supported"
          assert summary["evidence_assessment"]["native_dm3_tem_saed_representation"] == "Supported"
          assert summary["evidence_assessment"]["pattern_centre_and_reciprocal_calibration"] == "Inconclusive"
          assert summary["evidence_assessment"]["reuse_authorization"] == "Supported"
          assert summary["evidence_assessment"]["dm3_metadata_extraction"] in {
              "Supported",
              "Supported_with_recorded_ExifTool_warnings",
          }
          assert summary["readiness"]["external_validation_ready"] is False
          assert summary["readiness"]["engineering_decision_ready"] is False
          assert summary["processing"]["source_archive_retained"] is False
          assert summary["processing"]["source_members_retained"] is False
          assert summary["processing"]["pixel_arrays_exported"] is False
          assert summary["processing"]["model_inference_performed"] is False
          assert summary["processing"]["parameter_tuning_performed"] is False
          assert summary["processing"]["model_retraining_performed"] is False
          assert summary["processing"]["phase_indexing_performed"] is False
          assert any("w0 diff.dm3" in item for item in summary["source_quality_flags"])
          assert any("CC BY 4.0" in item for item in summary["source_quality_flags"])
          assert "explicit dataset reuse licence or written permission" not in summary["unresolved"]

          software = summary["software_quality_flags"]
          assert set(software["exiftool_exit_codes"]).issubset({0, 1})
          assert software["exiftool_warning_count"] == len(software["exiftool_warnings"])
          assert all("/home/runner/" not in item for item in software["exiftool_warnings"])

          with (root / "zenodo_ge_dm3_tem_saed_member_inventory.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              inventory = list(csv.DictReader(handle))
          assert len(inventory) == summary["member_count"]
          assert sum(row["suffix"].lower() == ".dm3" for row in inventory) >= 8

          with (root / "zenodo_ge_dm3_selected_member_identity.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              selected = list(csv.DictReader(handle))
          assert len(selected) == summary["selected_dm3_member_count"]
          assert all(len(row["sha256"]) == 64 for row in selected)
          assert all(int(row["bytes"]) > 0 for row in selected)

          metadata = json.loads(
              (root / "zenodo_ge_dm3_selected_metadata.json").read_text(
                  encoding="utf-8"
              )
          )
          assert len(metadata) == summary["selected_dm3_member_count"]
          assert all(item["metadata_field_count"] >= 1 for item in metadata)
          assert all(not Path(item["member_path"]).is_absolute() for item in metadata)
          assert all(item["exiftool_exit_code"] in {0, 1} for item in metadata)
          assert all(
              item["exiftool_warning_count"] == len(item["exiftool_warnings"])
              for item in metadata
          )

          manifest = json.loads(
              (root / "zenodo_ge_dm3_tem_saed_audit_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["artifact_count"] == len(manifest["artifacts"])
          for item in manifest["artifacts"]:
              path = root / item["path"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]

          forbidden = {
              ".7z", ".zip", ".dm3", ".dm4", ".emd", ".ser", ".emi",
              ".mrc", ".mrcs", ".tif", ".tiff", ".png", ".bmp", ".jpg",
              ".jpeg", ".gif", ".webp"
          }
          assert not [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in forbidden
          ]
          PY

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-ge-dm3-tem-saed-source-audit-evidence
          path: outputs/zenodo_ge_dm3_tem_saed_source_audit
          if-no-files-found: error
          retention-days: 30
