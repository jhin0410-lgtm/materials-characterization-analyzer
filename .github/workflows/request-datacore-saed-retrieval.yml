name: Request DataCORE SAED archive retrieval

on:
  push:
    branches:
      - agent/audit-datacore-saed-source
    paths:
      - ".github/workflows/request-datacore-saed-retrieval.yml"

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit official archive retrieval request
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = "https://datacore.iu.edu/sda/request/datacore/4j03d088v_Diffraction_Pattern.zip"
          query = urllib.parse.urlencode(
              {
                  "user_email": "",
                  "request": "Request file retrieval from archives",
              }
          )
          url = f"{base}?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "materials-characterization-analyzer-datacore-retrieval/1.0",
                  "Accept": "text/html,application/xhtml+xml",
                  "Referer": "https://datacore.iu.edu/concern/file_sets/37720f05n",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = response.read()
              result = {
                  "schema_version": "1.0",
                  "case_id": "datacore_saed_archive_retrieval_request",
                  "request_endpoint": base,
                  "email_supplied": False,
                  "status": int(getattr(response, "status", 200)),
                  "resolved_url": response.geturl().split("?", 1)[0],
                  "content_type": response.headers.get_content_type(),
                  "response_bytes": len(payload),
                  "response_sha256": hashlib.sha256(payload).hexdigest(),
                  "sanitized_text_prefix": re.sub(
                      r"\s+", " ", payload[:512].decode("utf-8", errors="replace")
                  ).strip()[:300],
                  "raw_response_persisted": False,
              }
          output = Path("outputs/datacore-saed-retrieval")
          output.mkdir(parents=True, exist_ok=True)
          (output / "retrieval_request_result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload retrieval request evidence
        uses: actions/upload-artifact@v7
        with:
          name: datacore-saed-retrieval-request-evidence
          path: outputs/datacore-saed-retrieval/retrieval_request_result.json
          if-no-files-found: error
          retention-days: 30
