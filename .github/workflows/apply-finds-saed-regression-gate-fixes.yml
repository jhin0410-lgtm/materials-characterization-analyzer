name: Apply FINDS SAED regression-gate fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-finds-saed-regression-gate-fixes.yml"
      - "scripts/apply_finds_saed_regression_gate_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: python scripts/apply_finds_saed_regression_gate_fixes.py

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_public_finds_saed_source_audit.py
          tests/test_public_finds_saed_case.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify_public_finds_saed_case.py \
            tests/test_public_finds_saed_case.py \
            case_studies/public_finds_saed/README.md
          git commit -m "Pin FINDS SAED real-image regression outcome [saed-gates-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
