name: Dryad HRTEM pilot-pair audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dryad-hrtem-pilot-pair-audit.yml"
      - "case_studies/dryad_hrtem_pilot_pair_audit/**"
      - "scripts/audit_dryad_hrtem_pilot_pair.py"
      - "scripts/resolve_dryad_pilot_file_metadata.py"
      - "src/mca/tem_external_validation_pilot_contract.py"
      - "src/mca/tem_external_validation_pilot_audit.py"
      - "tests/test_dryad_hrtem_pilot_pair_audit.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dryad-hrtem-pilot-pair-audit.yml"
      - "case_studies/dryad_hrtem_pilot_pair_audit/**"
      - "scripts/audit_dryad_hrtem_pilot_pair.py"
      - "scripts/resolve_dryad_pilot_file_metadata.py"
      - "src/mca/tem_external_validation_pilot_contract.py"
      - "src/mca/tem_external_validation_pilot_audit.py"
      - "tests/test_dryad_hrtem_pilot_pair_audit.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: dryad-hrtem-pilot-pair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve file-linked Dryad source version and checksums
        run: |
          set -euo pipefail
          mkdir -p outputs/dryad-api-responses
          for entry in \
            "2451485:/tmp/dryad-images-api.json" \
            "2451482:/tmp/dryad-labels-api.json" \
            "2451515:/tmp/dryad-metadata-api.json"
          do
            file_id="${entry%%:*}"
            output="${entry#*:}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --user-agent "materials-characterization-analyzer/0.9" \
              --output "$output" \
              "https://datadryad.org/api/v2/files/$file_id"
          done
          python scripts/resolve_dryad_pilot_file_metadata.py \
            --doi "10.7941/D1SP93" \
            --output-dir /tmp/dryad-source-version-metadata \
            2451485=/tmp/dryad-images-api.json \
            2451482=/tmp/dryad-labels-api.json \
            2451515=/tmp/dryad-metadata-api.json
          cp /tmp/dryad-*-api.json outputs/dryad-api-responses/
          cp -R /tmp/dryad-source-version-metadata outputs/dryad-source-version-metadata

      - name: Download exact Dryad pilot files
        run: |
          set -euo pipefail
          auth=()
          if [[ -n "${DRYAD_API_TOKEN:-}" ]]; then
            auth=(--header "Authorization: Bearer $DRYAD_API_TOKEN")
          fi
          download() {
            local file_id="$1"
            local output="$2"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --user-agent "materials-characterization-analyzer/0.9" \
              --header "Accept: application/octet-stream" \
              "${auth[@]}" \
              --output "$output" \
              "https://datadryad.org/api/v2/files/$file_id/download"
          }
          download 2451515 /tmp/Processed_datasets_metadata.csv
          download 2451485 /tmp/Au_5nm_260kx_450e_Std_UTC_FFCorr_Team05_Images.h5
          download 2451482 /tmp/Au_5nm_260kx_450e_Std_UTC_FFCorr_Team05_Labels.h5

      - name: Download pinned cobalt training images
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --user-agent "materials-characterization-analyzer/0.9" \
            --output /tmp/training_images.h5 \
            "https://zenodo.org/records/14927582/files/training_images.h5?download=1"

      - name: Audit real pair and training overlap
        run: |
          set -euo pipefail
          python scripts/audit_dryad_hrtem_pilot_pair.py \
            --config case_studies/dryad_hrtem_pilot_pair_audit/case_config.json \
            --images /tmp/Au_5nm_260kx_450e_Std_UTC_FFCorr_Team05_Images.h5 \
            --labels /tmp/Au_5nm_260kx_450e_Std_UTC_FFCorr_Team05_Labels.h5 \
            --processed-metadata /tmp/Processed_datasets_metadata.csv \
            --training-images /tmp/training_images.h5 \
            --images-api-metadata /tmp/dryad-images-api.json \
            --labels-api-metadata /tmp/dryad-labels-api.json \
            --processed-metadata-api /tmp/dryad-metadata-api.json \
            --output outputs/dryad-hrtem-pilot-pair-audit \
            | tee outputs/dryad-hrtem-pilot-pair-audit-console.json

      - name: Verify real-data and scientific contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          output = Path("outputs/dryad-hrtem-pilot-pair-audit")
          summary = json.loads((output / "pilot_pair_audit_summary.json").read_text())
          pair = summary["hdf5_pair_audit"]
          overlap = summary["content_overlap_audit"]
          assert summary["source"]["doi"] == "10.7941/D1SP93"
          assert summary["source"]["pilot_pair"]["material"] == "Au"
          assert all(record["source_digest_verified"] for record in summary["source"]["files"].values())
          assert pair["patch_count"] > 0
          assert pair["image_shape"] == pair["label_shape"]
          assert pair["image_shape"][1:] == [512, 512]
          assert pair["observed_label_values"] == [0, 1]
          assert overlap["training_patch_count"] == 256
          assert (
              overlap["exact_content_match_patch_count"]
              + overlap["review_required_patch_count"]
              + overlap["no_detected_overlap_patch_count"]
              == pair["patch_count"]
          )
          assert not summary["readiness"]["in_domain_cobalt_oxide_external_validation"]
          assert not summary["readiness"]["diagnostic_cross_material_stress_test_model_evaluation_performed"]
          assert summary["scientific_closeout"]["status"] == "Diagnostic"

          patches = pd.read_csv(output / "tem_pilot_patch_inventory.csv")
          comparisons = pd.read_csv(output / "tem_pilot_training_overlap.csv")
          assert len(patches) == pair["patch_count"]
          assert len(comparisons) == pair["patch_count"]
          manifest = json.loads((output / "pilot_pair_audit_artifact_manifest.json").read_text())
          assert manifest["artifact_count"] == 5
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]
          print(json.dumps(overlap, indent=2, sort_keys=True))
          PY

      - name: Run focused software tests
        run: pytest -q tests/test_dryad_hrtem_pilot_pair_audit.py

      - name: Verify package build
        run: |
          mca --version
          python -m build

      - name: Upload audit evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dryad-hrtem-pilot-pair-audit-evidence
          path: |
            outputs/dryad-hrtem-pilot-pair-audit/
            outputs/dryad-hrtem-pilot-pair-audit-console.json
            outputs/dryad-api-responses/
            outputs/dryad-source-version-metadata/
          if-no-files-found: warn
          retention-days: 30
