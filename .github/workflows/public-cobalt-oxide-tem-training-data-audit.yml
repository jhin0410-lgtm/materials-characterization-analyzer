name: Public cobalt oxide TEM training-data readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-training-data-audit.yml"
      - "case_studies/public_cobalt_oxide_tem_training_data_audit/**"
      - "scripts/audit_public_cobalt_oxide_tem_training_data.py"
      - "src/mca/tem_training_data_audit.py"
      - "tests/test_public_cobalt_oxide_tem_training_data_audit.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-training-data-audit.yml"
      - "case_studies/public_cobalt_oxide_tem_training_data_audit/**"
      - "scripts/audit_public_cobalt_oxide_tem_training_data.py"
      - "src/mca/tem_training_data_audit.py"
      - "tests/test_public_cobalt_oxide_tem_training_data_audit.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: public-cobalt-oxide-tem-training-data-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download exact public training files
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/training_images.h5 \
            "https://zenodo.org/records/14927582/files/training_images.h5?download=1"
          echo "caac404a7ea2c65b2403aee5728a70eb  /tmp/training_images.h5" | md5sum --check
          echo "e709b7f1fa383bd111bb0b7e8d4662452b46198f52e4e88b19bb3f3e222c0926  /tmp/training_images.h5" | sha256sum --check

          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/training_labels.h5 \
            "https://zenodo.org/records/14927582/files/training_labels.h5?download=1"
          echo "087a4df4cd67fa97cdf790c40bdc828b  /tmp/training_labels.h5" | md5sum --check
          echo "28db52db53209a8a068f722990264a136ab187a192340ef3770e81d9c0de7c40  /tmp/training_labels.h5" | sha256sum --check

      - name: Audit all 256 paired training patches
        run: |
          set -euo pipefail
          python scripts/audit_public_cobalt_oxide_tem_training_data.py \
            --config case_studies/public_cobalt_oxide_tem_training_data_audit/case_config.json \
            --images /tmp/training_images.h5 \
            --labels /tmp/training_labels.h5 \
            --output outputs/public-cobalt-oxide-tem-training-data-audit \
            | tee outputs/public-cobalt-oxide-tem-training-data-audit-console.json

      - name: Verify real-data and scientific contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from pathlib import Path

          import pandas as pd

          output = Path("outputs/public-cobalt-oxide-tem-training-data-audit")
          summary = json.loads(
              (output / "training_data_readiness_summary.json").read_text(encoding="utf-8")
          )
          assert summary["software_version"] == "0.9.2"
          assert summary["source"]["doi"] == "10.5281/zenodo.14927582"
          assert summary["source"]["license"] == "CC-BY-4.0"
          assert summary["source"]["training_images"]["sha256"] == (
              "e709b7f1fa383bd111bb0b7e8d4662452b46198f52e4e88b19bb3f3e222c0926"
          )
          assert summary["source"]["training_labels"]["sha256"] == (
              "28db52db53209a8a068f722990264a136ab187a192340ef3770e81d9c0de7c40"
          )
          assert summary["result_counts"] == {
              "patch_pair_count": 256,
              "candidate_parent_group_count": 4,
              "notebook_fold_count": 8,
          }
          assert summary["hdf5_contract"] == {
              "image_dataset_name": "images",
              "label_dataset_name": "labels",
              "image_shape": [256, 512, 512],
              "label_shape": [256, 512, 512, 2],
              "image_dtype": "float64",
              "label_dtype": "float64",
              "attributes_present": False,
              "image_chunks": None,
              "label_chunks": None,
              "image_compression": None,
              "label_compression": None,
              "parent_ids_present": False,
              "patch_coordinates_present": False,
              "pixel_calibration_present": False,
          }
          values = summary["value_contract"]
          assert values["all_images_finite"]
          assert values["all_labels_finite"]
          assert values["labels_binary"]
          assert values["label_channels_complementary_one_hot"]
          assert values["label_value_counts"] == {
              "0.0": 67108864,
              "1.0": 67108864,
          }
          assert values["exact_duplicate_image_patch_count"] == 0
          assert values["exact_duplicate_label_patch_count"] == 0

          representation = summary["image_representation"]
          assert representation["classification"] == "source_standardized_float64_patch_array"
          assert representation["maximum_abs_patch_mean"] <= 1e-10
          assert representation["maximum_abs_patch_std_deviation_from_one"] <= 1e-12
          assert math.isclose(representation["minimum"], -26.453024268925645, abs_tol=1e-12)
          assert math.isclose(representation["maximum"], 21.97890372229253, abs_tol=1e-12)
          assert not representation["original_detector_intensity_available"]

          grouping = summary["candidate_parent_grouping"]
          assert grouping["status"] == "diagnostic_inference_not_embedded_metadata"
          assert grouping["candidate_group_count"] == 4
          assert grouping["patches_per_candidate_group"] == 64
          assert grouping["candidate_grid"] == [8, 8]
          assert not grouping["authoritative_parent_ids_available"]
          assert grouping["edge_continuity_supports_candidate_grouping"]
          assert math.isclose(
              grouping["observed_image_seam_mean_abs_difference"],
              0.6027527824255584,
              abs_tol=1e-12,
          )
          assert math.isclose(
              grouping["random_image_seam_mean_abs_difference"],
              1.1371069913522882,
              abs_tol=1e-12,
          )
          assert math.isclose(
              grouping["observed_to_random_image_seam_ratio"],
              0.5300756982495933,
              abs_tol=1e-12,
          )
          assert math.isclose(
              grouping["observed_label_seam_mean_abs_difference"],
              0.00959559849330357,
              abs_tol=1e-12,
          )
          assert math.isclose(
              grouping["random_label_seam_mean_abs_difference"],
              0.46188790457589285,
              abs_tol=1e-12,
          )
          assert math.isclose(
              grouping["observed_to_random_label_seam_ratio"],
              0.020774734298604946,
              abs_tol=1e-12,
          )

          split = summary["notebook_split_audit"]
          assert split["commit"] == "9f92235102a805abc76e3d60065d677ee2068c90"
          assert split["split_unit"] == "patch_index"
          assert not split["parent_group_id_used"]
          assert split["candidate_parent_group_overlap_in_every_fold"]
          assert split["minimum_overlap_group_count"] == 4
          assert split["maximum_overlap_group_count"] == 4
          assert not split["independent_parent_image_validation"]
          assert not split["performance_claim_ready"]

          assert summary["scientific_closeout"]["status"] == "Diagnostic"
          assert summary["scientific_closeout"]["result"] == (
              "not_ready_for_independent_model_performance_claims"
          )
          assert not summary["literature_context"]["used_for_physical_conversion"]
          assert all(value is False for value in summary["processing"].values())

          patches = pd.read_csv(output / "tem_training_patch_inventory.csv")
          seams = pd.read_csv(output / "tem_training_candidate_parent_seams.csv")
          folds = pd.read_csv(output / "tem_training_notebook_split_overlap.csv")
          assert len(patches) == 256
          assert len(seams) == 4
          assert len(folds) == 8
          assert patches["patch_index"].tolist() == list(range(256))
          assert patches.groupby("candidate_parent_group").size().eq(64).all()
          assert patches["image_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert patches["label_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert patches["image_mean"].abs().max() <= 1e-10
          assert (patches["image_std"] - 1.0).abs().max() <= 1e-12
          assert folds["train_patch_count"].eq(224).all()
          assert folds["validation_patch_count"].eq(32).all()
          assert folds["overlap_group_count"].eq(4).all()
          assert not folds["independent_parent_image_validation"].any()

          manifest = json.loads(
              (output / "training_data_readiness_artifact_manifest.json").read_text()
          )
          assert manifest["artifact_count"] == 5
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]

          forbidden_suffixes = {".pkl", ".pickle", ".joblib", ".pt", ".pth", ".onnx"}
          assert not [
              path for path in output.rglob("*")
              if path.suffix.lower() in forbidden_suffixes
          ]
          print(json.dumps(summary["result_counts"], indent=2, sort_keys=True))
          print(json.dumps(grouping, indent=2, sort_keys=True))
          print(json.dumps(split, indent=2, sort_keys=True))
          PY

      - name: Run focused software tests
        run: pytest -q tests/test_public_cobalt_oxide_tem_training_data_audit.py

      - name: Verify package version and build
        run: |
          set -euo pipefail
          mca --version | tee mca-version.txt
          grep -F "0.9.2" mca-version.txt
          python -m build
          python - <<'PY'
          from pathlib import Path
          files = sorted(path.name for path in Path("dist").iterdir())
          assert "materials_characterization_analyzer-0.9.2-py3-none-any.whl" in files
          assert "materials_characterization_analyzer-0.9.2.tar.gz" in files
          print(files)
          PY

      - name: Upload real-data evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-cobalt-oxide-tem-training-data-readiness-evidence
          path: |
            outputs/public-cobalt-oxide-tem-training-data-audit/
            outputs/public-cobalt-oxide-tem-training-data-audit-console.json
            mca-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: materials-characterization-analyzer-0.9.2-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
