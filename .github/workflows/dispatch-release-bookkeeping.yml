name: Dispatch 0.10.0 release bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-release-bookkeeping.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.10.0-real-data-cases
          fetch-depth: 0

      - name: Apply release patch
        run: python scripts/apply_release_bookkeeping.py

      - name: Remove temporary release files and commit
        run: |
          git rm scripts/apply_release_bookkeeping.py
          git rm .github/workflows/apply-release-bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.cff pyproject.toml src/mca/__init__.py
          git commit -m "Prepare 0.10.0 real-data validation release [release-bookkeeping-applied]"
          git push origin HEAD:release/0.10.0-real-data-cases
