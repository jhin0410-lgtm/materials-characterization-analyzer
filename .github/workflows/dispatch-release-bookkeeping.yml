name: Dispatch 0.10.0 release bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-release-bookkeeping.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.10.0-real-data-cases
          fetch-depth: 0

      - name: Patch version and user-facing release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "0.10.0"
          release_date = "2026-08-01"

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("src/mca/__init__.py", '__version__ = "0.9.3"', f'__version__ = "{version}"')
          replace_once("pyproject.toml", 'version = "0.9.3"', f'version = "{version}"')
          replace_once(
              "CITATION.cff",
              "version: 0.9.3\ndate-released: 2026-07-29",
              f"version: {version}\ndate-released: {release_date}",
          )

          changelog_anchor = "## [Unreleased]\n\nNo unreleased changes are currently recorded.\n"
          changelog_release = """## [Unreleased]

No unreleased changes are currently recorded.

## [0.10.0] - 2026-08-01

### Added

- A checksum-bound Mendeley CoP/Co2P/Co3O4 TEM source audit using the anonymous public API used by the landing page, including immutable file inventory, duplicate-record detection, safe RAR inventory, and selective microscopy-member inspection.
- A fail-closed `mca tem-validation-intake` command for future independent cobalt-oxide TEM datasets, with SHA-256, sample/acquisition lineage, non-use, blinded-label, content-overlap, and evaluation-freeze gates.
- A public Zr15Nb DSC real-data case using Zenodo record `17590045`, with exact three-row header binding, `mW/mg` to `W/g` identity conversion, 43,167-row monotonic heating validation, three predeclared smoothing runs, and candidate robustness review.
- A public FINDS SAED diagnostic case using Zenodo record `13748483`, with project-bound center and camera constant, decoded-pixel-equal JPEG-to-PNG adaptation, seven center/smoothing runs, and post-detection source d-value comparison.
- Dedicated real-data workflows, focused regression suites, deterministic evidence verifiers, checksum-bound manifests, and case-level scientific closeouts for the DSC and SAED cases.

### Changed

- The TEM external-validation registry now excludes the assessed Mendeley source as a rendered mixed-heterojunction figure representation instead of leaving it as a metadata-resolution candidate.
- The next TEM action now targets acquisition of independent raw cobalt-oxide TEM data rather than additional inspection of the rejected Mendeley source.
- SAED ZIP auditing distinguishes platform resource-fork metadata from measurement images and requires valid image references before accepting FINDS project files.

### Scientific status

- The Mendeley TEM source is **Diagnostic** and not suitable for independent segmentation validation: the inspected files are rendered RGB TIFF/BMP publication figures without immutable sample/acquisition IDs, Co3O4-region binding, detector-intensity provenance, or independent labels.
- The Zr15Nb DSC case is **Diagnostic**: five automatic event candidates persist across the three smoothing spans, but phase, reaction, mechanism, validated onset, quantitative enthalpy, and engineering claims remain unsupported.
- The FINDS SAED case is **Diagnostic**: four calibrated ring candidates persist across all seven runs, but the source is a lossy JPEG without material, acquisition, detector, raw-intensity, or crystallographic ground-truth provenance.
- Synthetic intake fixtures validate software behavior only and are not scientific evidence.
"""
          replace_once("CHANGELOG.md", changelog_anchor, changelog_release)

          public_policy_anchor = (
              "The public DWCNT multimodal case under `case_studies/public_carbon_multimodal/` "
              "fetches its source files at runtime and records source identifiers and checksums. "
              "The external raw dataset is not vendored into this repository."
          )
          public_policy_replacement = """Public real-data case studies fetch their external sources at runtime, verify source identifiers and checksums, and do not vendor external raw datasets into this repository:

- `case_studies/public_carbon_multimodal/`: DWCNT Raman/FTIR/XPS/TGA diagnostic case;
- `case_studies/public_zr15nb_dsc/`: checksum-bound Zr15Nb DSC real-data case;
- `case_studies/public_finds_saed/`: calibrated FINDS SAED real-image diagnostic case.

The TEM external-validation intake under `case_studies/tem_external_validation_intake/` is a fail-closed dataset contract, not a certified scientific dataset."""
          replace_once("README.md", public_policy_anchor, public_policy_replacement)

          thermal_anchor = "The thermal baseline accepts one strictly increasing heating segment. Cooling, holds, cycling, and multisegment programs require explicit segmentation and are not silently reordered."
          thermal_replacement = thermal_anchor + """

### Public real-data case studies

Run the complete checksum-bound DSC case:

```bash
python scripts/audit_public_zr15nb_dsc_source.py \\
  --config case_studies/public_zr15nb_dsc/case_config.json \\
  --output outputs/public-zr15nb-dsc/source-audit

python scripts/run_public_zr15nb_dsc_case.py \\
  --config case_studies/public_zr15nb_dsc/case_config.json \\
  --output outputs/public-zr15nb-dsc/result

python scripts/review_public_zr15nb_dsc_candidates.py \\
  --config case_studies/public_zr15nb_dsc/case_config.json \\
  --result outputs/public-zr15nb-dsc/result
```

Run the calibrated FINDS SAED diagnostic case:

```bash
python scripts/audit_public_finds_saed_source.py \\
  --config case_studies/public_finds_saed/case_config.json \\
  --output outputs/public-finds-saed/source-audit

python scripts/run_public_finds_saed_case.py \\
  --config case_studies/public_finds_saed/case_config.json \\
  --output outputs/public-finds-saed/result

python scripts/verify_public_finds_saed_case.py \\
  --audit outputs/public-finds-saed/source-audit \\
  --result outputs/public-finds-saed/result
```

These cases are diagnostic. Their automatic candidates are not phase, reaction, reflection, or structure assignments."""
          replace_once("README.md", thermal_anchor, thermal_replacement)

          next_order_anchor = """## Next Development Order

1. Validate the remaining baseline analyzers on representative public or appropriately shareable data with complete metadata, prioritizing XRD, SEM, EDS, SAED, and DSC.
2. Complete one additional credible end-to-end real-data case before adding advanced interpretation methods.
3. Define and validate stable sample/measurement exchange contracts with `materials-data-analyzer` before cross-repository integration.
4. Add explicit XPS component fitting only after line-shape, constraints, reference, and uncertainty contracts are defined.
5. Add HRTEM lattice-fringe analysis only after calibration, ROI, FFT, uncertainty, and validation contracts are defined.
6. Add cooling, hold, cycling, simultaneous TGA-DSC, and multisegment thermal workflows only with explicit segment contracts.
7. Extend integrated reporting only after individual contracts and scientific validation gates are stable."""
          next_order_replacement = """## Next Development Order

1. Acquire independent raw/lossless cobalt-oxide TEM data that passes `mca tem-validation-intake`; do not retrain the segmentation model before evaluation-set independence is protected.
2. Acquire a raw or lossless calibrated SAED dataset with material, acquisition, detector, and crystallographic reference metadata; the FINDS JPEG case remains software-integration evidence only.
3. Add a representative real-data case for any remaining baseline workflow only when it fills a defined scientific-validation gap rather than duplicating the existing RWGS, DWCNT, Zr15Nb DSC, or FINDS SAED cases.
4. Define and validate stable sample/measurement exchange contracts with `materials-data-analyzer` before cross-repository integration.
5. Add explicit XPS component fitting only after line-shape, constraints, reference, and uncertainty contracts are defined.
6. Add HRTEM lattice-fringe analysis only after calibration, ROI, FFT, uncertainty, and validation contracts are defined.
7. Add cooling, hold, cycling, simultaneous TGA-DSC, and multisegment thermal workflows only with explicit segment contracts.
8. Extend integrated reporting only after individual contracts and scientific validation gates are stable."""
          replace_once("README.md", next_order_anchor, next_order_replacement)
          PY

      - name: Commit release branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.cff pyproject.toml src/mca/__init__.py
          git commit -m "Prepare 0.10.0 real-data validation release [release-bookkeeping-applied]"
          git push origin HEAD:release/0.10.0-real-data-cases
