name: Zenodo SrTiO3 SAED pre-pixel metadata audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/zenodo_srtio3_saed_prepixel_metadata/**"
      - "case_studies/zenodo_srtio3_saed_tiff_metadata/**"
      - "scripts/audit_zenodo_srtio3_saed_prepixel_metadata.py"
      - "scripts/audit_zenodo_srtio3_saed_tiff_metadata.py"
      - "tests/test_audit_zenodo_srtio3_saed_prepixel_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-prepixel-metadata.yml"
  push:
    branches: [main]
    paths:
      - "case_studies/zenodo_srtio3_saed_prepixel_metadata/**"
      - "case_studies/zenodo_srtio3_saed_tiff_metadata/**"
      - "scripts/audit_zenodo_srtio3_saed_prepixel_metadata.py"
      - "scripts/audit_zenodo_srtio3_saed_tiff_metadata.py"
      - "tests/test_audit_zenodo_srtio3_saed_prepixel_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-prepixel-metadata.yml"

permissions:
  contents: read

concurrency:
  group: zenodo-srtio3-saed-prepixel-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused regressions
        run: pytest -q tests/test_audit_zenodo_srtio3_saed_prepixel_metadata.py
      - name: Run live bounded pre-pixel metadata audit
        run: |
          python scripts/audit_zenodo_srtio3_saed_prepixel_metadata.py \
            --config case_studies/zenodo_srtio3_saed_prepixel_metadata/case_config.json \
            --output outputs/zenodo_srtio3_saed_prepixel_metadata/prepixel_metadata_snapshot.json
      - name: Verify no pixel boundary crossing and source stability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/zenodo_srtio3_saed_prepixel_metadata")
          live = json.loads((root / "prepixel_metadata_snapshot.json").read_text())
          pinned = json.loads(
              Path(
                  "case_studies/zenodo_srtio3_saed_prepixel_metadata/verified_prepixel_metadata_snapshot.json"
              ).read_text()
          )
          assert live["execution_status"] == "bounded_pre_pixel_text_metadata_audit_completed"
          assert live["config_sha256"] == pinned["config_sha256"]
          assert live["source"] == pinned["source"]
          assert live["target_archive"]["key"] == pinned["target_archive"]["key"]
          assert live["target_archive"]["bytes"] == pinned["target_archive"]["bytes"]
          assert live["target_archive"]["repository_md5"] == pinned["target_archive"]["repository_md5"]
          assert live["range_evidence"] == pinned["range_evidence"]
          assert len(live["members"]) == 3
          assert [item["path"] for item in live["members"]] == [item["path"] for item in pinned["members"]]
          common = pinned["common_text_metadata"]
          for live_member, pinned_member in zip(live["members"], pinned["members"], strict=True):
              assert live_member["compressed_bytes"] == pinned_member["compressed_bytes"]
              assert live_member["uncompressed_bytes"] == pinned_member["uncompressed_bytes"]
              assert live_member["full_member_downloaded"] is False
              assert live_member["verified_first_strip_offset"] == 272
              assert live_member["pre_pixel_prefix_bytes_decompressed"] == 262
              assert live_member["pixel_bytes_decompressed"] == 0
              assert live_member["pre_pixel_prefix_sha256"] == common["pre_pixel_prefix_sha256"]
              assert live_member["ifd_recheck"]["metadata_prefix_sha256"] == common["first_ifd_metadata_sha256"]
              for tag in ("ImageDescription", "Software"):
                  observed = live_member["text_metadata"][tag]
                  expected = common[tag]
                  assert observed["ascii_valid"] is True
                  assert observed["text"] == expected["text"]
                  assert observed["raw_length"] == expected["raw_length"]
                  assert observed["stripped_length"] == expected["stripped_length"]
                  assert observed["sha256"] == expected["sha256"]
          assert live["cross_member_text_comparison"]["ImageDescription"]["all_three_equal"] is True
          assert live["cross_member_text_comparison"]["Software"]["all_three_equal"] is True
          assert live["range_evidence"]["pixel_bytes_decompressed"] == 0
          assert live["range_evidence"]["raw_tiff_bytes_retained"] == 0
          assert live["range_evidence"]["four_d_stem_bytes_read"] is False
          assert live["range_evidence"]["total_remote_bytes_read"] == 918508
          assert live["readiness"]["pixel_access_authorized"] is False
          assert live["readiness"]["four_d_stem_download_authorized"] is False
          assert live["readiness"]["analyzer_execution_authorized"] is False
          assert live["readiness"]["phase_indexing_authorized"] is False
          assert live["readiness"]["external_validation_ready"] is False
          forbidden = {".zip", ".npy", ".tif", ".tiff", ".png", ".jpg", ".jpeg", ".dm3", ".dm4", ".ser"}
          leaked = [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.casefold() in forbidden
          ]
          if leaked:
              raise SystemExit(f"source/pixel payload leaked into pre-pixel evidence: {leaked}")
          PY
      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-srtio3-saed-prepixel-metadata-evidence
          path: outputs/zenodo_srtio3_saed_prepixel_metadata
          if-no-files-found: warn
          retention-days: 30
