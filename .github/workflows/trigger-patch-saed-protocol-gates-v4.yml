name: Trigger SAED protocol gate patch v4

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-patch-saed-protocol-gates-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-saed-validation-intake

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply validated v3 source and test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/trigger-patch-saed-protocol-gates-v3.yml"
          ).read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(script, "saed_protocol_gate_patch_v3", "exec"))
          PY

      - name: Validate focused and full repository behavior
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca
          pytest -q tests/test_saed_external_validation_intake.py
          pytest -q
          python -m build

      - name: Commit validated source and tests
        run: |
          git restore .github/workflows/saed-external-validation-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_external_validation_intake.py \
            tests/test_saed_external_validation_intake.py
          git commit -m "Clarify SAED source and protocol readiness gates"
          git push origin HEAD:agent/add-saed-validation-intake
