name: Apply Dryad pilot review fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-dryad-pilot-review-fixes.yml"
      - "scripts/apply_dryad_pilot_review_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Narrow changelog patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_dryad_pilot_review_fixes.py")
          text = path.read_text(encoding="utf-8")
          old = """replace_exact(
              changelog,
              '### Fixed\\n\\n',
              '### Fixed\\n\\n- Dryad HRTEM pilot automatic acquisition now resolves the pinned file-linked source version and checksum inventory, authenticates binary downloads without exposing the token, preserves raw API responses separately from enriched evidence, and keeps readiness blocked unless processed metadata binding is exact and authoritative.\\n- The public Dryad pilot contract now pins the HDF5, training, overlap, notebook, source-version, and endpoint configuration; workflow evidence distinguishes a configured credential from a successfully verified authenticated download.\\n',
          )
          """
          new = """replace_exact(
              changelog,
              '## [Unreleased]\\n\\n### Fixed\\n\\n',
              '## [Unreleased]\\n\\n### Fixed\\n\\n- Dryad HRTEM pilot automatic acquisition now resolves the pinned file-linked source version and checksum inventory, authenticates binary downloads without exposing the token, preserves raw API responses separately from enriched evidence, and keeps readiness blocked unless processed metadata binding is exact and authoritative.\\n- The public Dryad pilot contract now pins the HDF5, training, overlap, notebook, source-version, and endpoint configuration; workflow evidence distinguishes a configured credential from a successfully verified authenticated download.\\n',
          )
          """
          if text.count(old) != 1:
              raise SystemExit("expected one changelog patch block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Apply deterministic patch
        run: python scripts/apply_dryad_pilot_review_fixes.py

      - name: Align synthetic download fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_dryad_hrtem_pilot_pair_audit.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        captured.update(dict(headers or {}))\n"
              "        destination.write_bytes(payload_path.read_bytes())\n"
          )
          new = (
              "        captured.update(dict(headers or {}))\n"
              "        destination.parent.mkdir(parents=True, exist_ok=True)\n"
              "        destination.write_bytes(payload_path.read_bytes())\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected one synthetic download fixture")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused Dryad pilot tests
        run: >-
          python -m pytest -q
          tests/test_dryad_hrtem_pilot_pair_audit.py
          tests/test_dryad_hrtem_pilot_standardization_scope.py
          tests/test_resolve_dryad_pilot_file_metadata.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated production changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/dryad-hrtem-pilot-pair-audit.yml \
            case_studies/dryad_hrtem_pilot_pair_audit/case_config.json \
            case_studies/dryad_hrtem_pilot_pair_audit/README.md \
            scripts/resolve_dryad_pilot_file_metadata.py \
            src/mca/tem_external_validation_pilot_contract.py \
            src/mca/tem_external_validation_pilot_engine.py \
            src/mca/tem_external_validation_pilot_io.py \
            tests/test_dryad_hrtem_pilot_pair_audit.py \
            tests/test_resolve_dryad_pilot_file_metadata.py \
            CHANGELOG.md
          git commit -m "Fix Dryad pilot acquisition and readiness contracts [dryad-pilot-fixes-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
