name: Zenodo SrTiO3 SAED metadata audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/zenodo_srtio3_saed_metadata_audit/**"
      - "scripts/audit_zenodo_srtio3_saed_metadata.py"
      - "tests/test_audit_zenodo_srtio3_saed_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-metadata.yml"
  push:
    branches: [main]
    paths:
      - "case_studies/zenodo_srtio3_saed_metadata_audit/**"
      - "scripts/audit_zenodo_srtio3_saed_metadata.py"
      - "tests/test_audit_zenodo_srtio3_saed_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-metadata.yml"

permissions:
  contents: read

concurrency:
  group: zenodo-srtio3-saed-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused regressions
        run: pytest -q tests/test_audit_zenodo_srtio3_saed_metadata.py
      - name: Run live metadata audit
        run: |
          python scripts/audit_zenodo_srtio3_saed_metadata.py \
            --config case_studies/zenodo_srtio3_saed_metadata_audit/case_config.json \
            --output outputs/zenodo_srtio3_saed_metadata_audit/metadata_snapshot.json
      - name: Verify metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/zenodo_srtio3_saed_metadata_audit/metadata_snapshot.json")
          snapshot = json.loads(path.read_text())
          assert snapshot["execution_status"] == "metadata_audit_completed"
          assert snapshot["source"]["record_id"] == 20300700
          assert snapshot["saed_archive"]["key"] == "SAED.zip"
          assert snapshot["saed_archive"]["md5"] == "0c830a9b276a491e91037872891cb440"
          assert snapshot["source_archive_downloaded"] is False
          assert snapshot["source_bytes_retained"] is False
          assert snapshot["analyzer_inference_performed"] is False
          assert snapshot["readiness"]["four_d_stem_download_authorized"] is False
          assert snapshot["readiness"]["pixel_array_access_authorized"] is False
          assert snapshot["readiness"]["analyzer_execution_authorized"] is False
          assert snapshot["readiness"]["phase_indexing_authorized"] is False
          assert snapshot["readiness"]["external_validation_ready"] is False
          assert snapshot["evidence_assessment"]["saed_static_representation"] == "Inconclusive"
          PY
      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-srtio3-saed-metadata-evidence
          path: outputs/zenodo_srtio3_saed_metadata_audit
          if-no-files-found: warn
          retention-days: 30
