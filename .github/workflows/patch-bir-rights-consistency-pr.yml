name: Patch BIR rights consistency PR

on:
  pull_request:
    paths:
      - "scripts/patch_bir_rights_consistency.py"
      - ".github/workflows/patch-bir-rights-consistency-pr.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-bir-200kev-metadata

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply consistency patch
        run: python scripts/patch_bir_rights_consistency.py

      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_saed_bir_metadata_audit.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_bir_metadata_audit.py \
            tests/test_saed_bir_metadata_audit.py \
            .github/workflows/saed-bir-200kev-metadata-audit.yml \
            case_studies/saed_bir_200kev_metadata_audit/README.md
          git commit -m "Align BIR reuse evidence with live Zenodo metadata"
          git push origin HEAD:agent/audit-bir-200kev-metadata
