name: Co3O4 public TEM candidate audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/co3o4_public_tem_candidate_audit/**"
      - "case_studies/tem_external_validation_candidate_registry/**"
      - "scripts/audit_co3o4_public_tem_candidates.py"
      - "src/mca/tem_external_validation_candidate_registry*.py"
      - "tests/test_tem_external_validation_candidate_registry.py"
      - ".github/workflows/co3o4-public-tem-candidate-audit.yml"
  push:
    branches:
      - main
    paths:
      - "case_studies/co3o4_public_tem_candidate_audit/**"
      - "case_studies/tem_external_validation_candidate_registry/**"
      - "scripts/audit_co3o4_public_tem_candidates.py"
      - "src/mca/tem_external_validation_candidate_registry*.py"
      - "tests/test_tem_external_validation_candidate_registry.py"
      - ".github/workflows/co3o4-public-tem-candidate-audit.yml"

permissions:
  contents: read

concurrency:
  group: co3o4-public-tem-candidate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and bounded inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar
          python -m pip install -e ".[dev]" pillow

      - name: Run focused registry regressions
        run: pytest -q tests/test_tem_external_validation_candidate_registry.py

      - name: Run candidate registry
        run: |
          mca tem-candidates \
            --config case_studies/tem_external_validation_candidate_registry/case_config.json \
            --output outputs/tem_external_validation_candidate_registry

      - name: Audit official public source bytes
        run: |
          python scripts/audit_co3o4_public_tem_candidates.py \
            --config case_studies/co3o4_public_tem_candidate_audit/case_config.json \
            --output outputs/co3o4_public_tem_candidate_audit \
            --registry-output outputs/tem_external_validation_candidate_registry

      - name: Verify metadata-only evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/co3o4_public_tem_candidate_audit")
          forbidden = [
              path
              for path in root.rglob("*")
              if path.is_file()
              and path.suffix.casefold()
              in {".rar", ".zip", ".dm3", ".dm4", ".emd", ".ser", ".tif", ".tiff", ".png"}
          ]
          if forbidden:
              raise SystemExit(f"source binaries leaked into evidence: {forbidden}")
          summary = json.loads(
              (root / "co3o4_public_tem_candidate_audit_summary.json")
              .read_text(encoding="utf-8")
          )
          assert summary["result"] == (
              "assessed_public_records_do_not_expose_tem_validation_arrays"
          )
          assert summary["archive_member_count"] == 760
          assert summary["decodable_image_count"] == 3
          assert summary["tem_or_hrtem_member_count"] == 0
          assert summary["microscopy_detector_file_count"] == 0
          assert not summary["source_binaries_retained"]
          assert not summary["external_validation_ready"]
          PY

      - name: Upload metadata-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: co3o4-public-tem-candidate-audit-evidence
          path: |
            outputs/co3o4_public_tem_candidate_audit
            outputs/tem_external_validation_candidate_registry
          if-no-files-found: error
          retention-days: 30
