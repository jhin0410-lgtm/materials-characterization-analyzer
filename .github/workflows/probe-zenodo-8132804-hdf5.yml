name: Probe Zenodo 8132804 HDF5 members

on:
  pull_request:
    paths:
      - ".github/workflows/probe-zenodo-8132804-hdf5.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install bounded inspection dependency
        run: python -m pip install h5py

      - name: Extract and inspect only raw and coarse HDF5 members
        run: |
          mkdir -p outputs/zenodo_8132804_hdf5_probe
          python - <<'PY'
          from __future__ import annotations

          import binascii
          import hashlib
          import json
          import shutil
          import struct
          import tempfile
          import urllib.request
          import zlib
          from pathlib import Path
          from typing import Any

          import h5py
          import numpy as np

          ARCHIVE_URL = (
              "https://zenodo.org/api/records/8132804/files/"
              "Multi_Modal_Data_Fusion_Chemical_Tomography.zip/content"
          )
          ARCHIVE_BYTES = 1_183_315_114
          USER_AGENT = "materials-characterization-analyzer-source-audit/1.0"
          MAX_COMPRESSED_TRANSFER = 80 * 1024 * 1024
          MEMBERS = [
              {
                  "path": (
                      "Multi_Modal_Data_Fusion_Chemical_Tomography/Co3O4_Mn3O4/"
                      "Tilt_Series/Exp_1_coarse_tilt_series.h5"
                  ),
                  "local_header_offset": 268_277_686,
                  "compressed_bytes": 10_817_459,
                  "uncompressed_bytes": 31_905_424,
                  "crc32": "6d7b5238",
                  "compression_method": 8,
              },
              {
                  "path": (
                      "Multi_Modal_Data_Fusion_Chemical_Tomography/Co3O4_Mn3O4/"
                      "Tilt_Series/raw_tilt_series.h5"
                  ),
                  "local_header_offset": 279_095_318,
                  "compressed_bytes": 55_303_989,
                  "uncompressed_bytes": 99_850_624,
                  "crc32": "90715263",
                  "compression_method": 8,
              },
          ]

          def normalize(value: Any) -> Any:
              if isinstance(value, np.generic):
                  return normalize(value.item())
              if isinstance(value, bytes):
                  return value.decode("utf-8", errors="replace")
              if isinstance(value, str) or value is None or isinstance(value, (bool, int, float)):
                  return value
              if isinstance(value, np.ndarray):
                  if value.ndim == 0:
                      return normalize(value.item())
                  flat = value.reshape(-1)
                  preview = [normalize(item) for item in flat[:32]]
                  return {
                      "shape": list(value.shape),
                      "dtype": str(value.dtype),
                      "preview": preview,
                      "truncated": int(flat.size) > len(preview),
                  }
              if isinstance(value, (list, tuple)):
                  preview = [normalize(item) for item in value[:32]]
                  return {"preview": preview, "truncated": len(value) > len(preview)}
              return repr(value)

          def range_request(start: int, end: int):
              if start < 0 or end < start or end >= ARCHIVE_BYTES:
                  raise RuntimeError("invalid archive byte range")
              request = urllib.request.Request(
                  ARCHIVE_URL,
                  headers={"Range": f"bytes={start}-{end}", "User-Agent": USER_AGENT},
              )
              response = urllib.request.urlopen(request, timeout=300)
              expected = f"bytes {start}-{end}/{ARCHIVE_BYTES}"
              observed = response.headers.get("Content-Range")
              if int(response.status) != 206 or observed != expected:
                  response.close()
                  raise RuntimeError(
                      f"archive range not honored: status={response.status}, "
                      f"content-range={observed!r}, expected={expected!r}"
                  )
              return response

          def inspect_h5(path: Path) -> dict[str, Any]:
              datasets: list[dict[str, Any]] = []
              groups: list[dict[str, Any]] = []
              with h5py.File(path, "r") as handle:
                  root_attrs = {
                      str(key): normalize(value) for key, value in handle.attrs.items()
                  }

                  def visitor(name: str, obj: Any) -> None:
                      attrs = {str(key): normalize(value) for key, value in obj.attrs.items()}
                      if isinstance(obj, h5py.Dataset):
                          record: dict[str, Any] = {
                              "path": name,
                              "shape": list(obj.shape),
                              "dtype": str(obj.dtype),
                              "ndim": int(obj.ndim),
                              "size": int(obj.size),
                              "chunks": list(obj.chunks) if obj.chunks is not None else None,
                              "compression": obj.compression,
                              "compression_opts": normalize(obj.compression_opts),
                              "shuffle": bool(obj.shuffle),
                              "fletcher32": bool(obj.fletcher32),
                              "scaleoffset": normalize(obj.scaleoffset),
                              "attributes": attrs,
                          }
                          if obj.size <= 64:
                              try:
                                  record["values"] = normalize(obj[()])
                              except Exception as exc:
                                  record["values_error"] = type(exc).__name__
                          datasets.append(record)
                      elif isinstance(obj, h5py.Group):
                          groups.append({"path": name, "attributes": attrs})

                  handle.visititems(visitor)
              return {
                  "root_attributes": root_attrs,
                  "group_count": len(groups),
                  "dataset_count": len(datasets),
                  "groups": groups,
                  "datasets": datasets,
              }

          total_compressed = sum(item["compressed_bytes"] for item in MEMBERS)
          if total_compressed > MAX_COMPRESSED_TRANSFER:
              raise RuntimeError("declared member transfer exceeds bounded budget")

          transient = Path(tempfile.mkdtemp(prefix="zenodo_8132804_hdf5_"))
          results: list[dict[str, Any]] = []
          transferred = 0
          try:
              for member in MEMBERS:
                  offset = int(member["local_header_offset"])
                  with range_request(offset, offset + 4095) as header_response:
                      header = header_response.read(4096)
                  transferred += len(header)
                  if len(header) < 30:
                      raise RuntimeError("truncated ZIP local header")
                  fields = struct.unpack_from("<4s5H3L2H", header, 0)
                  (
                      signature,
                      version_needed,
                      flags,
                      method,
                      modified_time,
                      modified_date,
                      local_crc32,
                      local_compressed_size,
                      local_uncompressed_size,
                      filename_length,
                      extra_length,
                  ) = fields
                  if signature != b"PK\x03\x04":
                      raise RuntimeError("invalid ZIP local header signature")
                  if method != int(member["compression_method"]):
                      raise RuntimeError("ZIP compression-method mismatch")
                  if flags & 0x1:
                      raise RuntimeError("encrypted ZIP member is unsupported")
                  filename_end = 30 + filename_length
                  extra_end = filename_end + extra_length
                  if extra_end > len(header):
                      raise RuntimeError("local ZIP header exceeds inspection window")
                  encoding = "utf-8" if flags & 0x800 else "cp437"
                  observed_name = header[30:filename_end].decode(encoding)
                  if observed_name != member["path"]:
                      raise RuntimeError(
                          f"local ZIP member path mismatch: {observed_name!r}"
                      )
                  data_start = offset + extra_end
                  data_end = data_start + int(member["compressed_bytes"]) - 1
                  target = transient / Path(member["path"]).name
                  decompressor = zlib.decompressobj(-15)
                  crc = 0
                  uncompressed = 0
                  compressed = 0
                  sha256 = hashlib.sha256()
                  with range_request(data_start, data_end) as response, target.open("wb") as handle:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          compressed += len(chunk)
                          transferred += len(chunk)
                          if transferred > MAX_COMPRESSED_TRANSFER + 8192:
                              raise RuntimeError("observed transfer exceeded bounded budget")
                          output = decompressor.decompress(chunk)
                          if output:
                              handle.write(output)
                              sha256.update(output)
                              crc = binascii.crc32(output, crc)
                              uncompressed += len(output)
                      output = decompressor.flush()
                      if output:
                          handle.write(output)
                          sha256.update(output)
                          crc = binascii.crc32(output, crc)
                          uncompressed += len(output)
                  if not decompressor.eof:
                      raise RuntimeError("deflate stream did not terminate cleanly")
                  if compressed != int(member["compressed_bytes"]):
                      raise RuntimeError("compressed member byte-count mismatch")
                  if uncompressed != int(member["uncompressed_bytes"]):
                      raise RuntimeError("uncompressed member byte-count mismatch")
                  observed_crc32 = f"{crc & 0xFFFFFFFF:08x}"
                  if observed_crc32 != member["crc32"]:
                      raise RuntimeError("uncompressed member CRC32 mismatch")

                  h5 = inspect_h5(target)
                  results.append(
                      {
                          **member,
                          "version_needed": int(version_needed),
                          "flags": int(flags),
                          "local_header_crc32": f"{local_crc32:08x}",
                          "local_header_compressed_bytes": int(local_compressed_size),
                          "local_header_uncompressed_bytes": int(local_uncompressed_size),
                          "data_start": data_start,
                          "data_end": data_end,
                          "observed_compressed_bytes": compressed,
                          "observed_uncompressed_bytes": uncompressed,
                          "observed_crc32": observed_crc32,
                          "uncompressed_sha256": sha256.hexdigest(),
                          "hdf5": h5,
                      }
                  )
              evidence = {
                  "schema_version": "1.0",
                  "record_id": "8132804",
                  "doi": "10.5281/zenodo.8132804",
                  "archive_name": "Multi_Modal_Data_Fusion_Chemical_Tomography.zip",
                  "archive_bytes": ARCHIVE_BYTES,
                  "archive_md5": "cb249cc2893428aa20c9b487918c0d5f",
                  "member_count_inspected": len(results),
                  "compressed_transfer_budget_bytes": MAX_COMPRESSED_TRANSFER,
                  "observed_range_transfer_bytes": transferred,
                  "full_archive_downloaded": False,
                  "source_members_retained": False,
                  "model_inference_performed": False,
                  "annotation_performed": False,
                  "members": results,
              }
              Path(
                  "outputs/zenodo_8132804_hdf5_probe/hdf5_member_inventory.json"
              ).write_text(
                  json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              print(
                  json.dumps(
                      {
                          "member_count_inspected": len(results),
                          "observed_range_transfer_bytes": transferred,
                          "full_archive_downloaded": False,
                          "members": [
                              {
                                  "path": item["path"],
                                  "uncompressed_sha256": item["uncompressed_sha256"],
                                  "dataset_count": item["hdf5"]["dataset_count"],
                                  "datasets": [
                                      {
                                          "path": dataset["path"],
                                          "shape": dataset["shape"],
                                          "dtype": dataset["dtype"],
                                          "attributes": dataset["attributes"],
                                      }
                                      for dataset in item["hdf5"]["datasets"]
                                  ],
                              }
                              for item in results
                          ],
                      },
                      indent=2,
                  )
              )
          finally:
              shutil.rmtree(transient, ignore_errors=True)
          PY

      - name: Verify metadata-only evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("outputs/zenodo_8132804_hdf5_probe")
          files = sorted(path.name for path in output.iterdir() if path.is_file())
          assert files == ["hdf5_member_inventory.json"]
          payload = json.loads((output / files[0]).read_text(encoding="utf-8"))
          assert payload["member_count_inspected"] == 2
          assert payload["full_archive_downloaded"] is False
          assert payload["source_members_retained"] is False
          assert payload["model_inference_performed"] is False
          assert payload["annotation_performed"] is False
          assert not any(path.suffix.casefold() in {".h5", ".hdf5", ".zip"} for path in output.rglob("*"))
          PY

      - name: Upload metadata-only HDF5 probe
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-8132804-hdf5-probe
          path: outputs/zenodo_8132804_hdf5_probe
          if-no-files-found: error
          retention-days: 7
