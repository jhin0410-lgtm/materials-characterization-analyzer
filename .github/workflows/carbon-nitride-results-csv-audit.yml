name: Carbon nitride TEM selected results CSV audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/zenodo_carbon_nitride_tem_results_csv_audit/**"
      - "case_studies/zenodo_carbon_nitride_tem_metadata_audit/verified_metadata_snapshot.json"
      - "scripts/audit_zenodo_carbon_nitride_results_csv.py"
      - "tests/test_carbon_nitride_results_csv_audit.py"
      - ".github/workflows/carbon-nitride-results-csv-audit.yml"
  push:
    branches: [main]
    paths:
      - "case_studies/zenodo_carbon_nitride_tem_results_csv_audit/**"
      - "case_studies/zenodo_carbon_nitride_tem_metadata_audit/verified_metadata_snapshot.json"
      - "scripts/audit_zenodo_carbon_nitride_results_csv.py"
      - "tests/test_carbon_nitride_results_csv_audit.py"
      - ".github/workflows/carbon-nitride-results-csv-audit.yml"

permissions:
  contents: read

concurrency:
  group: carbon-nitride-results-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused regressions
        run: pytest -q tests/test_carbon_nitride_results_csv_audit.py
      - name: Run exact selected CSV member audit
        run: |
          python scripts/audit_zenodo_carbon_nitride_results_csv.py \
            --config case_studies/zenodo_carbon_nitride_tem_results_csv_audit/case_config.json \
            --output outputs/carbon_nitride_results_csv_audit
      - name: Verify selected-member and scientific boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/carbon_nitride_results_csv_audit")
          snapshot = json.loads((root / "verified_results_csv_snapshot.json").read_text())
          pinned = json.loads(
              Path(
                  "case_studies/zenodo_carbon_nitride_tem_results_csv_audit/verified_results_csv_snapshot.json"
              ).read_text()
          )
          assert snapshot["execution_status"] == "bounded_selected_csv_member_completed"
          assert snapshot["selected_member"]["member_path"] == "Zenodo/Segmented images/CN-1-Na_20000x/results.csv"
          assert snapshot["selected_member"]["compressed_bytes"] == 10881
          assert snapshot["selected_member"]["uncompressed_bytes"] == 35135
          assert snapshot["selected_member"]["crc32_hex"] == "62f263da"
          assert snapshot["selected_member"]["content_sha256"] == pinned["selected_member"]["content_sha256"] == "e4ecc3c959c656b1db360924f8019a1a26ec5d2bd249a43e528d8b0400489d0f"
          assert snapshot["range_probe"]["network_bytes_retrieved"] == 10993
          assert snapshot["range_probe"]["archive_fraction_retrieved"] < 0.0001
          assert snapshot["csv_summary"]["row_count"] == pinned["csv_summary"]["row_count"] == 109
          assert snapshot["csv_summary"]["columns"] == pinned["csv_summary"]["columns"]
          assert "area_nm2" in snapshot["csv_summary"]["columns"]
          assert "equiv_diameter_nm" in snapshot["csv_summary"]["columns"]
          assert "particle_count" in snapshot["csv_summary"]["columns"]
          assert "calibration_method" in snapshot["csv_summary"]["columns"]
          assert "sam_refined" in snapshot["csv_summary"]["columns"]
          assert snapshot["source_archive_downloaded"] is False
          assert snapshot["other_member_content_downloaded"] is False
          assert snapshot["image_member_content_downloaded"] is False
          assert snapshot["pixel_array_access_performed"] is False
          assert snapshot["analyzer_inference_performed"] is False
          assert snapshot["evidence_assessment"]["csv_role_as_segmentation_object_measurement_output"] == "Supported"
          assert snapshot["evidence_assessment"]["independent_human_annotation_protocol"] == "Inconclusive"
          assert snapshot["evidence_assessment"]["annotation_completeness_across_15_raw_groups"] == "Unsupported"
          assert snapshot["evidence_assessment"]["co3o4_external_validation_use"] == "Unsupported"

          files = sorted(path.name for path in root.iterdir() if path.is_file())
          assert files == ["selected_results.csv", "verified_results_csv_snapshot.json"]
          PY
      - name: Upload selected text evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carbon-nitride-selected-results-csv-evidence
          path: outputs/carbon_nitride_results_csv_audit
          if-no-files-found: warn
          retention-days: 30
