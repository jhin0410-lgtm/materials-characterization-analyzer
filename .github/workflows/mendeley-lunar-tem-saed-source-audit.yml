name: Mendeley lunar TEM SAED source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_mendeley_lunar_tem_saed.py"
      - "scripts/run_mendeley_lunar_tem_saed_audit.py"
      - "tests/test_audit_mendeley_lunar_tem_saed.py"
      - "tests/test_run_mendeley_lunar_tem_saed_audit.py"
      - "case_studies/mendeley_lunar_tem_saed_source_audit/**"
      - ".github/workflows/mendeley-lunar-tem-saed-source-audit.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/audit_mendeley_lunar_tem_saed.py"
      - "scripts/run_mendeley_lunar_tem_saed_audit.py"
      - "tests/test_audit_mendeley_lunar_tem_saed.py"
      - "tests/test_run_mendeley_lunar_tem_saed_audit.py"
      - "case_studies/mendeley_lunar_tem_saed_source_audit/**"
      - ".github/workflows/mendeley-lunar-tem-saed-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: mendeley-lunar-tem-saed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused fail-closed tests
        run: |
          python -m py_compile \
            scripts/audit_mendeley_lunar_tem_saed.py \
            scripts/run_mendeley_lunar_tem_saed_audit.py
          pytest -q \
            tests/test_audit_mendeley_lunar_tem_saed.py \
            tests/test_run_mendeley_lunar_tem_saed_audit.py

      - name: Run expanded public landing and API access audit
        run: |
          python -m scripts.run_mendeley_lunar_tem_saed_audit \
            --config case_studies/mendeley_lunar_tem_saed_source_audit/case_config.json \
            --output outputs/mendeley_lunar_tem_saed_source_audit

      - name: Verify expanded registry evidence and scientific boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {
              "fcwyz3kv3k": (1, "10.17632/fcwyz3kv3k.1"),
              "w5jjhfp7v3": (1, "10.17632/w5jjhfp7v3.1"),
              "p8kpdbrhrg": (2, "10.17632/p8kpdbrhrg.2"),
              "ckpdp5wz7m": (1, "10.17632/ckpdp5wz7m.1"),
              "xn73vjk95x": (1, "10.17632/xn73vjk95x.1"),
              "g9rgyv53xt": (4, "10.17632/g9rgyv53xt.4"),
              "c44477pxc7": (2, "10.17632/c44477pxc7.2"),
          }
          root = Path("outputs/mendeley_lunar_tem_saed_source_audit")
          summary = json.loads(
              (root / "mendeley_lunar_access_audit_summary.json").read_text()
          )
          assert summary["status"] == (
              "mendeley_public_landing_metadata_verified_but_file_inventory_and_"
              "header_audit_require_oauth_authorization"
          )
          assert summary["evidence_level"] == "Diagnostic"
          assert summary["dataset_count"] == len(expected)
          by_id = {item["dataset_id"]: item for item in summary["datasets"]}
          assert set(by_id) == set(expected)
          for dataset_id, (version, doi) in expected.items():
              item = by_id[dataset_id]
              assert item["version"] == version
              assert item["doi"] == doi
              landing = item["landing_evidence"]
              assert landing["status_code"] == 200
              assert landing["files_section_present"] is True
              assert landing["download_all_control_present"] is True
              assert len(landing["response_sha256"]) == 64
              assert len(landing["visible_text_sha256"]) == 64
              assert landing["response_bytes"] > 50_000
              assert landing["description_terms_verified"]
              assert landing["license_terms_matched"]
              assert item["api_attempt_count"] == 7
              assert item["api_classifications"] == [
                  "oauth_authorization_required"
              ]

          assert summary["api_attempt_count"] == 7 * len(expected)
          assert summary["all_documented_api_endpoints_require_oauth_in_current_runner"] is True
          assert summary["evidence_assessment"]["public_landing_title_doi_version_description_and_license"] == "Supported"
          assert summary["evidence_assessment"]["anonymous_api_metadata_access_from_github_runner"] == "Unsupported"
          assert summary["evidence_assessment"]["public_file_uuid_size_sha256_and_folder_inventory"] == "Inconclusive"
          assert summary["evidence_assessment"]["native_microscopy_container_presence"] == "Inconclusive"
          assert summary["readiness"]["file_inventory_ready"] is False
          assert summary["readiness"]["bounded_header_audit_ready"] is False
          assert summary["readiness"]["cross_material_file_interoperability_diagnostic_ready"] is False
          assert summary["readiness"]["calibrated_saed_validation_ready"] is False
          assert summary["readiness"]["external_scientific_validation_ready"] is False
          assert summary["readiness"]["engineering_decision_ready"] is False
          assert summary["processing"]["source_files_retained"] is False
          assert summary["processing"]["api_response_bodies_retained"] is False
          assert summary["processing"]["landing_html_retained"] is False
          assert summary["processing"]["pixel_arrays_exported"] is False
          assert summary["processing"]["model_inference_performed"] is False
          assert summary["processing"]["parameter_tuning_performed"] is False
          assert summary["processing"]["model_retraining_performed"] is False
          assert summary["processing"]["phase_indexing_performed"] is False

          attempts = json.loads(
              (root / "mendeley_lunar_api_access_attempts.json").read_text()
          )
          assert len(attempts) == 7 * len(expected)
          assert {item["dataset_id"] for item in attempts} == set(expected)
          assert all(item["status_code"] == 401 for item in attempts)
          assert all(
              item["classification"] == "oauth_authorization_required"
              for item in attempts
          )
          assert all(item["sampled_bytes"] <= 65_536 for item in attempts)
          assert all(len(item["sample_sha256"]) == 64 for item in attempts)
          assert all(
              item["final_host"] == "api.data.mendeley.com"
              for item in attempts
          )

          manifest = json.loads(
              (root / "mendeley_lunar_access_audit_manifest.json").read_text()
          )
          assert manifest["artifact_count"] == len(manifest["artifacts"])
          for item in manifest["artifacts"]:
              path = root / item["path"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]

          forbidden = {
              ".dm3", ".dm4", ".emd", ".ser", ".emi", ".mrc", ".mrcs",
              ".tif", ".tiff", ".bmp", ".png", ".jpg", ".jpeg", ".zip",
              ".html", ".htm"
          }
          assert not [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in forbidden
          ]
          PY

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendeley-lunar-tem-saed-source-audit-evidence
          path: outputs/mendeley_lunar_tem_saed_source_audit
          if-no-files-found: error
          retention-days: 30
