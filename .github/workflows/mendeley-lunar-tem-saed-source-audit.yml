name: Mendeley lunar TEM SAED source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_mendeley_lunar_tem_saed.py"
      - "tests/test_audit_mendeley_lunar_tem_saed.py"
      - "case_studies/mendeley_lunar_tem_saed_source_audit/**"
      - ".github/workflows/mendeley-lunar-tem-saed-source-audit.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/audit_mendeley_lunar_tem_saed.py"
      - "tests/test_audit_mendeley_lunar_tem_saed.py"
      - "case_studies/mendeley_lunar_tem_saed_source_audit/**"
      - ".github/workflows/mendeley-lunar-tem-saed-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: mendeley-lunar-tem-saed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused fail-closed tests
        run: |
          python -m py_compile scripts/audit_mendeley_lunar_tem_saed.py
          pytest -q tests/test_audit_mendeley_lunar_tem_saed.py

      - name: Run live public metadata and bounded-header audit
        run: |
          python -m scripts.audit_mendeley_lunar_tem_saed \
            --config case_studies/mendeley_lunar_tem_saed_source_audit/case_config.json \
            --output outputs/mendeley_lunar_tem_saed_source_audit

      - name: Verify metadata-only evidence and scientific boundary
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/mendeley_lunar_tem_saed_source_audit")
          summary = json.loads(
              (root / "mendeley_lunar_tem_saed_audit_summary.json").read_text()
          )
          assert summary["status"] == (
              "mendeley_lunar_tem_saed_file_inventory_and_bounded_header_audit_"
              "completed_but_calibration_lineage_and_independence_incomplete"
          )
          assert summary["evidence_level"] == "Diagnostic"
          assert summary["dataset_count"] == 2
          by_id = {item["dataset_id"]: item for item in summary["datasets"]}
          assert set(by_id) == {"fcwyz3kv3k", "w5jjhfp7v3"}
          assert by_id["fcwyz3kv3k"]["version"] == 1
          assert by_id["fcwyz3kv3k"]["doi"] == "10.17632/fcwyz3kv3k.1"
          assert by_id["w5jjhfp7v3"]["version"] == 1
          assert by_id["w5jjhfp7v3"]["doi"] == "10.17632/w5jjhfp7v3.1"
          assert all(item["file_count"] > 0 for item in by_id.values())
          assert all(item["header_sample_count"] > 0 for item in by_id.values())
          assert all(
              item["total_header_bytes_sampled"] <= 1_572_864
              for item in by_id.values()
          )
          assert summary["evidence_assessment"]["dataset_doi_version_title_and_license"] == "Supported"
          assert summary["evidence_assessment"]["public_file_inventory_identity"] == "Supported"
          assert summary["readiness"]["cross_material_file_interoperability_diagnostic_ready"] is True
          assert summary["readiness"]["calibrated_saed_validation_ready"] is False
          assert summary["readiness"]["external_scientific_validation_ready"] is False
          assert summary["readiness"]["engineering_decision_ready"] is False
          assert summary["processing"]["source_files_retained"] is False
          assert summary["processing"]["pixel_arrays_exported"] is False
          assert summary["processing"]["image_preprocessing_performed"] is False
          assert summary["processing"]["model_inference_performed"] is False
          assert summary["processing"]["parameter_tuning_performed"] is False
          assert summary["processing"]["model_retraining_performed"] is False
          assert summary["processing"]["phase_indexing_performed"] is False

          with (root / "mendeley_lunar_file_inventory.csv").open(newline="") as handle:
              inventory = list(csv.DictReader(handle))
          assert len(inventory) == sum(item["file_count"] for item in by_id.values())
          assert all(row["file_id"] for row in inventory)
          assert all(not Path(row["path"]).is_absolute() for row in inventory)

          headers = json.loads(
              (root / "mendeley_lunar_header_samples.json").read_text()
          )
          assert {item["dataset_id"] for item in headers} == set(by_id)
          for dataset in headers:
              assert len(dataset["headers"]) == by_id[dataset["dataset_id"]]["header_sample_count"]
              assert all(item["sampled_bytes"] <= 65_536 for item in dataset["headers"])
              assert all(len(item["sample_sha256"]) == 64 for item in dataset["headers"])

          manifest = json.loads(
              (root / "mendeley_lunar_tem_saed_audit_manifest.json").read_text()
          )
          assert manifest["artifact_count"] == len(manifest["artifacts"])
          for item in manifest["artifacts"]:
              path = root / item["path"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]

          forbidden = {
              ".dm3", ".dm4", ".emd", ".ser", ".emi", ".mrc", ".mrcs",
              ".tif", ".tiff", ".bmp", ".png", ".jpg", ".jpeg", ".zip"
          }
          assert not [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in forbidden
          ]
          PY

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mendeley-lunar-tem-saed-source-audit-evidence
          path: outputs/mendeley_lunar_tem_saed_source_audit
          if-no-files-found: error
          retention-days: 30
