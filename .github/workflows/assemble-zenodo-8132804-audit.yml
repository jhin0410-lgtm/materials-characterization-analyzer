name: Assemble Zenodo 8132804 audit source

on:
  pull_request:
    paths:
      - "scripts/.zenodo_8132804_parts/**"
      - ".github/workflows/assemble-zenodo-8132804-audit.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-zenodo-8132804-co3o4-mn3o4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assemble corrected source and test typo
        run: |
          cat \
            scripts/.zenodo_8132804_parts/part1.txt \
            scripts/.zenodo_8132804_parts/part2.txt \
            scripts/.zenodo_8132804_parts/part3.txt \
            scripts/.zenodo_8132804_parts/part4.txt \
            > scripts/audit_zenodo_8132804_co3o4_mn3o4.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_zenodo_8132804_co3o4_mn3o4_audit.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert context["microscopy"] == ["HAADF-STEM tomography", "EELS tmography"]'
          new = 'assert context["microscopy"] == ["HAADF-STEM tomography", "EELS tomography"]'
          if text.count(old) != 1:
              raise SystemExit("expected test typo was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate assembled source
        run: |
          python -m py_compile scripts/audit_zenodo_8132804_co3o4_mn3o4.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_zenodo_8132804_co3o4_mn3o4_audit.py

      - name: Commit corrected permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_zenodo_8132804_co3o4_mn3o4.py \
            tests/test_zenodo_8132804_co3o4_mn3o4_audit.py
          git diff --cached --check
          git commit -m "Fix bounded Zenodo Co3O4-Mn3O4 audit source"
          git push origin HEAD:agent/audit-zenodo-8132804-co3o4-mn3o4
