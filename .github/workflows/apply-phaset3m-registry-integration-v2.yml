name: Apply PhaseT3M registry integration v2

on:
  pull_request:
    paths:
      - ".github/workflows/apply-phaset3m-registry-integration-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phaset3m-co3o4-candidate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Integrate PhaseT3M candidate and packaging metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new)

          # Registry classification: exact-material processed data needs a distinct
          # diagnostic state and must never be promoted to annotation/evaluation readiness.
          engine_path = Path("src/mca/tem_external_validation_candidate_registry_engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          engine = replace_once(
              engine,
              'ANNOTATION_PILOT = "annotation_pilot_candidate_not_validation_ready"\n',
              'ANNOTATION_PILOT = "annotation_pilot_candidate_not_validation_ready"\n'
              'PROCESSED_IN_DOMAIN = "processed_in_domain_diagnostic_only"\n',
              "status constant",
          )
          engine = replace_once(
              engine,
              '    annotation_contract_satisfied = all(\n',
              '    processed_in_domain = all(\n'
              '        (\n'
              '            exact_target,\n'
              '            has_tem_modality,\n'
              '            not candidate.raw_or_lossless_tem_images_available,\n'
              '            candidate.file_inventory_status in _RESOLVED_INVENTORIES,\n'
              '            not rendered_exclusion,\n'
              '        )\n'
              '    )\n'
              '    annotation_contract_satisfied = all(\n',
              "processed candidate derivation",
          )
          engine = replace_once(
              engine,
              '    elif rendered_exclusion:\n'
              '        status, rank = EXCLUDED_REPRESENTATION, 15\n',
              '    elif processed_in_domain:\n'
              '        status, rank = PROCESSED_IN_DOMAIN, 12\n'
              '    elif rendered_exclusion:\n'
              '        status, rank = EXCLUDED_REPRESENTATION, 15\n',
              "processed classification",
          )
          engine = replace_once(
              engine,
              '        ANNOTATION_PILOT,\n        EXCLUDED_REPRESENTATION,\n',
              '        ANNOTATION_PILOT,\n'
              '        PROCESSED_IN_DOMAIN,\n'
              '        EXCLUDED_REPRESENTATION,\n',
              "recommendation preference",
          )
          engine = replace_once(
              engine,
              '        "annotation_pilot_candidate_count": count(ANNOTATION_PILOT),\n',
              '        "annotation_pilot_candidate_count": count(ANNOTATION_PILOT),\n'
              '        "processed_in_domain_diagnostic_count": count(PROCESSED_IN_DOMAIN),\n',
              "result count",
          )
          old_closeout = (
              '                    "Six public records were assessed against explicit material, modality, "\n'
              '                    "file, representation, lineage, label, non-use, and licence gates. The "\n'
              '                    "only Co3O4-containing lead resolves to rendered mixed-heterojunction "\n'
              '                    "figure images rather than an independent raw validation set."\n'
          )
          new_closeout = (
              '                    f"{len(rows)} public records were assessed against explicit material, "\n'
              '                    "modality, file, representation, lineage, label, non-use, and licence "\n'
              '                    "gates. Exact-material records remain blocked as target-source data, "\n'
              '                    "processed single-particle data, or representations without the "\n'
              '                    "lineage and labels required for independent validation."\n'
          )
          engine = replace_once(engine, old_closeout, new_closeout, "dynamic closeout")
          engine_path.write_text(engine, encoding="utf-8")

          facade_path = Path("src/mca/tem_external_validation_candidate_registry.py")
          facade = facade_path.read_text(encoding="utf-8")
          facade = replace_once(
              facade,
              '    METADATA_RESOLUTION,\n',
              '    METADATA_RESOLUTION,\n    PROCESSED_IN_DOMAIN,\n',
              "facade import",
          )
          facade = replace_once(
              facade,
              '    "METADATA_RESOLUTION",\n',
              '    "METADATA_RESOLUTION",\n    "PROCESSED_IN_DOMAIN",\n',
              "facade export",
          )
          facade_path.write_text(facade, encoding="utf-8")

          # Append the official, exact-material but processed candidate.
          config_path = Path("case_studies/tem_external_validation_candidate_registry/case_config.json")
          payload = json.loads(config_path.read_text(encoding="utf-8"))
          payload["search_snapshot"]["search_date"] = "2026-08-02"
          term = "Co3O4 electron tomography raw tilt series"
          if term not in payload["search_snapshot"]["search_terms"]:
              payload["search_snapshot"]["search_terms"].append(term)
          candidate_id = "zenodo_17336678_phaset3m_co3o4_processed_tilt_series"
          if any(item["candidate_id"] == candidate_id for item in payload["candidates"]):
              raise SystemExit("PhaseT3M candidate already exists")
          payload["candidates"].append({
              "candidate_id": candidate_id,
              "repository": "Zenodo",
              "doi": "10.5281/zenodo.17336678",
              "record_url": "https://zenodo.org/records/17336678",
              "title": "PhaseT3M: 3D Imaging at 1.6 Å Resolution via Electron Cryo-Tomography with Nonlinear Phase Retrieval",
              "materials": ["Co3O4 nanoparticle"],
              "modalities": ["TEM", "HRTEM", "electron tomography"],
              "file_inventory_status": "exact",
              "file_checksums_available": True,
              "raw_or_lossless_tem_images_available": False,
              "reported_tem_file_count": 1,
              "independent_segmentation_labels_available": False,
              "label_origin": "no independent segmentation labels reported",
              "labeler_count": None,
              "immutable_sample_ids_available": False,
              "immutable_acquisition_ids_available": False,
              "verified_not_used_for_target_training_or_model_selection": False,
              "target_creator_name_overlap": True,
              "target_material_relation": "exact_cobalt_oxide",
              "imaging_domain_relation": "material_or_acquisition_domain_shift",
              "reuse_license": "dataset record does not explicitly declare a data reuse licence; GPL-3.0 is stated for code only",
              "reuse_license_verified": False,
              "target_training_source": False,
              "source_evidence": [
                  "Official Zenodo metadata describes an approximately 7 nm Co3O4 nanoparticle and a 501 MB raw_tilt_data.zip archive with MD5 efb1e487aedbafa7c0822e0d31968d05.",
                  "The source states that released tilt series were motion-corrected and tilt-aligned, and names the relevant member Co3O4_denoised_tilt_series.h5.",
                  "The checksum-bound audit inspects the unique HDF5 member while preserving the source declaration that the representation is denoised and processed rather than raw detector data.",
                  "Min Gee Cho and Mary Scott overlap the target cobalt-oxide training-source creators, so repository separation does not establish model-development independence."
              ],
              "next_validation_step": "Use only for processed exact-material HDF5 and robustness diagnostics. Request raw detector frames, immutable sample/acquisition lineage, explicit data reuse terms, and an independent multi-sample source before blinded annotation or model evaluation.",
              "blinded_labeling_verified": False,
              "adjudicated_consensus_available": False
          })
          config_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # Update pinned regression expectations and add a CSV-field-level test.
          tests_path = Path("tests/test_tem_external_validation_candidate_registry.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '    EXCLUDED_REPRESENTATION,\n',
              '    EXCLUDED_REPRESENTATION,\n    PROCESSED_IN_DOMAIN,\n',
              "test import",
          )
          tests = replace_once(tests, '"candidate_count": 6,', '"candidate_count": 7,', "count")
          tests = replace_once(
              tests,
              '        "annotation_pilot_candidate_count": 0,\n',
              '        "annotation_pilot_candidate_count": 0,\n'
              '        "processed_in_domain_diagnostic_count": 1,\n',
              "pinned processed count",
          )
          tests = replace_once(
              tests,
              '        "mendeley_8w66synjmx_cop_co2p_co3o4"\n'
              '    )\n'
              '    assert summary["readiness"]["recommended_candidate_status"] == (\n'
              '        EXCLUDED_REPRESENTATION\n'
              '    )\n',
              '        "zenodo_17336678_phaset3m_co3o4_processed_tilt_series"\n'
              '    )\n'
              '    assert summary["readiness"]["recommended_candidate_status"] == (\n'
              '        PROCESSED_IN_DOMAIN\n'
              '    )\n',
              "recommendation assertions",
          )
          tests = replace_once(
              tests,
              '    assert printed["candidate_count"] == 6\n',
              '    assert printed["candidate_count"] == 7\n',
              "CLI count",
          )
          tests = replace_once(
              tests,
              '        "mendeley_8w66synjmx_cop_co2p_co3o4"\n'
              '    )\n'
              '    assert (output / "tem_external_validation_candidate_report.md").is_file()\n',
              '        "zenodo_17336678_phaset3m_co3o4_processed_tilt_series"\n'
              '    )\n'
              '    assert (output / "tem_external_validation_candidate_report.md").is_file()\n',
              "CLI recommendation",
          )
          tests = replace_once(
              tests,
              '            "annotation_pilot_candidate_count",\n',
              '            "annotation_pilot_candidate_count",\n'
              '            "processed_in_domain_diagnostic_count",\n',
              "count reconciliation",
          )
          marker = 'def test_training_source_is_explicitly_excluded(tmp_path: Path) -> None:\n'
          addition = textwrap.dedent('''\
          def test_phaset3m_processed_exact_material_is_diagnostic_only(
              tmp_path: Path,
          ) -> None:
              output = tmp_path / "out"
              run_candidate_registry(load_registry_config(CONFIG), output)
              with (output / "tem_external_validation_candidate_inventory.csv").open(
                  encoding="utf-8", newline=""
              ) as handle:
                  rows = list(csv.DictReader(handle))
              candidate = next(
                  row
                  for row in rows
                  if row["candidate_id"]
                  == "zenodo_17336678_phaset3m_co3o4_processed_tilt_series"
              )
              assert candidate["candidate_status"] == PROCESSED_IN_DOMAIN
              assert candidate["in_domain_external_validation_ready"] == "False"
              assert candidate["evaluation_ready"] == "False"
              assert "raw_or_lossless_tem_images_unavailable" in candidate["blockers"]
              assert "target_creator_overlap" in candidate["blockers"]
              assert "reuse_license_unverified" in candidate["blockers"]


          ''')
          tests = replace_once(tests, marker, addition + marker, "new regression test")
          tests_path.write_text(tests, encoding="utf-8")

          # Documentation reflects the current, audited source state.
          registry_readme = textwrap.dedent('''\
          # TEM External-Validation Candidate Registry

          This case study records a dated public-source search for an untouched cobalt-oxide TEM/HRTEM segmentation evaluation set.

          It separates target training data, exact-material processed diagnostics, rendered figures, cross-material/cross-phase microscopy, and wrong-modality records. Repository or author separation alone never proves acquisition independence.

          Run:

          ```bash
          mca tem-candidates \\
            --config case_studies/tem_external_validation_candidate_registry/case_config.json \\
            --output outputs/tem_external_validation_candidate_registry
          ```

          Outputs are the candidate inventory, summary, report, annotation-protocol template, and checksum manifest.

          ## Source snapshot

          The registry was refreshed on 2026-08-02 from official records and checksum-bound audits:

          - Zenodo `10.5281/zenodo.14927582`: target cobalt-oxide TEM source and training files; excluded as the target source.
          - Zenodo `10.5281/zenodo.17336678`: one Co3O4 nanoparticle tilt series in `Co3O4_denoised_tilt_series.h5`; exact-material but motion-corrected, tilt-aligned, denoised, single-particle, creator-overlapping, and not independently labeled.
          - Dryad `10.7941/D1SP93`: Au/Ag/CdSe HRTEM image-label pairs; cross-material only.
          - Mendeley Data `10.17632/8w66synjmx.1`: rendered RGB CoP/Co2P/Co3O4 publication figures, not raw detector data.
          - Zenodo `10.5281/zenodo.14868077`: cobalt-hydroxide/ionomer cryo-TEM; cross-phase and unlabeled.
          - Zenodo `10.5281/zenodo.11161891`: cobalt-tungstate STEM/TEM; cross-phase only.
          - Zenodo `10.5281/zenodo.7941248`: Co3O4 SEM/XPS/HAXPES; wrong modality.

          ## Current conclusion

          No assessed public candidate is ready for in-domain external validation. PhaseT3M is the best exact-material processed diagnostic source, not an evaluation set. It may support checksum/HDF5 ingestion and processed-representation robustness checks only.

          Readiness still requires raw or demonstrably lossless TEM/HRTEM from at least two independent samples/acquisitions, immutable lineage, explicit reuse terms, verified target-model non-use and content disjointness, and at least two blinded independent labels plus adjudication.

          The annotation protocol remains a template and must not be frozen around PhaseT3M.
          ''')
          Path("case_studies/tem_external_validation_candidate_registry/README.md").write_text(
              registry_readme, encoding="utf-8"
          )

          root_readme_path = Path("README.md")
          root_readme = root_readme_path.read_text(encoding="utf-8")
          root_readme = replace_once(
              root_readme,
              '- `case_studies/public_finds_saed/`: calibrated FINDS SAED real-image diagnostic case.\n',
              '- `case_studies/public_finds_saed/`: calibrated FINDS SAED real-image diagnostic case.\n'
              '- `case_studies/phaset3m_co3o4_candidate_audit/`: checksum-bound processed Co3O4 tilt-series diagnostic audit; not external segmentation validation.\n',
              "root README case list",
          )
          root_readme_path.write_text(root_readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = replace_once(
              changelog,
              '## [Unreleased]\n\n### Fixed\n',
              '## [Unreleased]\n\n### Added\n\n'
              '- A checksum-bound PhaseT3M Co3O4 tilt-series candidate audit that safely inventories the Zenodo ZIP, inspects the unique HDF5 member, records source processing, and excludes raw files from evidence artifacts.\n'
              '- A `processed_in_domain_diagnostic_only` registry state so exact-material denoised or otherwise processed microscopy cannot be mistaken for raw external-validation data.\n\n'
              '### Fixed\n',
              "changelog",
          )
          changelog_path.write_text(changelog, encoding="utf-8")

          # Adopt PEP 639 metadata while preserving the BSD-3-Clause contract.
          project_path = Path("pyproject.toml")
          project = project_path.read_text(encoding="utf-8")
          project = replace_once(
              project,
              'requires = ["setuptools>=68", "wheel"]',
              'requires = ["setuptools>=77", "wheel"]',
              "setuptools floor",
          )
          project = replace_once(
              project,
              'license = { file = "LICENSE" }',
              'license = "BSD-3-Clause"\nlicense-files = ["LICENSE"]',
              "SPDX license metadata",
          )
          project = replace_once(
              project,
              '    "License :: OSI Approved :: BSD License",\n',
              '',
              "deprecated license classifier",
          )
          project_path.write_text(project, encoding="utf-8")

          for temporary in (
              Path(".github/workflows/apply-phaset3m-registry-update.yml"),
              Path(".github/workflows/apply-phaset3m-registry-integration-v2.yml"),
          ):
              temporary.unlink()
          PY

      - name: Run focused and full validation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca scripts/audit_phaset3m_co3o4_candidate.py
          pytest -q \
            tests/test_phaset3m_co3o4_candidate_audit.py \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_release_metadata.py
          pytest -q
          set -o pipefail
          python -m build 2>&1 | tee /tmp/build.log
          if grep -q "SetuptoolsDeprecationWarning" /tmp/build.log; then
            echo "setuptools deprecation warning remains" >&2
            exit 1
          fi

      - name: Commit and push integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate PhaseT3M Co3O4 diagnostic candidate"
          git push origin HEAD:agent/audit-phaset3m-co3o4-candidate
