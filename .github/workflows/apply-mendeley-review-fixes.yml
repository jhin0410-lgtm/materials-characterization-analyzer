name: Apply Mendeley review fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-mendeley-review-fixes.yml"
      - "scripts/apply_mendeley_review_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: python scripts/apply_mendeley_review_fixes.py

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_tem_mendeley_candidate_audit.py
          tests/test_probe_mendeley_public_page.py
          tests/test_tem_external_validation_candidate_registry.py
          tests/test_tem_candidate_registry_readiness_integration.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_mendeley_candidate_audit_engine.py \
            src/mca/tem_mendeley_candidate_audit.py \
            src/mca/tem_external_validation_candidate_registry_engine.py \
            scripts/probe_mendeley_public_page.py \
            scripts/refresh_mendeley_candidate_audit_manifest.py \
            tests/test_tem_mendeley_candidate_audit.py \
            tests/test_probe_mendeley_public_page.py \
            tests/test_tem_external_validation_candidate_registry.py \
            case_studies/mendeley_cop_co2p_co3o4_tem_candidate/README.md
          git commit -m "Fix Mendeley audit and registry gates [mendeley-review-fixes-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
