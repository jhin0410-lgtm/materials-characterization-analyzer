name: Probe Zenodo 8132804 metadata

on:
  pull_request:
    paths:
      - ".github/workflows/probe-zenodo-8132804.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Zenodo record metadata and bounded ZIP inventory
        run: |
          mkdir -p outputs/zenodo_8132804_probe
          python - <<'PY'
          import hashlib
          import json
          import struct
          import urllib.request
          from pathlib import Path

          USER_AGENT = "materials-characterization-analyzer-source-audit/1.0"
          RECORD_URL = "https://zenodo.org/api/records/8132804"
          EXPECTED_ARCHIVE = "Multi_Modal_Data_Fusion_Chemical_Tomography.zip"
          EXPECTED_BYTES = 1_183_315_114
          EXPECTED_MD5 = "cb249cc2893428aa20c9b487918c0d5f"
          MAX_RANGE_BYTES = 16 * 1024 * 1024

          def fetch(url: str, *, range_header: str | None = None) -> tuple[bytes, int, dict[str, str]]:
              headers = {"Accept": "application/json", "User-Agent": USER_AGENT}
              if range_header is not None:
                  headers["Range"] = range_header
                  headers["Accept"] = "application/octet-stream"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=180) as response:
                  status = int(response.status)
                  body = response.read(MAX_RANGE_BYTES + 1)
                  if len(body) > MAX_RANGE_BYTES:
                      raise RuntimeError("range response exceeded transfer budget")
                  response_headers = {key.casefold(): value for key, value in response.headers.items()}
              return body, status, response_headers

          raw, status, _ = fetch(RECORD_URL)
          if status != 200:
              raise RuntimeError(f"unexpected record API status: {status}")
          payload = json.loads(raw)
          files = payload.get("files", [])
          if len(files) != 1:
              raise RuntimeError("unexpected Zenodo file count")
          archive = files[0]
          checksum = str(archive.get("checksum", ""))
          if archive.get("key") != EXPECTED_ARCHIVE:
              raise RuntimeError("archive name mismatch")
          if int(archive.get("size", 0)) != EXPECTED_BYTES:
              raise RuntimeError("archive byte count mismatch")
          if checksum.casefold() != f"md5:{EXPECTED_MD5}":
              raise RuntimeError("archive MD5 mismatch")
          content_url = archive["links"]["self"]

          tail_size = 256 * 1024
          tail_start = EXPECTED_BYTES - tail_size
          tail, tail_status, tail_headers = fetch(
              content_url,
              range_header=f"bytes={tail_start}-{EXPECTED_BYTES - 1}",
          )
          if tail_status != 206:
              raise RuntimeError(f"Zenodo did not honor bounded tail range: {tail_status}")
          expected_content_range = f"bytes {tail_start}-{EXPECTED_BYTES - 1}/{EXPECTED_BYTES}"
          if tail_headers.get("content-range") != expected_content_range:
              raise RuntimeError("tail Content-Range mismatch")

          eocd_signature = b"PK\x05\x06"
          eocd_at = tail.rfind(eocd_signature)
          if eocd_at < 0:
              raise RuntimeError("ZIP end-of-central-directory record not found")
          if eocd_at + 22 > len(tail):
              raise RuntimeError("truncated ZIP end-of-central-directory record")
          (
              signature,
              disk_number,
              central_disk,
              disk_entry_count,
              total_entry_count,
              central_size,
              central_offset,
              comment_length,
          ) = struct.unpack_from("<4s4H2LH", tail, eocd_at)
          if signature != eocd_signature:
              raise RuntimeError("invalid ZIP end-of-central-directory signature")
          if any(value != 0 for value in (disk_number, central_disk)):
              raise RuntimeError("multi-disk ZIP is unsupported")
          if disk_entry_count != total_entry_count:
              raise RuntimeError("ZIP entry count mismatch across disks")
          if any(
              value in (0xFFFF, 0xFFFFFFFF)
              for value in (total_entry_count, central_size, central_offset)
          ):
              raise RuntimeError("ZIP64 archive requires a separate bounded parser")
          if eocd_at + 22 + comment_length > len(tail):
              raise RuntimeError("truncated ZIP comment")
          if central_size <= 0 or central_size > MAX_RANGE_BYTES:
              raise RuntimeError("central directory exceeds bounded transfer budget")
          if central_offset + central_size > EXPECTED_BYTES:
              raise RuntimeError("central directory lies outside archive")

          central, central_status, central_headers = fetch(
              content_url,
              range_header=f"bytes={central_offset}-{central_offset + central_size - 1}",
          )
          if central_status != 206:
              raise RuntimeError(f"Zenodo did not honor central-directory range: {central_status}")
          expected_cd_range = (
              f"bytes {central_offset}-{central_offset + central_size - 1}/{EXPECTED_BYTES}"
          )
          if central_headers.get("content-range") != expected_cd_range:
              raise RuntimeError("central-directory Content-Range mismatch")
          if len(central) != central_size:
              raise RuntimeError("central-directory byte count mismatch")

          entries = []
          cursor = 0
          fixed_format = "<4s6H3L5H2L"
          fixed_size = struct.calcsize(fixed_format)
          while cursor < len(central):
              if cursor + fixed_size > len(central):
                  raise RuntimeError("truncated central-directory entry")
              values = struct.unpack_from(fixed_format, central, cursor)
              (
                  entry_signature,
                  version_made,
                  version_needed,
                  flags,
                  method,
                  modified_time,
                  modified_date,
                  crc32,
                  compressed_size,
                  uncompressed_size,
                  filename_length,
                  extra_length,
                  entry_comment_length,
                  disk_start,
                  internal_attributes,
                  external_attributes,
                  local_header_offset,
              ) = values
              if entry_signature != b"PK\x01\x02":
                  raise RuntimeError(f"invalid central-directory signature at byte {cursor}")
              start = cursor + fixed_size
              filename_bytes = central[start : start + filename_length]
              if len(filename_bytes) != filename_length:
                  raise RuntimeError("truncated central-directory filename")
              encoding = "utf-8" if flags & 0x800 else "cp437"
              filename = filename_bytes.decode(encoding)
              entries.append(
                  {
                      "path": filename,
                      "compressed_bytes": compressed_size,
                      "uncompressed_bytes": uncompressed_size,
                      "compression_method": method,
                      "crc32": f"{crc32:08x}",
                      "flags": flags,
                      "local_header_offset": local_header_offset,
                      "version_needed": version_needed,
                  }
              )
              cursor = start + filename_length + extra_length + entry_comment_length

          if cursor != len(central):
              raise RuntimeError("central-directory parsing did not consume all bytes")
          if len(entries) != total_entry_count:
              raise RuntimeError("parsed entry count mismatch")

          target_entries = [
              entry
              for entry in entries
              if any(token in entry["path"].casefold() for token in ("co3o4", "mn3o4", "cobalt", "mangan"))
          ]
          output = {
              "schema_version": "1.0",
              "record_id": str(payload.get("id")),
              "doi": payload.get("doi"),
              "conceptdoi": payload.get("conceptdoi"),
              "created": payload.get("created"),
              "updated": payload.get("updated"),
              "metadata": payload.get("metadata"),
              "archive": {
                  "name": EXPECTED_ARCHIVE,
                  "bytes": EXPECTED_BYTES,
                  "md5": EXPECTED_MD5,
                  "entry_count": total_entry_count,
                  "central_directory_offset": central_offset,
                  "central_directory_bytes": central_size,
              },
              "entries": entries,
              "target_entries": target_entries,
              "target_entry_count": len(target_entries),
              "range_transfer_bytes": len(tail) + len(central),
              "full_archive_downloaded": False,
              "record_metadata_sha256": hashlib.sha256(raw).hexdigest(),
              "tail_sha256": hashlib.sha256(tail).hexdigest(),
              "central_directory_sha256": hashlib.sha256(central).hexdigest(),
          }
          path = Path("outputs/zenodo_8132804_probe/record_and_zip_inventory.json")
          path.write_text(json.dumps(output, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "record_id": output["record_id"],
              "doi": output["doi"],
              "archive": output["archive"],
              "target_entry_count": output["target_entry_count"],
              "target_entries": output["target_entries"],
              "range_transfer_bytes": output["range_transfer_bytes"],
              "full_archive_downloaded": output["full_archive_downloaded"],
          }, indent=2))
          PY

      - name: Upload metadata probe
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-8132804-metadata-probe
          path: outputs/zenodo_8132804_probe
          if-no-files-found: error
          retention-days: 7
