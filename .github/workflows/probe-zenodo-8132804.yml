name: Probe Zenodo 8132804 metadata

on:
  pull_request:
    paths:
      - ".github/workflows/probe-zenodo-8132804.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Zenodo record metadata
        run: |
          mkdir -p outputs/zenodo_8132804_probe
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          url = "https://zenodo.org/api/records/8132804"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "materials-characterization-analyzer-source-audit/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              raw = response.read()
          payload = json.loads(raw)
          files = []
          for item in payload.get("files", []):
              files.append(
                  {
                      "key": item.get("key"),
                      "size": item.get("size"),
                      "checksum": item.get("checksum"),
                      "links": item.get("links"),
                  }
              )
          output = {
              "record_id": str(payload.get("id")),
              "doi": payload.get("doi"),
              "conceptdoi": payload.get("conceptdoi"),
              "created": payload.get("created"),
              "updated": payload.get("updated"),
              "metadata": payload.get("metadata"),
              "files": files,
              "file_count": len(files),
              "total_bytes": sum(int(item.get("size") or 0) for item in files),
              "record_metadata_sha256": hashlib.sha256(raw).hexdigest(),
          }
          path = Path("outputs/zenodo_8132804_probe/record_probe.json")
          path.write_text(json.dumps(output, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "record_id": output["record_id"],
              "doi": output["doi"],
              "file_count": output["file_count"],
              "total_bytes": output["total_bytes"],
              "files": [{"key": f["key"], "size": f["size"], "checksum": f["checksum"]} for f in files],
          }, indent=2))
          PY

      - name: Upload metadata probe
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-8132804-metadata-probe
          path: outputs/zenodo_8132804_probe
          if-no-files-found: error
          retention-days: 7
