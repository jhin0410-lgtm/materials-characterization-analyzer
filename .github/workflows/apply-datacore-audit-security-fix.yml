name: Apply DataCORE audit security fix

on:
  push:
    branches:
      - agent/audit-datacore-saed-source
    paths:
      - ".github/workflows/apply-datacore-audit-security-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-datacore-saed-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply fail-closed redaction and remove temporary request machinery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          audit_path = Path("scripts/audit_datacore_saed_candidate.py")
          audit = audit_path.read_text(encoding="utf-8")
          old = '''    prefix = payload[:256]\n    text_prefix = prefix.decode("utf-8", errors="replace")\n    sanitized_text = re.sub(r"\\s+", " ", text_prefix).strip()[:200]\n    return {\n        "schema_version": "1.0",\n        "case_id": "datacore_chromium_telluride_saed_download_diagnostic",\n        "source_url": _safe_url(source_url),\n        "resolved_url": _safe_url(final_url),\n        "response": dict(response_metadata),\n        "bytes": len(payload),\n        "sha256": _sha256(payload),\n        "first_32_bytes_hex": payload[:32].hex(),\n        "sanitized_text_prefix": sanitized_text,\n        "is_zip": zipfile.is_zipfile(io.BytesIO(payload)),\n        "raw_payload_persisted": False,\n    }\n'''
          new = '''    stripped = payload.lstrip()\n    lowered_prefix = stripped[:32].lower()\n    response_prefix_kind = (\n        "html"\n        if lowered_prefix.startswith((b"<!doctype html", b"<html"))\n        else "binary_or_unknown"\n    )\n    return {\n        "schema_version": "1.0",\n        "case_id": "datacore_chromium_telluride_saed_download_diagnostic",\n        "source_url": _safe_url(source_url),\n        "resolved_url": _safe_url(final_url),\n        "response": dict(response_metadata),\n        "bytes": len(payload),\n        "sha256": _sha256(payload),\n        "first_16_bytes_hex": payload[:16].hex(),\n        "response_prefix_kind": response_prefix_kind,\n        "is_zip": zipfile.is_zipfile(io.BytesIO(payload)),\n        "raw_payload_persisted": False,\n        "response_text_persisted": False,\n    }\n'''
          if old not in audit:
              raise SystemExit("expected diagnostic block was not found")
          audit_path.write_text(audit.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_datacore_saed_candidate_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'payload = b"<!doctype html><html><title>Download</title></html>"',
              'payload = (\n        b\'<!doctype html><html><head><meta name="csrf-token" \'\n        b\'content="do-not-persist-this-token"></head></html>\'\n    )',
          )
          marker = '    assert not (output / "source.zip").exists()\n\n\ndef test_run_records_raw_evidence_without_authorizing_validation('
          replacement = '''    assert not (output / "source.zip").exists()\n    diagnostic_text = (output / "source_download_diagnostic.json").read_text(\n        encoding="utf-8"\n    )\n    assert "do-not-persist-this-token" not in diagnostic_text\n    assert "sanitized_text_prefix" not in diagnostic_text\n    assert "response_text_persisted" in diagnostic_text\n\n\ndef test_run_records_raw_evidence_without_authorizing_validation('''
          if marker not in tests:
              raise SystemExit("expected non-ZIP test marker was not found")
          test_path.write_text(tests.replace(marker, replacement), encoding="utf-8")

          workflow_path = Path(".github/workflows/datacore-saed-source-audit.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow, count = re.subn(
              r'\n      - name: Submit official archive retrieval request once\n.*?(?=\n      - name: Audit public DataCORE DM4 and TIFF source)',
              "",
              workflow,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one retrieval step, found {count}")
          workflow = workflow.replace(
              'for filename in ("file_page_probe.json", "retrieval_request_result.json"):',
              'for filename in ("file_page_probe.json",):',
          )
          workflow = workflow.replace(
              '            outputs/datacore-saed-source-audit/retrieval_request_result.json\n',
              "",
          )
          workflow = workflow.replace("          retention-days: 30", "          retention-days: 7")
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          rm -f .github/workflows/request-datacore-saed-retrieval.yml
          rm -f .github/workflows/apply-datacore-audit-security-fix.yml

      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_datacore_saed_candidate_audit.py

      - name: Commit and push cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_datacore_saed_candidate.py \
            tests/test_datacore_saed_candidate_audit.py \
            .github/workflows/datacore-saed-source-audit.yml
          git add -A .github/workflows
          git commit -m "Redact DataCORE response diagnostics"
          git push origin HEAD:agent/audit-datacore-saed-source
