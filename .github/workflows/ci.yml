name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        id: tests
        shell: bash
        run: |
          mkdir -p outputs/ci
          set +e
          pytest -q > outputs/ci/pytest.log 2>&1
          code=$?
          set -e
          cat outputs/ci/pytest.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: outputs/ci/pytest.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce test success
        if: always()
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          echo "test_exit=$TEST_EXIT"
          test "$TEST_EXIT" = "0"
