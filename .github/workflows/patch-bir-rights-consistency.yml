name: Patch BIR rights consistency

on:
  push:
    branches:
      - agent/audit-bir-200kev-metadata
    paths:
      - ".github/workflows/patch-bir-rights-consistency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-bir-200kev-metadata

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Patch evidence consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/mca/saed_bir_metadata_audit.py")
          text = source_path.read_text(encoding="utf-8")

          replacements = {
              'RESULT = "metadata_resolved_but_source_not_ready_for_saed_evaluation"':
                  'RESULT = "record_inventory_verified_but_source_not_ready_for_saed_evaluation"',
              '        request_items = _author_request_items(config)\n        subset_plan = {':
                  '        request_items = _author_request_items(\n            config, rights_verified=bool(rights)\n        )\n        unresolved_download_gates = [\n            "member count",\n            "sample/acquisition lineage",\n            "centre",\n            "calibration",\n            "analyzer-development non-use",\n        ]\n        if not rights:\n            unresolved_download_gates.insert(-1, "reuse terms")\n        unresolved_download_text = ", ".join(unresolved_download_gates)\n        subset_plan = {',
              '                "until member count, sample/acquisition lineage, centre, calibration, "\n                "reuse terms, and analyzer-development non-use are resolved"':
                  '                f"until {unresolved_download_text} are resolved"',
              '                "primary_limitation": (\n                    "The released MRC series are integrated and binned acquisition-derived "\n                    "frames, while archive members, immutable lineage, centre, reciprocal "\n                    "calibration, reuse terms, and analyzer-development non-use remain unresolved."\n                ),\n                "evidence_that_would_change_conclusion": (\n                    "Authoritative series-to-crystal lineage, archive member inventory, "\n                    "direct-beam/centre procedure, reciprocal calibration, explicit data "\n                    "reuse terms, and analyzer-development non-use, followed by a checksum-bound "\n                    "bounded archive audit."\n                ),':
                  '                "primary_limitation": (\n                    "The released MRC series are integrated and binned acquisition-derived "\n                    "frames, while archive members, immutable lineage, centre, reciprocal "\n                    f"calibration, {\'reuse terms, \' if not rights else \'\'}and "\n                    "analyzer-development non-use remain unresolved."\n                ),\n                "evidence_that_would_change_conclusion": (\n                    "Authoritative series-to-crystal lineage, archive member inventory, "\n                    "direct-beam/centre procedure, reciprocal calibration, "\n                    f"{\'explicit data reuse terms, \' if not rights else \'\'}and "\n                    "analyzer-development non-use, followed by a checksum-bound bounded "\n                    "archive audit."\n                ),',
              'def _author_request_items(config: AuditConfig) -> list[str]:\n    return [':
                  'def _author_request_items(\n    config: AuditConfig, *, rights_verified: bool\n) -> list[str]:\n    items = [',
              '        "State whether the proposed series or their derived outputs were used to develop, tune, or select the current analyzer.",\n        "Provide explicit data reuse terms for the Zenodo record files.",\n        f"Confirm that at least {config.minimum_independent_series} proposed series represent independent acquisitions rather than exports or repeated processing of one acquisition.",\n    ]':
                  '        "State whether the proposed series or their derived outputs were used to develop, tune, or select the current analyzer.",\n    ]\n    if not rights_verified:\n        items.append("Provide explicit data reuse terms for the Zenodo record files.")\n    items.append(\n        f"Confirm that at least {config.minimum_independent_series} proposed series represent independent acquisitions rather than exports or repeated processing of one acquisition."\n    )\n    return items',
              '            "- Reason: smallest checksum-bound archive, but member inventory, lineage, centre, calibration, reuse, and non-use remain unresolved.",':
                  '            (\n                "- Reason: smallest checksum-bound archive, but member inventory, "\n                "lineage, centre, calibration, "\n                f"{\'reuse, \' if not source[\'rights\'] else \'\'}and non-use remain unresolved."\n            ),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"source replacement target not found: {old[:100]!r}")
              text = text.replace(old, new, 1)
          source_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_saed_bir_metadata_audit.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''    assert summary["evidence_gates"]["explicit_reuse_terms_verified"]\n    assert not summary["evidence_gates"]["ready_for_bounded_archive_download"]\n    assert "pattern_center_not_traceable" in summary["blockers"]\n    assert "reciprocal_calibration_not_traceable" in summary["blockers"]\n'''
          new = '''    assert summary["evidence_gates"]["explicit_reuse_terms_verified"]\n    assert not summary["evidence_gates"]["ready_for_bounded_archive_download"]\n    assert "pattern_center_not_traceable" in summary["blockers"]\n    assert "reciprocal_calibration_not_traceable" in summary["blockers"]\n    assert "reuse terms" not in summary["scientific_closeout"]["primary_limitation"]\n    request = (tmp_path / "out" / "bir_author_metadata_request.md").read_text(\n        encoding="utf-8"\n    )\n    assert "Provide explicit data reuse terms" not in request\n    plan = json.loads(\n        (tmp_path / "out" / "bir_bounded_subset_plan.json").read_text(\n            encoding="utf-8"\n        )\n    )\n    assert "reuse terms" not in plan["selection_basis"]\n'''
          if old not in text:
              raise SystemExit("rights test replacement target not found")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/saed-bir-200kev-metadata-audit.yml")
          text = workflow_path.read_text(encoding="utf-8")
          old = "metadata_resolved_but_source_not_ready_for_saed_evaluation"
          new = "record_inventory_verified_but_source_not_ready_for_saed_evaluation"
          if old not in text:
              raise SystemExit("workflow result replacement target not found")
          workflow_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme_path = Path("case_studies/saed_bir_200kev_metadata_audit/README.md")
          text = readme_path.read_text(encoding="utf-8")
          text = text.replace(
              "- explicit reuse terms for the record files;\n",
              "",
          )
          text = text.replace(
              "The candidate remains **not ready** for bounded archive download or SAED validation intake.\n",
              "The candidate remains **not ready** for bounded archive download or SAED validation intake. The live record explicitly declares `CC BY 4.0`, so reuse authorization is supported and is no longer a blocker.\n",
          )
          readme_path.write_text(text, encoding="utf-8")
          PY

      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_saed_bir_metadata_audit.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_bir_metadata_audit.py \
            tests/test_saed_bir_metadata_audit.py \
            .github/workflows/saed-bir-200kev-metadata-audit.yml \
            case_studies/saed_bir_200kev_metadata_audit/README.md
          git commit -m "Align BIR reuse evidence with live Zenodo metadata"
          git push origin HEAD:agent/audit-bir-200kev-metadata
