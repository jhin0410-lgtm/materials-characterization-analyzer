name: Apply Zenodo 8132804 registry integration

on:
  pull_request:
    paths:
      - "scripts/patch_zenodo_8132804_registry.py"
      - ".github/workflows/apply-zenodo-8132804-registry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-zenodo-8132804-co3o4-mn3o4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply strict registry patch
        run: python scripts/patch_zenodo_8132804_registry.py

      - name: Validate registry integration
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_zenodo_8132804_co3o4_mn3o4_audit.py \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_tem_candidate_registry_readiness_integration.py \
            tests/test_co3o4_public_tem_candidate_audit.py
          rm -rf outputs/tem_external_validation_candidate_registry
          mca tem-candidates \
            --config case_studies/tem_external_validation_candidate_registry/case_config.json \
            --output outputs/tem_external_validation_candidate_registry
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          output = Path("outputs/tem_external_validation_candidate_registry")
          summary = json.loads(
              (output / "tem_external_validation_candidate_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          counts = summary["result_counts"]
          assert counts["candidate_count"] == 11
          assert counts["in_domain_external_validation_ready_count"] == 0
          assert counts["processed_in_domain_diagnostic_count"] == 1
          assert counts["rendered_representation_exclusion_count"] == 2
          assert counts["excluded_control_count"] == 6
          assert summary["readiness"]["recommended_candidate_id"] == (
              "zenodo_17336678_phaset3m_co3o4_processed_tilt_series"
          )
          with (output / "tem_external_validation_candidate_inventory.csv").open(
              encoding="utf-8", newline=""
          ) as handle:
              rows = {row["candidate_id"]: row for row in csv.DictReader(handle)}
          candidate = rows["zenodo_8132804_co3o4_mn3o4_stem_tomography"]
          assert candidate["candidate_status"] == "excluded_wrong_microscopy_modality"
          assert candidate["evaluation_ready"] == "False"
          PY

      - name: Commit permanent registry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py \
            scripts/audit_co3o4_public_tem_candidates.py
          git diff --cached --check
          git commit -m "Register bounded Co3O4-Mn3O4 STEM source"
          git push origin HEAD:agent/audit-zenodo-8132804-co3o4-mn3o4
