name: Bootstrap formal TEM training-data audit

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-cobalt-oxide-tem-training-data-audit.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/training-audit.tgz.b64 <<'PAYLOAD'
[... truncated for length in tool payload ...]H4sIAAAAAAAAAwMAAAAAAAAAAAA=
PAYLOAD
          base64 -d /tmp/training-audit.tgz.b64 > /tmp/training-audit.tgz
          tar -xzf /tmp/training-audit.tgz -C .

      - name: Commit implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_training_data_audit.py \
            scripts/audit_public_cobalt_oxide_tem_training_data.py \
            tests/test_public_cobalt_oxide_tem_training_data_audit.py \
            case_studies/public_cobalt_oxide_tem_training_data_audit/case_config.json \
            case_studies/public_cobalt_oxide_tem_training_data_audit/README.md
          git commit -m "Add formal TEM training-data readiness audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
