name: Finalize TEM training-data audit files

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-cobalt-oxide-tem-training-data-audit.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align current package version and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/public-cobalt-oxide-tem-training-data-audit.yml')
          text = path.read_text(encoding='utf-8')
          if '0.9.2' not in text:
              raise SystemExit('expected 0.9.2 assertions not found')
          path.write_text(text.replace('0.9.2', '0.9.1'), encoding='utf-8')
          PY
          rm .github/workflows/temporary-cobalt-oxide-tem-training-data-audit.yml
          rm -f .github/workflows/temporary-tem-training-audit-release-sync.yml

      - name: Commit final audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize TEM training-data readiness audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
