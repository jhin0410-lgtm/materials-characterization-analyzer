name: Bootstrap formal TEM training-data audit

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-cobalt-oxide-tem-training-data-audit.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/training-audit/chunk-*.txt | base64 -d > /tmp/training-audit.tgz
          echo "d83c9581dbd9a55768516fd2e521ead5629e9cc58480e4178dcec222066359c8  /tmp/training-audit.tgz" | sha256sum --check
          tar -xzf /tmp/training-audit.tgz -C .
          rm -rf .bootstrap/training-audit
          rm .github/workflows/temporary-cobalt-oxide-tem-training-data-audit.yml

      - name: Commit implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add formal TEM training-data readiness audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
