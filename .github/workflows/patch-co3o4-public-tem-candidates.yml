name: Apply Co3O4 public TEM registry patch

on:
  pull_request:
    paths:
      - "scripts/patch_co3o4_public_tem_candidates.py"
      - ".github/workflows/patch-co3o4-public-tem-candidates.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-co3o4-ald-tem-candidate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply permanent registry changes
        run: python scripts/patch_co3o4_public_tem_candidates.py
      - name: Install and validate focused registry
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_tem_external_validation_candidate_registry.py
          rm -rf outputs/tem-registry-patch-check
          mca tem-candidates \
            --config case_studies/tem_external_validation_candidate_registry/case_config.json \
            --output outputs/tem-registry-patch-check
      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
          else
            git commit -m "Add excluded Co3O4 public TEM candidates"
            git push origin HEAD:agent/audit-co3o4-ald-tem-candidate
          fi
