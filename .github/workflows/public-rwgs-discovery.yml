name: Public RWGS XRD SEM EDS discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/public_rwgs_xrd_sem_eds/**"
      - "scripts/discover_public_rwgs_xrd_sem_eds.py"
      - "tests/test_public_rwgs_discovery.py"
      - ".github/workflows/public-rwgs-discovery.yml"
  push:
    branches:
      - main
    paths:
      - "case_studies/public_rwgs_xrd_sem_eds/**"
      - "scripts/discover_public_rwgs_xrd_sem_eds.py"
      - "tests/test_public_rwgs_discovery.py"
      - ".github/workflows/public-rwgs-discovery.yml"

permissions:
  contents: read

concurrency:
  group: public-rwgs-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download and inventory public source archives
        shell: bash
        run: |
          mkdir -p outputs/public-rwgs-discovery/diagnostics
          set -o pipefail
          python scripts/discover_public_rwgs_xrd_sem_eds.py \
            --config case_studies/public_rwgs_xrd_sem_eds/discovery_config.json \
            --output outputs/public-rwgs-discovery/result \
            2>&1 | tee outputs/public-rwgs-discovery/diagnostics/discovery.log

      - name: Run discovery tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_public_rwgs_discovery.py \
            2>&1 | tee outputs/public-rwgs-discovery/diagnostics/pytest.log

      - name: Show discovery evidence
        if: always()
        run: |
          if [ -f outputs/public-rwgs-discovery/result/discovery_report.md ]; then
            cat outputs/public-rwgs-discovery/result/discovery_report.md
          fi
          if [ -f outputs/public-rwgs-discovery/result/archive_inventories.json ]; then
            cat outputs/public-rwgs-discovery/result/archive_inventories.json
          fi
          if [ -f outputs/public-rwgs-discovery/result/synthesis_protocol.txt ]; then
            cat outputs/public-rwgs-discovery/result/synthesis_protocol.txt
          fi

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-rwgs-discovery
          path: outputs/public-rwgs-discovery
          if-no-files-found: error
          retention-days: 14
