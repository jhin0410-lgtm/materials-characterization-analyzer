name: Apply snapshot-aware Co3O4 source audit

on:
  pull_request:
    paths:
      - "scripts/patch_co3o4_snapshot_aware_audit.py"
      - ".github/workflows/patch-co3o4-snapshot-aware-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-co3o4-ald-tem-candidate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply permanent snapshot-aware changes
        run: python scripts/patch_co3o4_snapshot_aware_audit.py
      - name: Validate syntax and focused registry
        run: |
          python -m py_compile scripts/audit_co3o4_public_tem_candidates.py
          python -m pip install -e ".[dev]"
          pytest -q tests/test_tem_external_validation_candidate_registry.py
      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_co3o4_public_tem_candidates.py \
            case_studies/co3o4_public_tem_candidate_audit/case_config.json \
            case_studies/co3o4_public_tem_candidate_audit/README.md \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
          else
            git commit -m "Make Co3O4 source audit snapshot-aware"
            git push origin HEAD:agent/audit-co3o4-ald-tem-candidate
          fi
