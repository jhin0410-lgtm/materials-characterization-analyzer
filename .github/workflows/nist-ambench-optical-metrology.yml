name: NIST AM-Bench optical metrology bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/nist_ambench_2018_02/**"
      - "scripts/export_nist_ambench_2018_02_optical_metrology_bundle.py"
      - "src/mca/handoff_bundle.py"
      - "tests/test_nist_ambench_optical_metrology_bundle.py"
      - ".github/workflows/nist-ambench-optical-metrology.yml"
  push:
    branches:
      - main
    paths:
      - "case_studies/nist_ambench_2018_02/**"
      - "scripts/export_nist_ambench_2018_02_optical_metrology_bundle.py"
      - "src/mca/handoff_bundle.py"
      - "tests/test_nist_ambench_optical_metrology_bundle.py"
      - ".github/workflows/nist-ambench-optical-metrology.yml"

permissions:
  contents: read

concurrency:
  group: nist-ambench-optical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nist-ambench-optical-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Export NIST AM-Bench optical-metrology bundle
        shell: bash
        run: |
          mkdir -p outputs/nist-ambench-optical-diagnostics
          set -o pipefail
          python scripts/export_nist_ambench_2018_02_optical_metrology_bundle.py \
            --config case_studies/nist_ambench_2018_02/case_config.json \
            --output outputs/nist-ambench-2018-02-optical-metrology \
            2>&1 | tee outputs/nist-ambench-optical-diagnostics/export.log

      - name: Run focused tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_nist_ambench_optical_metrology_bundle.py \
            2>&1 | tee outputs/nist-ambench-optical-diagnostics/pytest.log

      - name: Verify exported evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          root = Path("outputs/nist-ambench-2018-02-optical-metrology")
          manifest = json.loads(
              (root / "characterization_handoff_bundle.json").read_text(encoding="utf-8")
          )
          summary = json.loads((root / "case_summary.json").read_text(encoding="utf-8"))
          features = pd.read_csv(root / "characterization_features_long.csv")
          context = pd.read_csv(root / "sample_context.csv")

          assert manifest["case_id"] == "nist-ambench-2018-02-optical-metrology-v1"
          assert manifest["feature_table"]["row_count"] == 40
          assert manifest["feature_table"]["sample_count"] == 10
          assert manifest["feature_table"]["measurement_count"] == 10
          assert manifest["feature_table"]["source_sha256_record_count"] == 40
          assert manifest["feature_table"]["preprocessing_id_record_count"] == 40
          assert manifest["feature_table"]["quality_flag_counts"] == {
              "source_reported": 40
          }
          assert manifest["scientific_closeout"]["evidence_level"] == "Diagnostic"
          assert manifest["scientific_closeout"]["result"] == (
              "nist_ambench_trace_optical_metrology_exported"
          )

          assert len(features) == 40
          assert features["sample_id"].nunique() == 10
          assert features["measurement_id"].nunique() == 10
          assert set(features["instrument"]) == {
              "optical_microscopy_metrology"
          }
          assert len(context) == 10
          assert set(context["material"]) == {"IN625"}
          assert set(context["system"]) == {"AMMT"}
          assert context["trace_to_cross_section_mapping_confirmed"].astype(bool).all()
          assert not context["raw_image_parsed"].astype(bool).any()
          assert not context["process_conditions_included_in_bundle"].astype(bool).any()

          assert summary["status"] == "completed"
          assert summary["sample_count"] == 10
          assert summary["feature_record_count"] == 40
          assert summary["raw_image_parsed"] is False
          assert summary["process_conditions_included"] is False
          assert summary["software_validation"]["model_trained"] is False
          assert summary["software_validation"]["optimization_performed"] is False
          print((root / "case_report.md").read_text(encoding="utf-8"))
          PY

      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-ambench-optical-metrology-evidence
          path: |
            outputs/nist-ambench-2018-02-optical-metrology
            outputs/nist-ambench-optical-diagnostics
          if-no-files-found: error
          retention-days: 14
