name: Public cobalt oxide TEM source-image mask pairing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-source-image-mask-pairing.yml"
      - "case_studies/public_cobalt_oxide_tem_source_image_mask_pairing/**"
      - "scripts/audit_public_cobalt_oxide_tem_source_image_mask_pairing.py"
      - "src/mca/tem_source_image_mask_pairing.py"
      - "tests/test_public_cobalt_oxide_tem_source_image_mask_pairing.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-source-image-mask-pairing.yml"
      - "case_studies/public_cobalt_oxide_tem_source_image_mask_pairing/**"
      - "scripts/audit_public_cobalt_oxide_tem_source_image_mask_pairing.py"
      - "src/mca/tem_source_image_mask_pairing.py"
      - "tests/test_public_cobalt_oxide_tem_source_image_mask_pairing.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: public-cobalt-oxide-tem-source-image-mask-pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download exact public source-image and mask archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/TEM_images.zip \
            "https://zenodo.org/records/14927582/files/TEM_images.zip?download=1"
          echo "d1e991346d07b8a112c4b6dbfd8367ba  /tmp/TEM_images.zip" | md5sum --check
          echo "a9e4618f697205bf8560ab14bc5e313d4011b51aaa6dbf8a5c62ddc22bc558d8  /tmp/TEM_images.zip" | sha256sum --check

          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/Segmented_images.zip \
            "https://zenodo.org/records/14927582/files/Segmented_images.zip?download=1"
          echo "63edc9b44264f8a1397bff806d58eade  /tmp/Segmented_images.zip" | md5sum --check
          echo "bd7816f3cf2869e4a349fc04d3e0d0464b3e14e9c8c8655f51e6e487fb59824b  /tmp/Segmented_images.zip" | sha256sum --check

      - name: Audit all ten source-image mask pairs and fifty frames
        run: |
          set -euo pipefail
          python scripts/audit_public_cobalt_oxide_tem_source_image_mask_pairing.py \
            --config case_studies/public_cobalt_oxide_tem_source_image_mask_pairing/case_config.json \
            --image-archive /tmp/TEM_images.zip \
            --mask-archive /tmp/Segmented_images.zip \
            --output outputs/public-cobalt-oxide-tem-source-image-mask-pairing \
            | tee outputs/public-cobalt-oxide-tem-source-image-mask-pairing-console.json

      - name: Verify real-data and scientific contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import pandas as pd

          output = Path("outputs/public-cobalt-oxide-tem-source-image-mask-pairing")
          summary = json.loads(
              (output / "source_image_mask_pairing_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["software_version"] == "0.9.1"
          assert summary["source"]["doi"] == "10.5281/zenodo.14927582"
          assert summary["source"]["license"] == "CC-BY-4.0"
          assert summary["source"]["image_archive"]["sha256"] == (
              "a9e4618f697205bf8560ab14bc5e313d4011b51aaa6dbf8a5c62ddc22bc558d8"
          )
          assert summary["source"]["mask_archive"]["sha256"] == (
              "bd7816f3cf2869e4a349fc04d3e0d0464b3e14e9c8c8655f51e6e487fb59824b"
          )
          assert summary["hdf5_contract"] == {
              "attributes_present": False,
              "image_dataset_name": "images",
              "image_dtype": "float64",
              "image_mean_abs_tolerance": 1e-10,
              "image_std_abs_tolerance": 1e-12,
              "mask_dataset_name": "labels",
              "mask_dtype": "float64",
              "shape_per_file": [5, 4096, 4096],
          }
          assert summary["result_counts"] == {
              "file_pair_count": 10,
              "frame_pair_count": 50,
          }
          assert summary["pairing"]["status"] == (
              "source_asserted_structurally_consistent_not_independently_verified"
          )
          assert summary["pairing"]["equal_array_shapes"]
          assert summary["pairing"]["equal_frame_counts"]
          assert not summary["pairing"]["independent_pairing_verification"]
          representation = summary["source_image_representation"]
          assert representation["classification"] == (
              "source_standardized_float64_image_array"
          )
          assert representation["maximum_abs_frame_mean"] <= 1e-10
          assert representation["maximum_abs_frame_std_deviation_from_one"] <= 1e-12
          assert not representation[
              "original_detector_intensity_available_in_selected_archive"
          ]
          assert not summary["literature_context"]["used_for_physical_conversion"]
          assert summary["scientific_closeout"]["status"] == "Diagnostic"
          assert all(value is False for value in summary["processing"].values())

          files = pd.read_csv(output / "tem_source_image_mask_file_pairs.csv")
          frames = pd.read_csv(output / "tem_source_image_mask_frame_pairs.csv")
          assert len(files) == 10
          assert len(frames) == 50
          assert files["pair_id"].nunique() == 10
          assert files["same_shape"].all()
          assert files["same_frame_count"].all()
          assert files["all_frames_numerically_standardized"].all()
          assert not files["independent_pairing_verification"].any()
          assert frames.groupby("pair_id")["frame_index"].nunique().eq(5).all()
          assert frames["image_frame_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert frames["mask_frame_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert frames["image_mean"].abs().max() <= 1e-10
          assert (frames["image_std"] - 1.0).abs().max() <= 1e-12
          assert not frames["pixel_calibration_applied"].any()

          manifest = json.loads(
              (output / "source_image_mask_pairing_artifact_manifest.json").read_text()
          )
          assert manifest["artifact_count"] == 4
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]

          forbidden_suffixes = {".pkl", ".pickle", ".joblib", ".pt", ".pth", ".onnx"}
          assert not [
              path for path in output.rglob("*")
              if path.suffix.lower() in forbidden_suffixes
          ]
          print(json.dumps(summary["result_counts"], indent=2, sort_keys=True))
          print(json.dumps(representation, indent=2, sort_keys=True))
          PY

      - name: Run focused software tests
        run: pytest -q tests/test_public_cobalt_oxide_tem_source_image_mask_pairing.py

      - name: Verify package version and build
        run: |
          set -euo pipefail
          mca --version | tee mca-version.txt
          grep -F "0.9.1" mca-version.txt
          python -m build
          python - <<'PY'
          from pathlib import Path
          files = sorted(path.name for path in Path("dist").iterdir())
          assert "materials_characterization_analyzer-0.9.1-py3-none-any.whl" in files
          assert "materials_characterization_analyzer-0.9.1.tar.gz" in files
          print(files)
          PY

      - name: Upload real-data evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-cobalt-oxide-tem-source-image-mask-pairing-evidence
          path: |
            outputs/public-cobalt-oxide-tem-source-image-mask-pairing/
            outputs/public-cobalt-oxide-tem-source-image-mask-pairing-console.json
            mca-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: materials-characterization-analyzer-0.9.1-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
