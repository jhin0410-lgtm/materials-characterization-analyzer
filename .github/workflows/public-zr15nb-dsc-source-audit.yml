name: Public Zr15Nb DSC source audit

on:
  pull_request:
    paths:
      - "case_studies/public_zr15nb_dsc/**"
      - "scripts/audit_public_zr15nb_dsc_source.py"
      - "tests/test_public_zr15nb_dsc_source_audit.py"
      - ".github/workflows/public-zr15nb-dsc-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused regression tests
        run: python -m pytest tests/test_public_zr15nb_dsc_source_audit.py -q

      - name: Audit checksum-bound real DSC source
        run: |
          python scripts/audit_public_zr15nb_dsc_source.py \
            --config case_studies/public_zr15nb_dsc/case_config.json \
            --output outputs/public-zr15nb-dsc/source-audit

      - name: Verify source-structure evidence and artifact hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/public-zr15nb-dsc/source-audit")
          summary = json.loads((output / "source_audit_summary.json").read_text())
          manifest = json.loads((output / "source_audit_manifest.json").read_text())
          assert summary["case_id"] == "public_zr15nb_dsc_source_audit"
          assert summary["source"]["record_id"] == 17590045
          assert summary["source"]["doi"] == "10.5281/zenodo.17590045"
          assert summary["readiness"]["source_checksums_verified"]
          assert not summary["readiness"]["raw_source_files_persisted"]
          assert not summary["readiness"]["thermal_analyzer_executed"]
          assert summary["table_structure"]["data_row_count"] > 0
          assert summary["table_structure"]["column_count"] > 1
          assert manifest["artifact_count"] == 3
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]
          print(json.dumps({
              "status": summary["readiness"]["status"],
              "encoding": summary["table_structure"]["encoding"],
              "delimiter": summary["table_structure"]["delimiter"],
              "row_count": summary["table_structure"]["data_row_count"],
              "column_count": summary["table_structure"]["column_count"],
              "headers": summary["table_structure"]["header_rows"],
              "temperature_candidates": summary["table_structure"]["temperature_candidate_columns"],
              "dsc_candidates": summary["table_structure"]["dsc_candidate_columns"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload source audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-zr15nb-dsc-source-audit-evidence
          path: outputs/public-zr15nb-dsc/source-audit
          if-no-files-found: error
          retention-days: 30
