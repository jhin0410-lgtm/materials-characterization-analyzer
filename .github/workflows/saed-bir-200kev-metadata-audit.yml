name: BIR-MicroED 200 keV metadata audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mca/saed_bir_metadata_audit.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_bir_metadata_audit.py"
      - "case_studies/saed_bir_200kev_metadata_audit/**"
      - ".github/workflows/saed-bir-200kev-metadata-audit.yml"
  push:
    branches:
      - main
    paths:
      - "src/mca/saed_bir_metadata_audit.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_bir_metadata_audit.py"
      - "case_studies/saed_bir_200kev_metadata_audit/**"
      - ".github/workflows/saed-bir-200kev-metadata-audit.yml"

permissions:
  contents: read

concurrency:
  group: saed-bir-200kev-metadata-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused regressions
        run: pytest -q tests/test_saed_bir_metadata_audit.py

      - name: Fetch official Zenodo record metadata
        run: |
          mkdir -p outputs/bir-source
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            "https://zenodo.org/api/records/10999587" \
            --output outputs/bir-source/record.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/bir-source/record.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert str(payload["id"]) == "10999587"
          assert isinstance(payload.get("files"), (dict, list))
          PY

      - name: Run installed metadata audit command
        run: |
          mca saed-bir-metadata-audit \
            --config case_studies/saed_bir_200kev_metadata_audit/case_config.json \
            --record-json outputs/bir-source/record.json \
            --output outputs/saed_bir_200kev_metadata_audit

      - name: Verify fail-closed evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/saed_bir_200kev_metadata_audit")
          summary = json.loads(
              (output / "bir_metadata_audit_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["result"] == (
              "metadata_resolved_but_source_not_ready_for_saed_evaluation"
          )
          assert summary["source"]["archive_count"] == 4
          assert summary["source"]["total_archive_bytes"] > 30_000_000_000
          gates = summary["evidence_gates"]
          assert gates["record_identity_verified"]
          assert gates["archive_level_md5_values_verified"]
          assert gates["static_selected_area_acquisition_supported_by_publication"]
          assert not gates["native_detector_frames_released"]
          assert not gates[
              "released_representation_is_demonstrably_lossless_to_native_frames"
          ]
          assert not gates["ready_for_bounded_archive_download"]
          assert not gates["ready_for_saed_validation_intake"]
          assert not gates["ready_for_predeclared_external_evaluation"]

          plan = json.loads(
              (output / "bir_bounded_subset_plan.json").read_text(
                  encoding="utf-8"
              )
          )
          assert plan["selected_archive"] == "AVAAGA_200kV_293K.zip"
          assert not plan["download_authorized_now"]
          assert plan["full_record_download_prohibited"]

          manifest = json.loads(
              (output / "bir_metadata_audit_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["artifact_count"] == 6
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert record["bytes"] == path.stat().st_size
              assert record["sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()

          forbidden = [
              path
              for path in output.rglob("*")
              if path.suffix.lower()
              in {".zip", ".mrc", ".tvips", ".tif", ".tiff", ".dm3", ".dm4"}
          ]
          assert not forbidden
          PY

      - name: Delete fetched source metadata
        run: rm -rf outputs/bir-source

      - name: Upload metadata-only evidence
        uses: actions/upload-artifact@v7
        with:
          name: saed-bir-200kev-metadata-audit-evidence
          path: outputs/saed_bir_200kev_metadata_audit
          if-no-files-found: error
          retention-days: 30
