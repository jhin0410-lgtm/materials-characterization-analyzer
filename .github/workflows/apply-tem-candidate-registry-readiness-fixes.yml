name: Apply TEM candidate-registry readiness fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-tem-candidate-registry-readiness-fixes.yml"
      - "scripts/apply_tem_candidate_registry_readiness_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Align documentation patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_tem_candidate_registry_readiness_fixes.py")
          text = path.read_text(encoding="utf-8")
          start = text.rindex("replace_exact(\n    readme,")
          end = text.index("\n)\n\nprint", start) + 3
          old = (
              "This is a time-bounded and non-exhaustive search snapshot. "
              "Repository or author separation alone does not prove "
              "sample/acquisition independence.\n"
          )
          new = old + (
              "\nReadiness requires an exact resolved file inventory, checksum coverage, "
              "exact TEM/HRTEM modality tokens, at least two independently blinded "
              "labelers, an adjudicated consensus, immutable sample/acquisition IDs, "
              "verified model-development non-use, a verified licence, and no target-source "
              "or creator overlap. The evaluator supports only the pinned cobalt-oxide "
              "binary TEM/HRTEM segmentation contract and rejects other declared targets.\n"
          )
          replacement = (
              "replace_exact(\n"
              "    readme,\n"
              f"    {old!r},\n"
              f"    {new!r},\n"
              ")"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Apply deterministic patch
        run: python scripts/apply_tem_candidate_registry_readiness_fixes.py

      - name: Align pinned modality classification counts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tem_external_validation_candidate_registry.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '"cross_phase_candidate_count": 2,',
              '"cross_phase_candidate_count": 1,',
              1,
          )
          text = text.replace(
              '"excluded_control_count": 2,',
              '"excluded_control_count": 3,',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_tem_external_validation_candidate_registry.py
          tests/test_tem_candidate_registry_readiness_integration.py
          tests/test_tem_segmentation_readiness.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_external_validation_candidate_registry_engine.py \
            src/mca/tem_candidate_registry_readiness.py \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_tem_candidate_registry_readiness_integration.py
          git commit -m "Fix TEM candidate registry readiness gates [registry-gates-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
