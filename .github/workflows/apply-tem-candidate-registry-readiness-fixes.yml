name: Apply TEM candidate-registry readiness fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-tem-candidate-registry-readiness-fixes.yml"
      - "scripts/apply_tem_candidate_registry_readiness_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: python scripts/apply_tem_candidate_registry_readiness_fixes.py

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_tem_external_validation_candidate_registry.py
          tests/test_tem_candidate_registry_readiness_integration.py
          tests/test_tem_segmentation_readiness.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_external_validation_candidate_registry_engine.py \
            src/mca/tem_candidate_registry_readiness.py \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_tem_candidate_registry_readiness_integration.py
          git commit -m "Fix TEM candidate registry readiness gates [registry-gates-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
