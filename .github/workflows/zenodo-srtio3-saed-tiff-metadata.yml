name: Zenodo SrTiO3 SAED TIFF metadata audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "case_studies/zenodo_srtio3_saed_tiff_metadata/**"
      - "case_studies/zenodo_srtio3_saed_metadata_audit/verified_metadata_snapshot.json"
      - "case_studies/zenodo_srtio3_saed_remote_inventory/**"
      - "scripts/audit_zenodo_srtio3_saed_tiff_metadata.py"
      - "scripts/audit_zenodo_srtio3_saed_remote_inventory.py"
      - "tests/test_audit_zenodo_srtio3_saed_tiff_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-tiff-metadata.yml"
  push:
    branches: [main]
    paths:
      - "case_studies/zenodo_srtio3_saed_tiff_metadata/**"
      - "case_studies/zenodo_srtio3_saed_metadata_audit/verified_metadata_snapshot.json"
      - "case_studies/zenodo_srtio3_saed_remote_inventory/**"
      - "scripts/audit_zenodo_srtio3_saed_tiff_metadata.py"
      - "scripts/audit_zenodo_srtio3_saed_remote_inventory.py"
      - "tests/test_audit_zenodo_srtio3_saed_tiff_metadata.py"
      - ".github/workflows/zenodo-srtio3-saed-tiff-metadata.yml"

permissions:
  contents: read

concurrency:
  group: zenodo-srtio3-saed-tiff-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused regressions
        run: pytest -q tests/test_audit_zenodo_srtio3_saed_tiff_metadata.py
      - name: Run live bounded TIFF metadata audit
        run: |
          python scripts/audit_zenodo_srtio3_saed_tiff_metadata.py \
            --config case_studies/zenodo_srtio3_saed_tiff_metadata/case_config.json \
            --output outputs/zenodo_srtio3_saed_tiff_metadata/tiff_metadata_snapshot.json
      - name: Verify pixel-free evidence and source stability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/zenodo_srtio3_saed_tiff_metadata")
          live = json.loads((root / "tiff_metadata_snapshot.json").read_text())
          pinned = json.loads(
              Path(
                  "case_studies/zenodo_srtio3_saed_tiff_metadata/verified_tiff_metadata_snapshot.json"
              ).read_text()
          )
          assert live["execution_status"] == "bounded_tiff_ifd_metadata_audit_completed"
          assert live["config_sha256"] == pinned["config_sha256"]
          assert live["source"]["remote_inventory_snapshot_sha256"] == pinned["source"]["remote_inventory_snapshot_sha256"]
          assert live["target_archive"]["key"] == pinned["target_archive"]["key"]
          assert live["target_archive"]["bytes"] == pinned["target_archive"]["bytes"]
          assert live["target_archive"]["repository_md5"] == pinned["target_archive"]["repository_md5"]
          assert live["range_evidence"] == pinned["range_evidence"]
          assert len(live["members"]) == 3
          assert [member["path"] for member in live["members"]] == [
              item["path"] for item in pinned["members"]
          ]
          common = pinned["common_tiff_structure"]
          for member, expected_member in zip(live["members"], pinned["members"], strict=True):
              assert member["compressed_bytes"] == expected_member["compressed_bytes"]
              assert member["uncompressed_bytes"] == expected_member["uncompressed_bytes"]
              assert member["local_zip_header"]["compressed_prefix_sha256"] == expected_member["compressed_prefix_sha256"]
              assert member["metadata_prefix_sha256"] == common["metadata_prefix_sha256"]
              assert member["full_member_downloaded"] is False
              tiff = member["tiff"]
              assert tiff["byte_order"] == common["byte_order"]
              assert tiff["magic"] == common["magic"]
              assert tiff["first_ifd_offset"] == common["first_ifd_offset"]
              assert tiff["first_ifd_entry_count"] == common["first_ifd_entry_count"]
              assert tiff["first_ifd_metadata_bytes"] == common["first_ifd_metadata_bytes"]
              assert tiff["page_count_evidence"]["page_count_if_supported"] == common["page_count"]
              assert tiff["out_of_line_values_followed"] is False
              for tag in (
                  "ImageWidth",
                  "ImageLength",
                  "BitsPerSample",
                  "Compression",
                  "PhotometricInterpretation",
                  "SamplesPerPixel",
                  "RowsPerStrip",
                  "StripOffsets",
                  "StripByteCounts",
                  "SampleFormat",
              ):
                  assert tiff["recorded_tags"][tag]["value"] == common[tag]
              assert tiff["recorded_tags"]["ImageDescription"]["value_offset_if_out_of_line"] == common["ImageDescription"]["value_offset"]
              assert tiff["recorded_tags"]["ImageDescription"]["out_of_line_value_followed"] is False
              assert tiff["recorded_tags"]["Software"]["value_offset_if_out_of_line"] == common["Software"]["value_offset"]
              assert tiff["recorded_tags"]["Software"]["out_of_line_value_followed"] is False
              assert member["decompression_evidence"]["pixel_array_decoded"] is False
          assert live["target_archive"]["full_archive_downloaded"] is False
          assert live["range_evidence"]["raw_tiff_bytes_retained"] == 0
          assert live["range_evidence"]["pixel_array_decoded"] is False
          assert live["range_evidence"]["four_d_stem_bytes_read"] is False
          assert live["range_evidence"]["total_remote_bytes_read"] == 918508
          assert live["readiness"]["pixel_access_authorized"] is False
          assert live["readiness"]["four_d_stem_download_authorized"] is False
          assert live["readiness"]["analyzer_execution_authorized"] is False
          assert live["readiness"]["phase_indexing_authorized"] is False
          assert live["readiness"]["external_validation_ready"] is False
          forbidden = {".zip", ".npy", ".tif", ".tiff", ".png", ".jpg", ".jpeg", ".dm3", ".dm4", ".ser"}
          leaked = [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.casefold() in forbidden
          ]
          if leaked:
              raise SystemExit(f"source/pixel payload leaked into TIFF metadata evidence: {leaked}")
          PY
      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-srtio3-saed-tiff-metadata-evidence
          path: outputs/zenodo_srtio3_saed_tiff_metadata
          if-no-files-found: warn
          retention-days: 30
