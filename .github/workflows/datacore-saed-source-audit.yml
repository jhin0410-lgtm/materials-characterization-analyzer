name: Apply final DataCORE audit cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/datacore-saed-source-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-datacore-saed-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply redaction, regression, and workflow cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          audit_path = Path("scripts/audit_datacore_saed_candidate.py")
          audit = audit_path.read_text(encoding="utf-8")
          old = '''    prefix = payload[:256]\n    text_prefix = prefix.decode("utf-8", errors="replace")\n    sanitized_text = re.sub(r"\\s+", " ", text_prefix).strip()[:200]\n    return {\n        "schema_version": "1.0",\n        "case_id": "datacore_chromium_telluride_saed_download_diagnostic",\n        "source_url": _safe_url(source_url),\n        "resolved_url": _safe_url(final_url),\n        "response": dict(response_metadata),\n        "bytes": len(payload),\n        "sha256": _sha256(payload),\n        "first_32_bytes_hex": payload[:32].hex(),\n        "sanitized_text_prefix": sanitized_text,\n        "is_zip": zipfile.is_zipfile(io.BytesIO(payload)),\n        "raw_payload_persisted": False,\n    }\n'''
          new = '''    stripped = payload.lstrip()\n    lowered_prefix = stripped[:32].lower()\n    response_prefix_kind = (\n        "html"\n        if lowered_prefix.startswith((b"<!doctype html", b"<html"))\n        else "binary_or_unknown"\n    )\n    return {\n        "schema_version": "1.0",\n        "case_id": "datacore_chromium_telluride_saed_download_diagnostic",\n        "source_url": _safe_url(source_url),\n        "resolved_url": _safe_url(final_url),\n        "response": dict(response_metadata),\n        "bytes": len(payload),\n        "sha256": _sha256(payload),\n        "first_16_bytes_hex": payload[:16].hex(),\n        "response_prefix_kind": response_prefix_kind,\n        "is_zip": zipfile.is_zipfile(io.BytesIO(payload)),\n        "raw_payload_persisted": False,\n        "response_text_persisted": False,\n    }\n'''
          if old not in audit:
              raise SystemExit("expected diagnostic block was not found")
          audit_path.write_text(audit.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_datacore_saed_candidate_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          old_payload = 'payload = b"<!doctype html><html><title>Download</title></html>"'
          new_payload = '''payload = (\n        b'<!doctype html><html><head><meta name="csrf-token" '\n        b'content="do-not-persist-this-token"></head></html>'\n    )'''
          if old_payload not in tests:
              raise SystemExit("expected non-ZIP payload was not found")
          tests = tests.replace(old_payload, new_payload)
          marker = '    assert not (output / "source.zip").exists()\n\n\ndef test_run_records_raw_evidence_without_authorizing_validation('
          replacement = '''    assert not (output / "source.zip").exists()\n    diagnostic_text = (output / "source_download_diagnostic.json").read_text(\n        encoding="utf-8"\n    )\n    assert "do-not-persist-this-token" not in diagnostic_text\n    assert "sanitized_text_prefix" not in diagnostic_text\n    assert '"response_text_persisted": false' in diagnostic_text\n\n\ndef test_run_records_raw_evidence_without_authorizing_validation('''
          if marker not in tests:
              raise SystemExit("expected non-ZIP test marker was not found")
          test_path.write_text(tests.replace(marker, replacement), encoding="utf-8")

          final_workflow = '''name: DataCORE SAED source audit

on:
  pull_request:
    paths:
      - "scripts/audit_datacore_saed_candidate.py"
      - "scripts/probe_datacore_file_page.py"
      - "tests/test_datacore_saed_candidate_audit.py"
      - "case_studies/saed_external_validation_candidate_registry/**"
      - ".github/workflows/datacore-saed-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datacore-saed-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package, tests, and microscopy readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" tifffile hyperspy

      - name: Run focused source-audit tests
        run: python -m pytest -q tests/test_datacore_saed_candidate_audit.py

      - name: Probe public DataCORE file page
        run: |
          python scripts/probe_datacore_file_page.py \\
            --url "https://datacore.iu.edu/concern/file_sets/37720f05n" \\
            --output outputs/datacore-saed-source-audit/file_page_probe.json

      - name: Audit public DataCORE DM4 and TIFF source
        run: |
          python scripts/audit_datacore_saed_candidate.py \\
            --source-url "https://datacore.iu.edu/downloads/37720f05n?locale=en" \\
            --output outputs/datacore-saed-source-audit/source-audit

      - name: Print audit evidence
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          root = Path("outputs/datacore-saed-source-audit")
          probe = root / "file_page_probe.json"
          if probe.exists():
              print("FILE PAGE PROBE")
              print(probe.read_text(encoding="utf-8"))
          audit_root = root / "source-audit"
          summary_path = audit_root / "source_audit_summary.json"
          diagnostic_path = audit_root / "source_download_diagnostic.json"
          if summary_path.exists():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              print(json.dumps(summary["counts"], indent=2, sort_keys=True))
              print(json.dumps(summary["evidence_gates"], indent=2, sort_keys=True))
              print(json.dumps(summary["decision"], indent=2, sort_keys=True))
          elif diagnostic_path.exists():
              print("DOWNLOAD DIAGNOSTIC")
              print(diagnostic_path.read_text(encoding="utf-8"))
          PYCODE

      - name: Remove raw source payloads before artifact upload
        if: always()
        run: |
          rm -f outputs/datacore-saed-source-audit/source-audit/source.zip
          rm -rf outputs/datacore-saed-source-audit/source-audit/extracted

      - name: Upload checksum-bound metadata evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datacore-saed-source-audit-evidence
          path: |
            outputs/datacore-saed-source-audit/file_page_probe.json
            outputs/datacore-saed-source-audit/source-audit/archive_inventory.csv
            outputs/datacore-saed-source-audit/source-audit/source_audit_summary.json
            outputs/datacore-saed-source-audit/source-audit/source_download_diagnostic.json
            outputs/datacore-saed-source-audit/source-audit/source_audit_manifest.json
          if-no-files-found: error
          retention-days: 7
'''
          Path(".github/workflows/datacore-saed-source-audit.yml").write_text(
              final_workflow, encoding="utf-8"
          )
          PY

          rm -f .github/workflows/request-datacore-saed-retrieval.yml
          rm -f .github/workflows/apply-datacore-audit-security-fix.yml

      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_datacore_saed_candidate_audit.py

      - name: Commit and push cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redact DataCORE response diagnostics"
          git push origin HEAD:agent/audit-datacore-saed-source
