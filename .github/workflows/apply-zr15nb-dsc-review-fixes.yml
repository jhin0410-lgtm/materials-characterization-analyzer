name: Apply Zr15Nb DSC review fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-zr15nb-dsc-review-fixes.yml"
      - "scripts/apply_zr15nb_dsc_review_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Repair generated-test newline escaping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_zr15nb_dsc_review_fixes.py")
          text = path.read_text(encoding="utf-8")
          for start_marker, end_marker in (
              ("append_candidate_tests = r'''", "text = candidate_tests.read_text"),
              ("append_source_tests = r'''", "text = source_tests.read_text"),
          ):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              segment = text[start:end].replace("\\\\n", "\\n")
              text = text[:start] + segment + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply deterministic patch
        run: python scripts/apply_zr15nb_dsc_review_fixes.py

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_public_zr15nb_dsc_source_audit.py
          tests/test_public_zr15nb_dsc_candidate_review.py
          tests/test_public_zr15nb_dsc_case.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_public_zr15nb_dsc_source.py \
            scripts/review_public_zr15nb_dsc_candidates.py \
            tests/test_public_zr15nb_dsc_source_audit.py \
            tests/test_public_zr15nb_dsc_candidate_review.py \
            case_studies/public_zr15nb_dsc/README.md
          git commit -m "Fix Zr15Nb DSC audit and candidate review [dsc-review-fixes-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
