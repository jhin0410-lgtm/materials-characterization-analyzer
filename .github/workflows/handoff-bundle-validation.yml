name: Characterization handoff bundle validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mca/handoff_bundle.py"
      - "src/mca/handoff_bundle_validation.py"
      - "src/mca/handoff_validation/**"
      - "src/mca/handoff_bundle_cli.py"
      - "src/mca/cli_entry.py"
      - "tests/test_handoff_bundle.py"
      - "tests/test_handoff_bundle_validation.py"
      - "docs/handoff_bundle_validation.md"
      - ".github/workflows/handoff-bundle-validation.yml"

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused bundle regressions
        run: |
          python -m py_compile \
            src/mca/handoff_bundle.py \
            src/mca/handoff_bundle_validation.py \
            src/mca/handoff_bundle_cli.py
          python -m compileall -q src/mca/handoff_validation
          pytest -q \
            tests/test_handoff_bundle.py \
            tests/test_handoff_bundle_validation.py

      - name: Verify installed command is exposed
        run: mca validate-handoff --help
