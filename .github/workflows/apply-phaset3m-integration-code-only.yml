name: Apply PhaseT3M integration code only

on:
  pull_request:
    paths:
      - ".github/workflows/apply-phaset3m-integration-code-only.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phaset3m-co3o4-candidate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Execute verified integration transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(
              ".github/workflows/apply-phaset3m-registry-integration-v2.yml"
          ).read_text(encoding="utf-8")
          start_token = "          python - <<'PY'\n"
          end_token = "          PY\n\n      - name: Run focused and full validation"
          if workflow.count(start_token) != 1 or workflow.count(end_token) != 1:
              raise SystemExit("cannot locate integration transformation")
          script = workflow.split(start_token, 1)[1].split(end_token, 1)[0]
          script = textwrap.dedent(script)

          # Actions cannot push workflow-file mutations without workflows permission.
          script, count = re.subn(
              r"\nfor temporary in \(\n.*?\n    temporary\.unlink\(\)\n",
              "\n",
              script,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("temporary workflow-deletion block not found")

          marker = "marker = 'def test_training_source_is_explicitly_excluded(tmp_path: Path) -> None:\\n'\n"
          correction = '''tests = replace_once(
              tests,
              '    assert "Acquire or obtain" in summary["readiness"]["recommended_next_action"]\\n',
              '    assert "Request raw detector frames" in summary["readiness"]["recommended_next_action"]\\n',
              "next-action expectation",
          )
          '''
          if script.count(marker) != 1:
              raise SystemExit("next-action test insertion marker not found")
          script = script.replace(marker, correction + marker)
          exec(compile(script, "phaset3m_integration.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Run focused and full validation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca scripts/audit_phaset3m_co3o4_candidate.py
          pytest -q \
            tests/test_phaset3m_co3o4_candidate_audit.py \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_release_metadata.py
          pytest -q
          set -o pipefail
          python -m build 2>&1 | tee /tmp/build.log
          if grep -q "SetuptoolsDeprecationWarning" /tmp/build.log; then
            echo "setuptools deprecation warning remains" >&2
            exit 1
          fi

      - name: Commit only non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CHANGELOG.md \
            pyproject.toml \
            case_studies/tem_external_validation_candidate_registry/README.md \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            src/mca/tem_external_validation_candidate_registry.py \
            src/mca/tem_external_validation_candidate_registry_engine.py \
            tests/test_tem_external_validation_candidate_registry.py
          git commit -m "Integrate PhaseT3M Co3O4 diagnostic candidate"
          git push origin HEAD:agent/audit-phaset3m-co3o4-candidate
