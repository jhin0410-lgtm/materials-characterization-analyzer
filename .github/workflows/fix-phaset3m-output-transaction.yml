name: Fix PhaseT3M output transaction

on:
  pull_request:
    paths:
      - ".github/workflows/fix-phaset3m-output-transaction.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phaset3m-co3o4-candidate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Make failed evidence writes transactional
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path("src/mca/phaset3m_candidate_audit.py")
          module = module_path.read_text(encoding="utf-8")
          old = '''    except Exception:
                  if created_output and output.exists() and not any(output.iterdir()):
                      output.rmdir()
                  raise
          '''.replace("          ", "")
          new = '''    except Exception:
                  if output.exists() and output.is_dir() and not output.is_symlink():
                      if created_output:
                          shutil.rmtree(output, ignore_errors=True)
                      else:
                          for child in output.iterdir():
                              if child.is_dir() and not child.is_symlink():
                                  shutil.rmtree(child)
                              else:
                                  child.unlink(missing_ok=True)
                  raise
          '''.replace("          ", "")
          if module.count(old) != 1:
              raise SystemExit("expected one PhaseT3M exception-cleanup block")
          module_path.write_text(module.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_phaset3m_co3o4_candidate_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          import_marker = "import pytest\n\nfrom mca.phaset3m_candidate_audit import (\n"
          import_replacement = (
              "import pytest\n\n"
              "import mca.phaset3m_candidate_audit as phaset3m_audit\n"
              "from mca.phaset3m_candidate_audit import (\n"
          )
          if tests.count(import_marker) != 1:
              raise SystemExit("test import marker mismatch")
          tests = tests.replace(import_marker, import_replacement)
          marker = "def test_nonempty_output_is_not_overwritten(tmp_path: Path) -> None:\n"
          addition = '''def test_late_failure_removes_partial_created_output(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              archive = _archive(tmp_path)
              output = tmp_path / "created-output"

              def fail_after_inventory(*args, **kwargs):
                  raise RuntimeError("late evidence write failure")

              monkeypatch.setattr(phaset3m_audit, "_write_json", fail_after_inventory)
              with pytest.raises(RuntimeError, match="late evidence write failure"):
                  audit_phaset3m_candidate(
                      load_config(_config(tmp_path, archive)), archive, output
                  )
              assert not output.exists()


          def test_late_failure_cleans_but_preserves_caller_output_directory(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              archive = _archive(tmp_path)
              output = tmp_path / "caller-output"
              output.mkdir()

              def fail_after_inventory(*args, **kwargs):
                  raise RuntimeError("late evidence write failure")

              monkeypatch.setattr(phaset3m_audit, "_write_json", fail_after_inventory)
              with pytest.raises(RuntimeError, match="late evidence write failure"):
                  audit_phaset3m_candidate(
                      load_config(_config(tmp_path, archive)), archive, output
                  )
              assert output.is_dir()
              assert not any(output.iterdir())


          '''.replace("          ", "")
          if tests.count(marker) != 1:
              raise SystemExit("test insertion marker mismatch")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")
          PY

      - name: Run focused and full validation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca scripts/audit_phaset3m_co3o4_candidate.py
          pytest -q tests/test_phaset3m_co3o4_candidate_audit.py
          pytest -q
          python -m build

      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/phaset3m_candidate_audit.py \
            tests/test_phaset3m_co3o4_candidate_audit.py
          git commit -m "Make PhaseT3M evidence writes transactional"
          git push origin HEAD:agent/audit-phaset3m-co3o4-candidate
