name: SAED external-validation intake

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mca/saed_external_validation_intake.py"
      - "src/mca/saed_external_validation_intake_cli.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_external_validation_intake.py"
      - "case_studies/saed_external_validation_intake/**"
      - ".github/workflows/saed-external-validation-intake.yml"
  push:
    branches:
      - main
    paths:
      - "src/mca/saed_external_validation_intake.py"
      - "src/mca/saed_external_validation_intake_cli.py"
      - "src/mca/cli_entry.py"
      - "tests/test_saed_external_validation_intake.py"
      - "case_studies/saed_external_validation_intake/**"
      - ".github/workflows/saed-external-validation-intake.yml"

concurrency:
  group: saed-external-validation-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused regressions
        run: pytest -q tests/test_saed_external_validation_intake.py

      - name: Build synthetic software fixture
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("tmp/saed-intake-data")
          (root / "patterns").mkdir(parents=True, exist_ok=True)
          records = []
          for index, content in enumerate((b"synthetic-saed-a", b"synthetic-saed-b"), start=1):
              relative = f"patterns/pattern-{index:03d}.tif"
              path = root / relative
              path.write_bytes(content)
              records.append(
                  {
                      "pattern_id": f"pattern-{index:03d}",
                      "relative_path": relative,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "sample_id": f"sample-{index:03d}",
                      "acquisition_id": f"acquisition-{index:03d}",
                      "material_id": "co3o4",
                      "representation": "raw_detector",
                      "original_detector_intensity_available": True,
                      "file_format": "TIFF",
                      "accelerating_voltage_kv": 200.0,
                      "camera_length_mm": 800.0,
                      "detector_model": "synthetic-software-fixture",
                      "detector_pixel_size_um": 14.0,
                      "center_x_px": 256.0,
                      "center_y_px": 256.0,
                      "center_source": "synthetic software fixture",
                      "calibration_method": "camera_constant_nm_pixel",
                      "reciprocal_nm_inv_per_pixel": None,
                      "camera_constant_nm_pixel": 58.75,
                      "reference_d_nm": None,
                      "reference_radius_px": None,
                      "calibration_source": "synthetic software fixture",
                      "preprocessing_operations": ["none"],
                      "used_for_center_selection": False,
                      "used_for_smoothing_selection": False,
                      "used_for_prominence_selection": False,
                      "used_for_radius_bound_selection": False,
                      "used_for_candidate_count_selection": False,
                      "excluded": False,
                      "exclusion_reason": None,
                  }
              )
          manifest = {
              "schema_version": "1.0",
              "case_id": "saed_external_validation_intake",
              "dataset": {
                  "dataset_id": "synthetic-saed-software-fixture",
                  "dataset_version": "v1",
                  "source_type": "new_acquisition",
                  "license": "synthetic test fixture only",
                  "reuse_authorized": True,
                  "identity_provenance": "operator_assigned_at_acquisition",
                  "material_identity_source": "synthetic test fixture",
                  "target_analyzer_development_nonuse_attested": True,
                  "creator_overlap_with_analyzer_development_source": False,
                  "cross_dataset_lineage_independence_attested": True,
                  "minimum_independent_samples": 2,
                  "minimum_independent_acquisitions": 2,
              },
              "patterns": records,
              "evaluation_protocol": {
                  "source_metadata_review_status": "not_run",
                  "file_content_audit_status": "not_run",
                  "calibration_review_status": "not_run",
                  "acquisition_independence_review_status": "not_run",
                  "content_overlap_audit_status": "not_run",
                  "analysis_parameters_frozen": False,
                  "indexing_protocol_frozen": False,
                  "reference_set_frozen": False,
                  "manifest_checksum_frozen": False,
                  "frozen_manifest_sha256": None,
                  "frozen_protocol_id": None,
                  "reference_type": "none",
                  "reference_identifier": None,
                  "metrics_frozen": False,
                  "uncertainty_method_frozen": False,
                  "exclusion_rules_frozen": False,
              },
          }
          Path("tmp/saed-intake-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Run installed CLI
        run: |
          mca saed-validation-intake \
            --manifest tmp/saed-intake-manifest.json \
            --data-root tmp/saed-intake-data \
            --output outputs/saed_external_validation_intake

      - name: Verify fail-closed evidence package
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/saed_external_validation_intake")
          summary = json.loads(
              (output / "saed_validation_intake_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["decision"]["status"] == (
              "ready_to_freeze_saed_analysis_protocol"
          )
          assert summary["decision"]["saed_protocol_freeze_ready"]
          assert not summary["decision"][
              "predeclared_saed_external_evaluation_ready"
          ]
          assert not summary["decision"][
              "crystallographic_performance_claim_ready"
          ]
          assert not summary["processing"]["pattern_decoding_performed"]
          assert not summary["processing"]["analyzer_execution_performed"]
          assert summary["result_counts"]["active_pattern_count"] == 2
          artifact_manifest = json.loads(
              (output / "saed_validation_intake_artifact_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert artifact_manifest["artifact_count"] == 3
          for record in artifact_manifest["artifacts"]:
              path = output / record["path"]
              assert record["bytes"] == path.stat().st_size
              assert record["sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()
          forbidden = [
              path for path in output.rglob("*")
              if path.suffix.lower() in {".tif", ".tiff", ".dm3", ".dm4", ".mrc", ".h5", ".hdf5"}
          ]
          assert not forbidden
          PY

      - name: Upload intake evidence
        uses: actions/upload-artifact@v7
        with:
          name: saed-external-validation-intake-evidence
          path: outputs/saed_external_validation_intake
          if-no-files-found: error
          retention-days: 30
