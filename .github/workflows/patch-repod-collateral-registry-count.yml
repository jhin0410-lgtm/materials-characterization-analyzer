name: Apply RepOD collateral registry count update

on:
  pull_request:
    paths:
      - "scripts/patch_repod_collateral_registry_count.py"
      - ".github/workflows/patch-repod-collateral-registry-count.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-repod-co3o4-tem-figures
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Update collateral count
        run: python scripts/patch_repod_collateral_registry_count.py
      - name: Validate updated script
        run: |
          python -m py_compile scripts/audit_co3o4_public_tem_candidates.py
          python -m pip install -e ".[dev]" pillow
          pytest -q tests/test_co3o4_public_tem_candidate_audit.py tests/test_tem_external_validation_candidate_registry.py
      - name: Commit permanent script update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_co3o4_public_tem_candidates.py
          if git diff --cached --quiet; then
            echo "No permanent collateral change to commit"
          else
            git commit -m "Update Co3O4 audit registry count"
            git fetch origin agent/audit-repod-co3o4-tem-figures
            git rebase origin/agent/audit-repod-co3o4-tem-figures
            git push origin HEAD:agent/audit-repod-co3o4-tem-figures
          fi
