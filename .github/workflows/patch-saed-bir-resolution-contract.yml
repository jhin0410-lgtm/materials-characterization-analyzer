name: Assemble SAED BIR metadata resolution contract

on:
  pull_request:
    paths:
      - "scripts/_patch_parts/saed_resolution_*.txt"
      - "scripts/build_saed_bir_resolution_patch.py"
      - ".github/workflows/patch-saed-bir-resolution-contract.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-saed-bir-resolution-contract

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assemble permanent files
        run: python scripts/build_saed_bir_resolution_patch.py

      - name: Validate focused contract
        run: |
          python -m pip install -e ".[dev]"
          python -m py_compile src/mca/saed_bir_metadata_resolution.py
          pytest -q tests/test_saed_bir_metadata_resolution.py
          mca --help | grep -F "saed-bir-metadata-resolution"

      - name: Commit permanent non-workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_bir_metadata_resolution.py \
            src/mca/cli_entry.py \
            tests/test_saed_bir_metadata_resolution.py \
            case_studies/saed_bir_metadata_resolution/README.md
          if git diff --cached --quiet; then
            echo "Permanent files already assembled."
          else
            git commit -m "Add BIR SAED metadata resolution contract"
            git push origin HEAD:agent/add-saed-bir-resolution-contract
          fi
