name: Repair PhaseT3M integration expectation

on:
  pull_request:
    paths:
      - ".github/workflows/repair-phaset3m-v2-expectation.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/audit-phaset3m-co3o4-candidate

      - name: Update integration workflow expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/apply-phaset3m-registry-integration-v2.yml")
          text = path.read_text(encoding="utf-8")
          marker = '''          marker = 'def test_training_source_is_explicitly_excluded(tmp_path: Path) -> None:\\n'
          '''
          addition = '''          tests = replace_once(
              tests,
              '    assert "Acquire or obtain" in summary["readiness"]["recommended_next_action"]\\n',
              '    assert "Request raw detector frames" in summary["readiness"]["recommended_next_action"]\\n',
              "next-action expectation",
          )
          '''
          if text.count(marker) != 1:
              raise SystemExit("integration workflow insertion marker mismatch")
          path.write_text(text.replace(marker, addition + marker), encoding="utf-8")
          Path(".github/workflows/repair-phaset3m-v2-expectation.yml").unlink()
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PhaseT3M registry expectation"
          git push origin HEAD:agent/audit-phaset3m-co3o4-candidate
