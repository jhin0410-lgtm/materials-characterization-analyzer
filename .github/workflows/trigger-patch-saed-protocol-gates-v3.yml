name: Trigger SAED protocol gate patch v3

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-patch-saed-protocol-gates-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-saed-validation-intake

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Separate source and protocol readiness gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(lines: list[str]) -> str:
              return "\n".join(lines) + "\n"

          module_path = Path("src/mca/saed_external_validation_intake.py")
          text = module_path.read_text(encoding="utf-8")
          start = text.index("        failed_reviews = [\n")
          end = text.index("        if not base_ready:\n", start)
          replacement = block([
              "        failed_reviews = [",
              "            status",
              "            for status in manifest.evaluation_protocol.review_statuses",
              "            if status == \"failed\"",
              "        ]",
              "        protocol_gates: dict[str, bool] = {",
              "            \"source_metadata_review_passed\": (",
              "                manifest.evaluation_protocol.source_metadata_review_status",
              "                == \"passed\"",
              "            ),",
              "            \"file_content_audit_passed\": (",
              "                manifest.evaluation_protocol.file_content_audit_status",
              "                == \"passed\"",
              "            ),",
              "            \"calibration_review_passed\": (",
              "                manifest.evaluation_protocol.calibration_review_status",
              "                == \"passed\"",
              "            ),",
              "            \"acquisition_independence_review_passed\": (",
              "                manifest.evaluation_protocol",
              "                .acquisition_independence_review_status",
              "                == \"passed\"",
              "            ),",
              "            \"content_overlap_audit_passed\": (",
              "                manifest.evaluation_protocol.content_overlap_audit_status",
              "                == \"passed\"",
              "            ),",
              "            \"analysis_parameters_frozen\": (",
              "                manifest.evaluation_protocol.analysis_parameters_frozen",
              "            ),",
              "            \"indexing_protocol_frozen\": (",
              "                manifest.evaluation_protocol.indexing_protocol_frozen",
              "            ),",
              "            \"reference_set_frozen\": (",
              "                manifest.evaluation_protocol.reference_set_frozen",
              "            ),",
              "            \"canonical_manifest_checksum_frozen\": (",
              "                manifest.evaluation_protocol.manifest_checksum_frozen",
              "                and manifest.evaluation_protocol.frozen_manifest_sha256",
              "                == manifest.canonical_sha256",
              "            ),",
              "            \"frozen_protocol_id_assigned\": (",
              "                manifest.evaluation_protocol.frozen_protocol_id is not None",
              "            ),",
              "            \"reference_protocol_bound\": (",
              "                manifest.evaluation_protocol.reference_type != \"none\"",
              "                and manifest.evaluation_protocol.reference_identifier",
              "                is not None",
              "            ),",
              "            \"metrics_frozen\": (",
              "                manifest.evaluation_protocol.metrics_frozen",
              "            ),",
              "            \"uncertainty_method_frozen\": (",
              "                manifest.evaluation_protocol.uncertainty_method_frozen",
              "            ),",
              "            \"exclusion_rules_frozen\": (",
              "                manifest.evaluation_protocol.exclusion_rules_frozen",
              "            ),",
              "        }",
              "        base_ready = all(gates.values()) and not failed_reviews",
              "        protocol_complete = base_ready and all(protocol_gates.values())",
              "        unresolved = [name for name, passed in gates.items() if not passed]",
              "        unresolved_protocol = [",
              "            name for name, passed in protocol_gates.items() if not passed",
              "        ]",
          ])
          text = text[:start] + replacement + text[end:]

          count_line = '                "failed_review_count": len(failed_reviews),\n'
          if text.count(count_line) != 1:
              raise SystemExit("failed-review count line mismatch")
          text = text.replace(
              count_line,
              count_line
              + '                "unresolved_protocol_gate_count": '
              + 'len(unresolved_protocol),\n',
          )

          evidence = block([
              '            "evidence_gates": {',
              "                **gates,",
              '                "unresolved_evidence": unresolved,',
              "            },",
          ])
          protocol = evidence + block([
              '            "protocol_freeze_gates": {',
              "                **protocol_gates,",
              '                "unresolved_protocol": unresolved_protocol,',
              "            },",
          ])
          if text.count(evidence) != 1:
              raise SystemExit("evidence gate block mismatch")
          text = text.replace(evidence, protocol)

          report_vars = block([
              '    unresolved = summary["evidence_gates"]["unresolved_evidence"]',
              '    unresolved_text = ", ".join(unresolved) if unresolved else "none"',
          ])
          report_vars_new = block([
              '    unresolved = summary["evidence_gates"]["unresolved_evidence"]',
              '    unresolved_protocol = summary["protocol_freeze_gates"][',
              '        "unresolved_protocol"',
              "    ]",
              '    unresolved_text = ", ".join(unresolved) if unresolved else "none"',
              "    unresolved_protocol_text = (",
              '        ", ".join(unresolved_protocol) if unresolved_protocol else "none"',
              "    )",
          ])
          if text.count(report_vars) != 1:
              raise SystemExit("report variable block mismatch")
          text = text.replace(report_vars, report_vars_new)

          report_line = '        f"- Unresolved evidence: `{unresolved_text}`\\n"\n'
          report_line_new = (
              '        f"- Unresolved source evidence: `{unresolved_text}`\\n"\n'
              '        f"- Unresolved protocol gates: '
              '`{unresolved_protocol_text}`\\n"\n'
          )
          if text.count(report_line) != 1:
              raise SystemExit("report line mismatch")
          module_path.write_text(
              text.replace(report_line, report_line_new), encoding="utf-8"
          )

          tests_path = Path("tests/test_saed_external_validation_intake.py")
          tests = tests_path.read_text(encoding="utf-8")
          happy_line = (
              '    assert summary["result_counts"]["acquisition_count"] == 2\n'
          )
          happy_extra = block([
              '    assert summary["evidence_gates"]["unresolved_evidence"] == []',
              '    assert "source_metadata_review_passed" in summary[',
              '        "protocol_freeze_gates"',
              '    ]["unresolved_protocol"]',
              '    assert summary["result_counts"][',
              '        "unresolved_protocol_gate_count"',
              "    ] > 0",
          ])
          if tests.count(happy_line) != 1:
              raise SystemExit("happy-path assertion mismatch")
          tests = tests.replace(happy_line, happy_line + happy_extra)

          complete_line = (
              '    assert not summary["decision"]["engineering_release_ready"]\n'
          )
          complete_extra = block([
              '    assert summary["protocol_freeze_gates"][',
              '        "unresolved_protocol"',
              "    ] == []",
              '    assert summary["result_counts"][',
              '        "unresolved_protocol_gate_count"',
              "    ] == 0",
          ])
          if tests.count(complete_line) != 1:
              raise SystemExit("complete-path assertion mismatch")
          tests = tests.replace(complete_line, complete_line + complete_extra)

          test_marker = "def test_frozen_manifest_mutation_fails_without_partial_output(\n"
          failed_review_test = block([
              "def test_failed_review_is_explicit_and_blocks_protocol_readiness(",
              "    tmp_path: Path,",
              ") -> None:",
              '    root = tmp_path / "data"',
              "    root.mkdir()",
              "    payload = _manifest(_two_patterns(root))",
              '    payload["evaluation_protocol"]["calibration_review_status"] = (',
              '        "failed"',
              "    )",
              "    summary = run_saed_external_validation_intake(",
              "        load_intake_manifest(",
              '            _write_manifest(tmp_path / "manifest.json", payload)',
              "        ),",
              "        root,",
              '        tmp_path / "out",',
              "    )",
              '    assert summary["decision"]["status"] == BLOCKED',
              '    assert not summary["decision"]["saed_protocol_freeze_ready"]',
              '    assert "calibration_review_passed" in summary[',
              '        "protocol_freeze_gates"',
              '    ]["unresolved_protocol"]',
              '    assert summary["result_counts"]["failed_review_count"] == 1',
              "",
              "",
          ])
          if tests.count(test_marker) != 1:
              raise SystemExit("test insertion marker mismatch")
          tests_path.write_text(
              tests.replace(test_marker, failed_review_test + test_marker),
              encoding="utf-8",
          )

          permanent_path = Path(
              ".github/workflows/saed-external-validation-intake.yml"
          )
          permanent = permanent_path.read_text(encoding="utf-8")
          assertion = block([
              '          assert not summary["decision"][',
              '              "predeclared_saed_external_evaluation_ready"',
              "          ]",
          ])
          assertion_extra = block([
              '          assert summary["evidence_gates"][',
              '              "unresolved_evidence"',
              "          ] == []",
              '          assert summary["protocol_freeze_gates"][',
              '              "unresolved_protocol"',
              "          ]",
              '          assert summary["result_counts"][',
              '              "unresolved_protocol_gate_count"',
              "          ] > 0",
          ])
          if permanent.count(assertion) != 1:
              raise SystemExit("permanent workflow assertion mismatch")
          permanent_path.write_text(
              permanent.replace(assertion, assertion + assertion_extra),
              encoding="utf-8",
          )
          PY

      - name: Validate focused and full repository behavior
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca
          pytest -q tests/test_saed_external_validation_intake.py
          pytest -q
          python -m build

      - name: Commit validated permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_external_validation_intake.py \
            tests/test_saed_external_validation_intake.py \
            .github/workflows/saed-external-validation-intake.yml
          git commit -m "Clarify SAED source and protocol readiness gates"
          git push origin HEAD:agent/add-saed-validation-intake
