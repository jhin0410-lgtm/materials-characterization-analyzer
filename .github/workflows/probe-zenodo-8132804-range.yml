name: Probe Zenodo 8132804 ZIP ranges

on:
  pull_request:
    paths:
      - ".github/workflows/probe-zenodo-8132804-range.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read bounded ZIP central directory
        run: |
          mkdir -p outputs/zenodo_8132804_range_probe
          python - <<'PY'
          import hashlib
          import json
          import struct
          import urllib.request
          from pathlib import Path

          url = "https://zenodo.org/api/records/8132804/files/Multi_Modal_Data_Fusion_Chemical_Tomography.zip/content"
          total = 1_183_315_114
          budget = 16 * 1024 * 1024
          user_agent = "materials-characterization-analyzer-source-audit/1.0"

          def ranged(start: int, end: int):
              if end < start or end - start + 1 > budget:
                  raise RuntimeError("invalid bounded range")
              request = urllib.request.Request(
                  url,
                  headers={"Range": f"bytes={start}-{end}", "User-Agent": user_agent},
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  body = response.read(budget + 1)
                  status = int(response.status)
                  headers = {k.casefold(): v for k, v in response.headers.items()}
              if len(body) > budget:
                  raise RuntimeError("range response exceeded budget")
              expected = f"bytes {start}-{end}/{total}"
              if status != 206 or headers.get("content-range") != expected:
                  raise RuntimeError(
                      f"range not honored: status={status}, content-range={headers.get('content-range')}"
                  )
              return body

          tail_size = 256 * 1024
          tail_start = total - tail_size
          tail = ranged(tail_start, total - 1)
          eocd_at = tail.rfind(b"PK\x05\x06")
          if eocd_at < 0:
              raise RuntimeError("EOCD not found")
          values = struct.unpack_from("<4s4H2LH", tail, eocd_at)
          _, disk, cd_disk, disk_entries, total_entries, cd_size, cd_offset, comment_len = values
          if disk or cd_disk or disk_entries != total_entries:
              raise RuntimeError("unsupported multi-disk ZIP")
          if any(v in (0xFFFF, 0xFFFFFFFF) for v in (total_entries, cd_size, cd_offset)):
              raise RuntimeError("ZIP64 requires a separate parser")
          if cd_size <= 0 or cd_size > budget or cd_offset + cd_size > total:
              raise RuntimeError("central directory outside bounded policy")
          if eocd_at + 22 + comment_len > len(tail):
              raise RuntimeError("truncated EOCD comment")

          central = ranged(cd_offset, cd_offset + cd_size - 1)
          fmt = "<4s6H3L5H2L"
          fixed = struct.calcsize(fmt)
          cursor = 0
          entries = []
          while cursor < len(central):
              fields = struct.unpack_from(fmt, central, cursor)
              sig = fields[0]
              if sig != b"PK\x01\x02":
                  raise RuntimeError(f"bad central signature at {cursor}")
              flags = fields[3]
              method = fields[4]
              crc32 = fields[7]
              csize = fields[8]
              usize = fields[9]
              name_len = fields[10]
              extra_len = fields[11]
              comment_len = fields[12]
              local_offset = fields[16]
              start = cursor + fixed
              raw_name = central[start:start + name_len]
              name = raw_name.decode("utf-8" if flags & 0x800 else "cp437")
              entries.append({
                  "path": name,
                  "compressed_bytes": csize,
                  "uncompressed_bytes": usize,
                  "compression_method": method,
                  "crc32": f"{crc32:08x}",
                  "flags": flags,
                  "local_header_offset": local_offset,
              })
              cursor = start + name_len + extra_len + comment_len
          if cursor != len(central) or len(entries) != total_entries:
              raise RuntimeError("central directory parse mismatch")

          targets = [
              item for item in entries
              if any(token in item["path"].casefold() for token in ("co3o4", "mn3o4", "cobalt", "mangan"))
          ]
          result = {
              "schema_version": "1.0",
              "archive_bytes": total,
              "entry_count": total_entries,
              "central_directory_offset": cd_offset,
              "central_directory_bytes": cd_size,
              "entries": entries,
              "target_entries": targets,
              "target_entry_count": len(targets),
              "range_transfer_bytes": len(tail) + len(central),
              "full_archive_downloaded": False,
              "tail_sha256": hashlib.sha256(tail).hexdigest(),
              "central_directory_sha256": hashlib.sha256(central).hexdigest(),
          }
          Path("outputs/zenodo_8132804_range_probe/zip_inventory.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "entry_count": total_entries,
              "central_directory_bytes": cd_size,
              "target_entry_count": len(targets),
              "target_entries": targets,
              "range_transfer_bytes": result["range_transfer_bytes"],
              "full_archive_downloaded": False,
          }, indent=2))
          PY

      - name: Upload bounded ZIP inventory
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-8132804-range-probe
          path: outputs/zenodo_8132804_range_probe
          if-no-files-found: error
          retention-days: 7
