name: Apply Co3O4 observed snapshot history

on:
  pull_request:
    paths:
      - "scripts/patch_co3o4_observed_snapshot_history.py"
      - "scripts/fix_observed_history_phrase.py"
      - ".github/workflows/patch-co3o4-observed-snapshot-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-co3o4-ald-tem-candidate
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fix evidence wording
        run: python scripts/fix_observed_history_phrase.py
      - name: Apply permanent snapshot history
        run: python scripts/patch_co3o4_observed_snapshot_history.py
      - name: Validate focused regressions and snapshot uniqueness
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_co3o4_public_tem_candidate_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(
              Path("case_studies/co3o4_public_tem_candidate_audit/case_config.json")
              .read_text(encoding="utf-8")
          )
          snapshots = config["sources"]["mendeley_palygorskite_co3o4"]["known_snapshots"]
          assert len(snapshots) == 2
          assert len({item["sha256"] for item in snapshots}) == 2
          assert {item["bytes"] for item in snapshots} == {16250421}
          assert all(
              item["tem_hrtem_stem_member_count"] == 0
              for item in snapshots
              if "tem_hrtem_stem_member_count" in item
          )
          PY
      - name: Commit permanent files on latest branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            case_studies/co3o4_public_tem_candidate_audit/case_config.json \
            case_studies/co3o4_public_tem_candidate_audit/README.md \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
          else
            git commit -m "Record Co3O4 public archive identity drift"
            git fetch origin agent/audit-co3o4-ald-tem-candidate
            git rebase origin/agent/audit-co3o4-ald-tem-candidate
            git push origin HEAD:agent/audit-co3o4-ald-tem-candidate
          fi
