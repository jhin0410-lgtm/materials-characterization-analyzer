name: Harden SAED BIR metadata placeholders

on:
  pull_request:
    paths:
      - "scripts/patch_saed_bir_resolution_placeholders.py"
      - ".github/workflows/patch-saed-bir-resolution-placeholders.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-saed-bir-resolution-contract

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply placeholder hardening
        run: python scripts/patch_saed_bir_resolution_placeholders.py

      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          python -m py_compile src/mca/saed_bir_metadata_resolution.py
          pytest -q tests/test_saed_bir_metadata_resolution.py

      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_bir_metadata_resolution.py \
            tests/test_saed_bir_metadata_resolution.py
          if git diff --cached --quiet; then
            echo "Placeholder hardening already applied."
          else
            git commit -m "Harden BIR metadata placeholder gates"
            git push origin HEAD:agent/add-saed-bir-resolution-contract
          fi
