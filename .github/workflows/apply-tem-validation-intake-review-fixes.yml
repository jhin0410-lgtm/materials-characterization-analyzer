name: Apply TEM validation-intake review fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-tem-validation-intake-review-fixes.yml"
      - "scripts/apply_tem_validation_intake_review_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply deterministic patch
        run: python scripts/apply_tem_validation_intake_review_fixes.py

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused regression tests
        run: pytest -q tests/test_tem_external_validation_intake.py

      - name: Run full repository tests
        run: pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/tem_external_validation_intake.py \
            tests/test_tem_external_validation_intake.py \
            case_studies/tem_external_validation_intake/manifest_template.example.json \
            case_studies/tem_external_validation_intake/README.md \
            CHANGELOG.md
          git commit -m "Fix TEM external-validation intake gates [review-fixes-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
