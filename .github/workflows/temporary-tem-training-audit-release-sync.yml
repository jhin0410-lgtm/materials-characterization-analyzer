name: Sync TEM training-audit release metadata

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-tem-training-audit-release-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize version and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("pyproject.toml"): [('version = "0.9.1"', 'version = "0.9.2"')],
              Path("src/mca/__init__.py"): [('__version__ = "0.9.1"', '__version__ = "0.9.2"')],
              Path("CITATION.cff"): [
                  ("version: 0.9.1", "version: 0.9.2"),
                  (
                      "identity, pixel calibration, or physical particle dimensions.",
                      "identity, parent-group leakage, pixel calibration, or physical particle dimensions.",
                  ),
              ],
              Path(".github/workflows/public-cobalt-oxide-tem-masks.yml"): [("0.9.1", "0.9.2")],
              Path(".github/workflows/public-cobalt-oxide-tem-source-image-mask-pairing.yml"): [("0.9.1", "0.9.2")],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "No unreleased changes are currently recorded.\n"
          section = '''

## [0.9.2] - 2026-07-28

### Added

- A checksum-bound audit for the public cobalt-oxide `training_images.h5` and `training_labels.h5` hand-labeled TEM patch files.
- Deterministic inventory of 256 paired `512 x 512` patches, two-channel complementary one-hot labels, per-patch SHA-256 fingerprints, exact duplicate checks, and source-standardization validation.
- Diagnostic reconstruction of four contiguous 64-patch candidate parent groups using the pinned source notebook's `8 x 8` tiling order and measured image/label edge continuity.
- Reproduction of the linked notebook's shuffled eight-fold patch split with explicit candidate-parent overlap records for every fold.

### Scientific status

- The training files are valid hand-labeled training pairs, but they do not contain authoritative parent-image IDs, patch coordinates, calibration, or a predeclared independent validation partition.
- All four reconstructed candidate parent groups occur in both training and validation for every published patch-level fold; those folds are therefore not independent parent-image generalization evidence.
- The case is `Diagnostic` and classified `not_ready_for_independent_model_performance_claims`.
- No model training, inference, segmentation-accuracy score, nanometre conversion, synthesis-condition inference, causal claim, optimization, or engineering-release decision is performed.
- Synthetic fixtures are used only for software validation and do not contribute to the real-data evidence.
'''
          if "## [0.9.2] - 2026-07-28" not in text:
              if marker not in text:
                  raise SystemExit("changelog insertion marker not found")
              changelog.write_text(text.replace(marker, marker + section, 1), encoding="utf-8")
          PY
          rm .github/workflows/temporary-tem-training-audit-release-sync.yml

      - name: Commit synchronized release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release TEM training-data audit as 0.9.2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# Triggered after the workflow definition became visible to the pull-request event.
