name: Public cobalt oxide TEM parent-overlap audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-parent-overlap-audit.yml"
      - "case_studies/public_cobalt_oxide_tem_parent_overlap_audit/**"
      - "case_studies/public_cobalt_oxide_tem_parent_similarity_review/**"
      - "scripts/audit_public_cobalt_oxide_tem_parent_overlap.py"
      - "scripts/audit_public_cobalt_oxide_tem_parent_similarity.py"
      - "src/mca/tem_parent_overlap_audit.py"
      - "src/mca/tem_parent_overlap_contract.py"
      - "src/mca/tem_parent_overlap_engine.py"
      - "src/mca/tem_parent_overlap_io.py"
      - "src/mca/tem_parent_similarity_review.py"
      - "tests/test_public_cobalt_oxide_tem_parent_overlap_audit.py"
      - "tests/test_tem_parent_overlap_archive_contract.py"
      - "tests/test_public_cobalt_oxide_tem_parent_similarity_review.py"
      - "tests/test_v0_11_release_publication_workflow.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-cobalt-oxide-tem-parent-overlap-audit.yml"
      - "case_studies/public_cobalt_oxide_tem_parent_overlap_audit/**"
      - "case_studies/public_cobalt_oxide_tem_parent_similarity_review/**"
      - "scripts/audit_public_cobalt_oxide_tem_parent_overlap.py"
      - "scripts/audit_public_cobalt_oxide_tem_parent_similarity.py"
      - "src/mca/tem_parent_overlap_audit.py"
      - "src/mca/tem_parent_overlap_contract.py"
      - "src/mca/tem_parent_overlap_engine.py"
      - "src/mca/tem_parent_overlap_io.py"
      - "src/mca/tem_parent_similarity_review.py"
      - "tests/test_public_cobalt_oxide_tem_parent_overlap_audit.py"
      - "tests/test_tem_parent_overlap_archive_contract.py"
      - "tests/test_public_cobalt_oxide_tem_parent_similarity_review.py"
      - "tests/test_v0_11_release_publication_workflow.py"
      - "pyproject.toml"
      - "src/mca/__init__.py"
      - "CITATION.cff"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: public-cobalt-oxide-tem-parent-overlap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-real-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show available disk space
        run: df -h

      - name: Download exact public training images and source-image archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/training_images.h5 \
            "https://zenodo.org/records/14927582/files/training_images.h5?download=1"
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/TEM_images.zip \
            "https://zenodo.org/records/14927582/files/TEM_images.zip?download=1"

      - name: Audit four training parents against all fifty public source frames
        run: |
          set -euo pipefail
          python scripts/audit_public_cobalt_oxide_tem_parent_overlap.py \
            --config case_studies/public_cobalt_oxide_tem_parent_overlap_audit/case_config.json \
            --training-images /tmp/training_images.h5 \
            --source-archive /tmp/TEM_images.zip \
            --output outputs/public-cobalt-oxide-tem-parent-overlap-audit \
            | tee outputs/public-cobalt-oxide-tem-parent-overlap-audit-console.json

      - name: Review unresolved high-similarity source-frame parent pair
        run: |
          set -euo pipefail
          python scripts/audit_public_cobalt_oxide_tem_parent_similarity.py \
            --config case_studies/public_cobalt_oxide_tem_parent_similarity_review/case_config.json \
            --training-images /tmp/training_images.h5 \
            --source-archive /tmp/TEM_images.zip \
            --output outputs/public-cobalt-oxide-tem-parent-similarity-review \
            | tee outputs/public-cobalt-oxide-tem-parent-similarity-review-console.json

      - name: Verify real-data and scientific contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import pandas as pd

          from mca import __version__

          output = Path("outputs/public-cobalt-oxide-tem-parent-overlap-audit")
          summary = json.loads(
              (output / "parent_overlap_audit_summary.json").read_text(encoding="utf-8")
          )
          counts = summary["result_counts"]
          assert summary["software_version"] == __version__
          assert summary["source"]["doi"] == "10.5281/zenodo.14927582"
          assert summary["source"]["license"] == "CC-BY-4.0"
          assert summary["source"]["training_images"]["sha256"] == (
              "e709b7f1fa383bd111bb0b7e8d4662452b46198f52e4e88b19bb3f3e222c0926"
          )
          assert summary["source"]["source_image_archive"]["sha256"] == (
              "a9e4618f697205bf8560ab14bc5e313d4011b51aaa6dbf8a5c62ddc22bc558d8"
          )
          assert counts["training_candidate_parent_count"] == 4
          assert counts["source_member_count"] == 10
          assert counts["source_frame_count"] == 50
          assert counts["pairwise_comparison_count"] == 200
          assert (
              counts["content_equivalent_overlap_frame_count"]
              + counts["review_required_frame_count"]
              + counts["no_content_equivalent_overlap_detected_frame_count"]
              == 50
          )
          assert counts["independent_external_validation_candidate_count"] == 0
          assert summary["external_validation_readiness"]["status"] == (
              "no_independent_external_validation_set_available"
          )
          assert not summary["external_validation_readiness"][
              "source_masks_are_independent_ground_truth"
          ]
          assert summary["scientific_closeout"]["status"] == "Diagnostic"
          assert summary["scientific_closeout"]["result"] == (
              "no_independent_external_validation_set_available"
          )
          processing = summary["processing"]
          assert processing["tile_restandardization_for_identity_comparison_only"]
          for key, value in processing.items():
              if key != "tile_restandardization_for_identity_comparison_only":
                  assert value is False, (key, value)

          frames = pd.read_csv(output / "tem_parent_overlap_frame_inventory.csv")
          comparisons = pd.read_csv(
              output / "tem_parent_overlap_pairwise_comparisons.csv"
          )
          assert len(frames) == 50
          assert len(comparisons) == 200
          assert frames["source_frame_id"].nunique() == 50
          assert comparisons.groupby("source_frame_id").size().eq(4).all()
          assert frames["best_exact_tile_match_count"].between(0, 64).all()
          assert frames["best_exact_tile_match_fraction"].between(0, 1).all()
          assert comparisons["exact_tile_match_count"].between(0, 64).all()
          assert comparisons["signature_ncc"].between(-1.0000000001, 1.0000000001).all()
          assert not frames["independent_external_validation_candidate"].any()

          manifest = json.loads(
              (output / "parent_overlap_audit_artifact_manifest.json").read_text()
          )
          assert manifest["artifact_count"] == 4
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]

          review_output = Path("outputs/public-cobalt-oxide-tem-parent-similarity-review")
          review = json.loads(
              (review_output / "parent_similarity_review_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert review["software_version"] == __version__
          assert review["source"]["doi"] == "10.5281/zenodo.14927582"
          assert review["review_target"] == {
              "candidate_parent_identity_status": "diagnostic_reconstruction_not_authoritative_mapping",
              "candidate_parent_index": 3,
              "frame_index": 0,
              "source_frame_id": "co0_7:frame-0",
              "source_id": "co0_7",
          }
          aggregate = review["aggregate_similarity"]
          assert aggregate["tile_count"] == 64
          assert aggregate["exact_quantized_tile_hash_match_count"] == 0
          assert -1.0 <= aggregate["global_pixel_ncc"] <= 1.0
          assert -1.0 <= aggregate["minimum_tile_pixel_ncc"] <= 1.0
          assert -1.0 <= aggregate["median_tile_pixel_ncc"] <= 1.0
          assert 0 <= aggregate["tile_count_ncc_at_least_0_995"] <= 64
          assert not review["relationship_assessment"][
              "authoritative_parent_identity_confirmed"
          ]
          assert not review["external_validation_readiness"][
              "independent_external_validation_candidate"
          ]
          assert review["scientific_closeout"]["status"] == "Diagnostic"
          review_processing = review["processing"]
          assert review_processing["tile_restandardization_for_identity_comparison_only"]
          for key, value in review_processing.items():
              if key != "tile_restandardization_for_identity_comparison_only":
                  assert value is False, (key, value)

          tiles = pd.read_csv(
              review_output / "tem_parent_similarity_review_tiles.csv"
          )
          assert len(tiles) == 64
          assert tiles["tile_index"].tolist() == list(range(64))
          assert tiles["training_patch_index"].tolist() == list(range(192, 256))
          assert tiles["pixel_ncc"].between(-1.0000000001, 1.0000000001).all()
          assert not tiles["exact_quantized_hash_match"].any()

          review_manifest = json.loads(
              (review_output / "parent_similarity_review_artifact_manifest.json").read_text()
          )
          assert review_manifest["artifact_count"] == 3
          for record in review_manifest["artifacts"]:
              path = review_output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]

          forbidden_suffixes = {".pkl", ".pickle", ".joblib", ".pt", ".pth", ".onnx"}
          assert not [
              path for path in Path("outputs").rglob("*")
              if path.suffix.lower() in forbidden_suffixes
          ]
          print(json.dumps(counts, indent=2, sort_keys=True))
          print(json.dumps(summary["content_equivalent_matches"], indent=2))
          print(json.dumps(aggregate, indent=2, sort_keys=True))
          print(json.dumps(review["relationship_assessment"], indent=2, sort_keys=True))
          PY

      - name: Run focused software tests
        run: |
          pytest -q \
            tests/test_public_cobalt_oxide_tem_parent_overlap_audit.py \
            tests/test_tem_parent_overlap_archive_contract.py \
            tests/test_public_cobalt_oxide_tem_parent_similarity_review.py

      - name: Verify package version and build
        run: |
          set -euo pipefail
          version="$(python -c 'from mca import __version__; print(__version__)')"
          mca --version | tee mca-version.txt
          grep -F "${version}" mca-version.txt
          python -m build
          python - <<'PY'
          from pathlib import Path

          from mca import __version__

          files = sorted(path.name for path in Path("dist").iterdir())
          assert f"materials_characterization_analyzer-{__version__}-py3-none-any.whl" in files
          assert f"materials_characterization_analyzer-{__version__}.tar.gz" in files
          print(files)
          PY

      - name: Upload real-data evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-cobalt-oxide-tem-parent-overlap-evidence
          path: |
            outputs/public-cobalt-oxide-tem-parent-overlap-audit/
            outputs/public-cobalt-oxide-tem-parent-overlap-audit-console.json
            outputs/public-cobalt-oxide-tem-parent-similarity-review/
            outputs/public-cobalt-oxide-tem-parent-similarity-review-console.json
            mca-version.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: materials-characterization-analyzer-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
