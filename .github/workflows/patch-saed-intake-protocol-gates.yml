name: Patch SAED intake protocol gates

on:
  push:
    branches:
      - agent/add-saed-validation-intake
    paths:
      - ".github/workflows/patch-saed-intake-protocol-gates.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-saed-validation-intake

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Separate source and protocol readiness gates
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path("src/mca/saed_external_validation_intake.py")
          text = module_path.read_text(encoding="utf-8")
          start = text.index("        failed_reviews = [\n")
          end = text.index("        if not base_ready:\n", start)
          replacement = '''        failed_reviews = [
              status
              for status in manifest.evaluation_protocol.review_statuses
              if status == "failed"
          ]
          protocol_gates: dict[str, bool] = {
              "source_metadata_review_passed": (
                  manifest.evaluation_protocol.source_metadata_review_status
                  == "passed"
              ),
              "file_content_audit_passed": (
                  manifest.evaluation_protocol.file_content_audit_status == "passed"
              ),
              "calibration_review_passed": (
                  manifest.evaluation_protocol.calibration_review_status == "passed"
              ),
              "acquisition_independence_review_passed": (
                  manifest.evaluation_protocol.acquisition_independence_review_status
                  == "passed"
              ),
              "content_overlap_audit_passed": (
                  manifest.evaluation_protocol.content_overlap_audit_status == "passed"
              ),
              "analysis_parameters_frozen": (
                  manifest.evaluation_protocol.analysis_parameters_frozen
              ),
              "indexing_protocol_frozen": (
                  manifest.evaluation_protocol.indexing_protocol_frozen
              ),
              "reference_set_frozen": (
                  manifest.evaluation_protocol.reference_set_frozen
              ),
              "canonical_manifest_checksum_frozen": (
                  manifest.evaluation_protocol.manifest_checksum_frozen
                  and manifest.evaluation_protocol.frozen_manifest_sha256
                  == manifest.canonical_sha256
              ),
              "frozen_protocol_id_assigned": (
                  manifest.evaluation_protocol.frozen_protocol_id is not None
              ),
              "reference_protocol_bound": (
                  manifest.evaluation_protocol.reference_type != "none"
                  and manifest.evaluation_protocol.reference_identifier is not None
              ),
              "metrics_frozen": manifest.evaluation_protocol.metrics_frozen,
              "uncertainty_method_frozen": (
                  manifest.evaluation_protocol.uncertainty_method_frozen
              ),
              "exclusion_rules_frozen": (
                  manifest.evaluation_protocol.exclusion_rules_frozen
              ),
          }
          base_ready = all(gates.values()) and not failed_reviews
          protocol_complete = base_ready and all(protocol_gates.values())
          unresolved = [name for name, passed in gates.items() if not passed]
          unresolved_protocol = [
              name for name, passed in protocol_gates.items() if not passed
          ]
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          text = text[:start] + replacement + text[end:]

          old_counts = '''                "failed_review_count": len(failed_reviews),
              },
              "evidence_gates": {
                  **gates,
                  "unresolved_evidence": unresolved,
              },'''
          new_counts = '''                "failed_review_count": len(failed_reviews),
                  "unresolved_protocol_gate_count": len(unresolved_protocol),
              },
              "evidence_gates": {
                  **gates,
                  "unresolved_evidence": unresolved,
              },
              "protocol_freeze_gates": {
                  **protocol_gates,
                  "unresolved_protocol": unresolved_protocol,
              },'''
          if text.count(old_counts) != 1:
              raise SystemExit("summary gate block mismatch")
          text = text.replace(old_counts, new_counts)

          old_report = '''    unresolved = summary["evidence_gates"]["unresolved_evidence"]
              unresolved_text = ", ".join(unresolved) if unresolved else "none"'''
          new_report = '''    unresolved = summary["evidence_gates"]["unresolved_evidence"]
              unresolved_protocol = summary["protocol_freeze_gates"][
                  "unresolved_protocol"
              ]
              unresolved_text = ", ".join(unresolved) if unresolved else "none"
              unresolved_protocol_text = (
                  ", ".join(unresolved_protocol) if unresolved_protocol else "none"
              )'''
          if text.count(old_report) != 1:
              raise SystemExit("report variable block mismatch")
          text = text.replace(old_report, new_report)

          old_line = '''        f"- Unresolved evidence: `{unresolved_text}`\\n"'''
          new_line = '''        f"- Unresolved source evidence: `{unresolved_text}`\\n"
                  f"- Unresolved protocol gates: `{unresolved_protocol_text}`\\n"'''
          if text.count(old_line) != 1:
              raise SystemExit("report unresolved line mismatch")
          text = text.replace(old_line, new_line)
          module_path.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_saed_external_validation_intake.py")
          tests = tests_path.read_text(encoding="utf-8")
          happy_marker = '''    assert summary["result_counts"]["acquisition_count"] == 2
          
              artifacts = json.loads('''
          happy_replacement = '''    assert summary["result_counts"]["acquisition_count"] == 2
              assert summary["evidence_gates"]["unresolved_evidence"] == []
              assert "source_metadata_review_passed" in summary[
                  "protocol_freeze_gates"
              ]["unresolved_protocol"]
              assert summary["result_counts"]["unresolved_protocol_gate_count"] > 0
          
              artifacts = json.loads('''
          happy_marker = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in happy_marker.splitlines()
          )
          happy_replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in happy_replacement.splitlines()
          )
          if tests.count(happy_marker) != 1:
              raise SystemExit("happy-path test marker mismatch")
          tests = tests.replace(happy_marker, happy_replacement)

          complete_marker = '''    assert not summary["decision"]["engineering_release_ready"]
          
          
              def test_frozen_manifest_mutation_fails_without_partial_output('''
          complete_replacement = '''    assert not summary["decision"]["engineering_release_ready"]
              assert summary["protocol_freeze_gates"]["unresolved_protocol"] == []
              assert summary["result_counts"]["unresolved_protocol_gate_count"] == 0
          
          
              def test_failed_review_is_explicit_and_blocks_protocol_readiness(
                  tmp_path: Path,
              ) -> None:
                  root = tmp_path / "data"
                  root.mkdir()
                  payload = _manifest(_two_patterns(root))
                  payload["evaluation_protocol"]["calibration_review_status"] = "failed"
                  summary = run_saed_external_validation_intake(
                      load_intake_manifest(
                          _write_manifest(tmp_path / "manifest.json", payload)
                      ),
                      root,
                      tmp_path / "out",
                  )
                  assert summary["decision"]["status"] == BLOCKED
                  assert not summary["decision"]["saed_protocol_freeze_ready"]
                  assert "calibration_review_passed" in summary[
                      "protocol_freeze_gates"
                  ]["unresolved_protocol"]
                  assert summary["result_counts"]["failed_review_count"] == 1
          
          
              def test_frozen_manifest_mutation_fails_without_partial_output('''
          complete_marker = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in complete_marker.splitlines()
          )
          complete_replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in complete_replacement.splitlines()
          )
          if tests.count(complete_marker) != 1:
              raise SystemExit("complete-path test marker mismatch")
          tests_path.write_text(
              tests.replace(complete_marker, complete_replacement),
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/saed-external-validation-intake.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = '''          assert not summary["decision"][
                        "predeclared_saed_external_evaluation_ready"
                    ]'''
          addition = '''          assert not summary["decision"][
                        "predeclared_saed_external_evaluation_ready"
                    ]
                    assert summary["evidence_gates"]["unresolved_evidence"] == []
                    assert summary["protocol_freeze_gates"]["unresolved_protocol"]
                    assert summary["result_counts"]["unresolved_protocol_gate_count"] > 0'''
          if workflow.count(marker) != 1:
              raise SystemExit("permanent workflow assertion marker mismatch")
          workflow_path.write_text(workflow.replace(marker, addition), encoding="utf-8")
          PY

      - name: Validate focused and full repository behavior
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src/mca
          pytest -q tests/test_saed_external_validation_intake.py
          pytest -q
          python -m build

      - name: Commit validated source and test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mca/saed_external_validation_intake.py \
            tests/test_saed_external_validation_intake.py \
            .github/workflows/saed-external-validation-intake.yml
          git commit -m "Clarify SAED source and protocol readiness gates"
          git push origin HEAD:agent/add-saed-validation-intake
