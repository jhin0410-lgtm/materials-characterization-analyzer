name: Apply Dryad dataset identity fix

on:
  pull_request:
    paths:
      - ".github/workflows/apply-dryad-dataset-identity-fix.yml"
      - "scripts/apply_dryad_dataset_identity_fix.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply dataset identity patch
        run: python scripts/apply_dryad_dataset_identity_fix.py

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused Dryad tests
        run: >-
          python -m pytest -q
          tests/test_dryad_hrtem_pilot_pair_audit.py
          tests/test_resolve_dryad_pilot_file_metadata.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Commit validated identity fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/resolve_dryad_pilot_file_metadata.py \
            src/mca/tem_external_validation_pilot_io.py \
            tests/test_dryad_hrtem_pilot_pair_audit.py \
            tests/test_resolve_dryad_pilot_file_metadata.py
          git commit -m "Bind Dryad files through official dataset DOI links [dryad-dataset-link-fixed]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
