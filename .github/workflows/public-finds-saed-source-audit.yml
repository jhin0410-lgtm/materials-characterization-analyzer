name: Public FINDS SAED source audit

on:
  pull_request:
    paths:
      - "case_studies/public_finds_saed/**"
      - "scripts/audit_public_finds_saed_source.py"
      - "tests/test_public_finds_saed_source_audit.py"
      - ".github/workflows/public-finds-saed-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run focused regression tests
        run: python -m pytest tests/test_public_finds_saed_source_audit.py -q

      - name: Audit checksum-bound FINDS SAED source
        run: |
          python scripts/audit_public_finds_saed_source.py \
            --config case_studies/public_finds_saed/case_config.json \
            --output outputs/public-finds-saed/source-audit

      - name: Verify source evidence and artifact hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/public-finds-saed/source-audit")
          summary = json.loads((output / "source_audit_summary.json").read_text())
          manifest = json.loads((output / "source_audit_manifest.json").read_text())
          assert summary["case_id"] == "public_finds_saed_source_audit"
          assert summary["source"]["record_id"] == 13748483
          assert summary["source"]["doi"] == "10.5281/zenodo.13748483"
          assert summary["readiness"]["archive_checksum_verified"]
          assert not summary["readiness"]["source_images_persisted"]
          assert not summary["readiness"]["saed_analyzer_executed"]
          assert not summary["readiness"]["material_identity_resolved"]
          assert not summary["readiness"]["phase_or_zone_axis_assignment_performed"]
          assert summary["result_counts"]["archive_member_count"] > 0
          assert manifest["artifact_count"] == 3
          for record in manifest["artifacts"]:
              path = output / record["path"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]
          print(json.dumps({
              "status": summary["readiness"]["status"],
              "license": summary["source"]["license"],
              "counts": summary["result_counts"],
              "projects": summary["projects"],
              "images": summary["images"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload source audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-finds-saed-source-audit-evidence
          path: outputs/public-finds-saed/source-audit
          if-no-files-found: error
          retention-days: 30
