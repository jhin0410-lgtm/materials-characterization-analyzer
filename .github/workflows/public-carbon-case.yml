name: Public carbon multimodal case

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "case_studies/public_carbon_multimodal/**"
      - "src/mca/handoff_bundle.py"
      - "scripts/__init__.py"
      - "scripts/discover_public_carbon_multimodal.py"
      - "scripts/run_public_carbon_multimodal_case.py"
      - "scripts/execute_public_carbon_multimodal_case.py"
      - "scripts/export_public_carbon_handoff_bundle.py"
      - "tests/test_public_carbon_multimodal_case.py"
      - "tests/test_public_carbon_source_adapter.py"
      - "tests/test_handoff_bundle.py"
      - ".github/workflows/public-carbon-case.yml"
  pull_request:
    paths:
      - "case_studies/public_carbon_multimodal/**"
      - "src/mca/handoff_bundle.py"
      - "scripts/__init__.py"
      - "scripts/discover_public_carbon_multimodal.py"
      - "scripts/run_public_carbon_multimodal_case.py"
      - "scripts/execute_public_carbon_multimodal_case.py"
      - "scripts/export_public_carbon_handoff_bundle.py"
      - "tests/test_public_carbon_multimodal_case.py"
      - "tests/test_public_carbon_source_adapter.py"
      - "tests/test_handoff_bundle.py"
      - ".github/workflows/public-carbon-case.yml"

permissions:
  contents: read

concurrency:
  group: public-carbon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-data-case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Discover and download minimal public source subset
        run: |
          python scripts/discover_public_carbon_multimodal.py \
            --config case_studies/public_carbon_multimodal/case_config.json \
            --output outputs/public-carbon-case/discovery \
            --download

      - name: Run provenance-first real-data case
        shell: bash
        run: |
          mkdir -p outputs/public-carbon-case/diagnostics
          set -o pipefail
          python scripts/execute_public_carbon_multimodal_case.py \
            --config case_studies/public_carbon_multimodal/case_config.json \
            --discovery outputs/public-carbon-case/discovery \
            --output outputs/public-carbon-case/result \
            2>&1 | tee outputs/public-carbon-case/diagnostics/case_run.log

      - name: Export cross-repository handoff bundle
        run: |
          python scripts/export_public_carbon_handoff_bundle.py \
            --config case_studies/public_carbon_multimodal/case_config.json \
            --result outputs/public-carbon-case/result

      - name: Run complete test suite
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee outputs/public-carbon-case/diagnostics/pytest.log

      - name: Show validation evidence
        if: always()
        run: |
          cat outputs/public-carbon-case/discovery/discovery_report.md
          if [ -f outputs/public-carbon-case/result/case_validation_report.md ]; then
            cat outputs/public-carbon-case/result/case_validation_report.md
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          downloads_path = Path("outputs/public-carbon-case/discovery/downloads.json")
          if downloads_path.exists():
              downloads = json.loads(downloads_path.read_text(encoding="utf-8"))
              for modality, record in downloads.items():
                  print(
                      f"{modality}: status={record.get('status')}; "
                      f"source={record.get('source_path')}; "
                      f"checksum_verified={record.get('source_checksum_verified')}"
                  )
          for name in ("case_summary.json", "characterization_handoff_bundle.json"):
              path = Path("outputs/public-carbon-case/result") / name
              if path.exists():
                  print(path.read_text(encoding="utf-8"))
          PY

      - name: Upload public case evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-carbon-multimodal-case
          path: outputs/public-carbon-case
          if-no-files-found: error
          retention-days: 14
