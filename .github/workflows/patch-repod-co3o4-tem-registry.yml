name: Apply RepOD Co3O4 TEM registry update

on:
  pull_request:
    paths:
      - "scripts/patch_repod_co3o4_tem_registry.py"
      - ".github/workflows/patch-repod-co3o4-tem-registry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-repod-co3o4-tem-figures
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply registry patch
        run: python scripts/patch_repod_co3o4_tem_registry.py
      - name: Validate focused registry and audit tests
        run: |
          python -m pip install -e ".[dev]" pillow
          pytest -q \
            tests/test_tem_external_validation_candidate_registry.py \
            tests/test_repod_co3o4_tem_figure_audit.py
      - name: Commit permanent registry files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            case_studies/tem_external_validation_candidate_registry/case_config.json \
            case_studies/tem_external_validation_candidate_registry/README.md \
            tests/test_tem_external_validation_candidate_registry.py
          if git diff --cached --quiet; then
            echo "No permanent registry changes to commit"
          else
            git commit -m "Add RepOD rendered Co3O4 TEM candidate"
            git fetch origin agent/audit-repod-co3o4-tem-figures
            git rebase origin/agent/audit-repod-co3o4-tem-figures
            git push origin HEAD:agent/audit-repod-co3o4-tem-figures
          fi
